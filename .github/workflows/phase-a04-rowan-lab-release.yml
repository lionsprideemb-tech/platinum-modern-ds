name: PHASE-A04 Rowan Lab Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a04-rowan-lab-release.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}
      - name: Download PHASE-A03 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a03-rowan-complete
          path: checkpoint
          run-id: 36016656064
          github-token: ${{ github.token }}
      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a04-venv"
          . "$RUNNER_TEMP/phase-a04-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow
      - name: Finish Rowan dialogue and regain field control
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a04-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys
          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a03-rowan-complete.dst")
          out=Path("phase-a04"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]
          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"PHASE-A04 stopped at {frame}")
          def pulse(key,held=12,settle=900):
              m=keymask(key); emu.input.keypad_add_key(m); run(held); emu.input.keypad_rm_key(m); run(settle)
          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"; emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})
          run(180); cap("rowan-closing-start")
          for i in range(1,11):
              pulse(Keys.KEY_A)
              cap(f"rowan-closing-a-{i:02d}")
          run(1200); cap("lab-release-stable")
          # Movement probe: if script has released field control the player moves south.
          pulse(Keys.KEY_DOWN,settle=450); cap("lab-field-control-probe")
          saved=out/"phase-a04-lab-released.dst"; emu.savestate.save_file(str(saved))
          (out/"phase-a04-meta.json").write_text(json.dumps({
              "gate":"PHASE_A04_ROWAN_LAB_RELEASE",
              "source_run":36016656064,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY
      - name: Upload PHASE-A04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a04-lab-released
          path: phase-a04/
          if-no-files-found: error
          retention-days: 30
