name: CM03 Community Moves Native Platinum

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/community_moves_cm01.json"
      - "data/community_moves_cm02.json"
      - "data/community_moves_cm03.json"
      - "tools/install_cm01_community_moves.py"
      - "tools/install_pt05d_animation_preview_harness.py"
      - ".github/workflows/cm03-community-moves-native-platinum.yml"

permissions:
  contents: read

concurrency:
  group: cm03-community-moves-native-platinum
  cancel-in-progress: true

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  build-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core ffmpeg

      - name: Checkout pinned Platinum and HG-Engine donor
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Rebuild complete 1025-species layer
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report cm03-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --gate "CM03_${tag}_RESOURCE_INSTALL" \
              --report "cm03-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore certified Gen 5-9 move foundation
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report cm03-modern-moves.json \
            --implemented-registry cm03-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves cm03-implemented-moves.txt \
            --report cm03-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report cm03-evolutions.json

      - name: Restore certified CM01 and CM02 community moves
        shell: bash
        run: |
          python3 tools/install_cm01_community_moves.py \
            vendor/pokeplatinum \
            --batch data/community_moves_cm01.json \
            --report cm03-cm01-restore.json
          test "$(jq -r '.last_community_id_this_pass' cm03-cm01-restore.json)" = "1026"

          python3 tools/install_cm01_community_moves.py \
            vendor/pokeplatinum \
            --batch data/community_moves_cm02.json \
            --report cm03-cm02-restore.json
          test "$(jq -r '.last_community_id_this_pass' cm03-cm02-restore.json)" = "1029"
          test "$(jq -r '.total_community_moves_materialized' cm03-cm02-restore.json)" = "6"

      - name: Install CM03 community moves
        shell: bash
        run: |
          python3 tools/install_cm01_community_moves.py \
            vendor/pokeplatinum \
            --batch data/community_moves_cm03.json \
            --report cm03-community-moves-install.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          moves = Path("vendor/pokeplatinum/generated/moves.txt").read_text().splitlines()
          expected = {
              1024: "MOVE_DRACONIC_FANGS",
              1026: "MOVE_ATOMIC_FIRE",
              1027: "MOVE_LIGHTNING_BULLET",
              1029: "MOVE_SMOLDER_BASH",
              1030: "MOVE_SHOCKING_EDGE",
              1031: "MOVE_KINETIC_BARRAGE",
              1032: "MOVE_FAIRY_SPHERES",
              1033: "MOVE_ZEPHYR_RUSH",
              1034: "MOVE_SEISMIC_FIST",
              1035: "MOVE_PRIMAL_BEAM",
              1036: "MAX_MOVES",
          }
          for move_id, token in expected.items():
              assert moves[move_id] == token, (move_id, moves[move_id], token)

          report = json.loads(Path("cm03-community-moves-install.json").read_text())
          assert report["community_moves_installed_this_pass"] == 6
          assert report["reserved_placeholder_count_added_this_pass"] == 0
          assert report["total_community_moves_materialized"] == 12
          print("CM03 registry layout: PASS")
          PY

      - name: Install native battle proof for Shocking Edge
        shell: bash
        run: |
          python3 tools/install_pt04c_runtime_harness.py \
            vendor/pokeplatinum --report cm03-base-party.json
          python3 tools/install_pt04c_summary_harness.py \
            vendor/pokeplatinum --report cm03-base-summary.json
          python3 tools/install_pt04c_pc_harness.py \
            vendor/pokeplatinum --report cm03-base-pc.json
          python3 tools/install_pt04c_battle_harness.py \
            vendor/pokeplatinum --report cm03-base-battle.json

          python3 tools/install_pt05d_animation_preview_harness.py \
            vendor/pokeplatinum \
            --move MOVE_SHOCKING_EDGE \
            --preview-id cm03_2054 \
            --report cm03-runtime-harness.json

          grep -q 'MOVE_SHOCKING_EDGE' vendor/pokeplatinum/src/field_map_change.c

      - name: Verify CM03 native animation sources
        shell: bash
        run: |
          cmp vendor/pokeplatinum/res/moves/shocking_edge/anim.s vendor/pokeplatinum/res/moves/slash/anim.s
          cmp vendor/pokeplatinum/res/moves/kinetic_barrage/anim.s vendor/pokeplatinum/res/moves/strength/anim.s
          cmp vendor/pokeplatinum/res/moves/fairy_spheres/anim.s vendor/pokeplatinum/res/moves/double_slap/anim.s
          cmp vendor/pokeplatinum/res/moves/zephyr_rush/anim.s vendor/pokeplatinum/res/moves/jump_kick/anim.s
          cmp vendor/pokeplatinum/res/moves/seismic_fist/anim.s vendor/pokeplatinum/res/moves/rock_smash/anim.s
          cmp vendor/pokeplatinum/res/moves/primal_beam/anim.s vendor/pokeplatinum/res/moves/dragon_pulse/anim.s

      - name: Build native Platinum with CM01 through CM03
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Run Shocking Edge native runtime proof
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cm03-venv"
          . "$RUNNER_TEMP/cm03-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)
          mp4 = out / "cm03-shocking-edge-native-platinum.mp4"

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("CM03 native Platinum ROM did not boot")

          fps = 15
          sample_every = 4
          proc = subprocess.Popen([
              "ffmpeg", "-y", "-loglevel", "error",
              "-f", "rawvideo", "-pix_fmt", "rgb24",
              "-s", "256x192", "-r", str(fps), "-i", "-",
              "-an", "-c:v", "libx264", "-preset", "veryfast",
              "-crf", "25", "-pix_fmt", "yuv420p", "-movflags", "+faststart",
              str(mp4)
          ], stdin=subprocess.PIPE)

          current = 0
          written = 0

          def cycle(frames):
              global current, written
              for _ in range(frames):
                  emu.cycle(False)
                  current += 1
                  if not emu.is_running():
                      raise SystemExit(f"CM03 emulator stopped at frame {current}")
                  if current % sample_every == 0:
                      image = emu.screenshot().crop((0, 0, 256, 192)).convert("RGB")
                      proc.stdin.write(image.tobytes())
                      written += 1

          def pulse_a(held=20, settle=180):
              emu.input.keypad_add_key(keymask(Keys.KEY_A))
              cycle(held)
              emu.input.keypad_rm_key(keymask(Keys.KEY_A))
              cycle(settle)

          try:
              cycle(1500)
              for _ in range(14):
                  pulse_a()
              cycle(800)
              emu.screenshot().save(out / "cm03-shocking-edge-final.png")
          finally:
              try:
                  if proc.stdin is not None:
                      proc.stdin.close()
                  rc = proc.wait()
                  if rc != 0:
                      raise SystemExit(f"ffmpeg failed with exit code {rc}")
              finally:
                  emu.destroy()

          if written < 100 or not mp4.exists() or mp4.stat().st_size < 10_000:
              raise SystemExit("CM03 runtime video proof is incomplete")

          meta = {
              "gate": "CM03_SHOCKING_EDGE_NATIVE_RUNTIME",
              "runtime": "pokeplatinum",
              "move_id": 1030,
              "move": "MOVE_SHOCKING_EDGE",
              "mechanics": {
                  "type": "Electric",
                  "class": "Physical",
                  "power": 80,
                  "accuracy": 100,
                  "pp": 10,
                  "effect": "BATTLE_EFFECT_PARALYZE_HIT",
                  "effect_chance": 10
              },
              "animation": "native Platinum Slash animation",
              "captured_frames": written,
              "emulator_cycles": current,
              "mp4": mp4.name,
              "mp4_bytes": mp4.stat().st_size,
              "visual_review_required": True
          }
          (out / "cm03-meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload CM03 proof
        uses: actions/upload-artifact@v4
        with:
          name: cm03-community-moves-native-platinum-proof
          path: |
            cm03-community-moves-install.json
            cm03-runtime-harness.json
            runtime-preview/cm03-shocking-edge-native-platinum.mp4
            runtime-preview/cm03-shocking-edge-final.png
            runtime-preview/cm03-meta.json
          if-no-files-found: error
          retention-days: 14

      - name: CM03 summary
        shell: bash
        run: |
          {
            echo "## CM03 community move implementation"
            echo
            echo "- Native runtime: pokeplatinum"
            echo "- CM01 + CM02 retained at IDs 1024-1029"
            echo "- Six new moves installed at IDs 1030-1035"
            echo "- All six animation sources verified against native Platinum donors"
            echo "- Shocking Edge exercised in a real native Platinum battle"
            echo "- Community move total: 12"
          } >> "$GITHUB_STEP_SUMMARY"
