name: PB02AP Open Starter Briefcase

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ap-open-starter-briefcase.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and starter-control checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10808696362/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/route201-briefcase-control.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ap-venv"
          . "$RUNNER_TEMP/pb02ap-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish Barry line and interact with briefcase
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ap-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/route201-briefcase-control.dst")
          out=Path("pb02ap-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AP stopped at {frame}")

          def pulse(key,held=12,settle=800):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("barry-happy-line")
          for i in range(1,4):
              pulse(Keys.KEY_A,12,900)
              cap(f"finish-dialogue-{i:02d}")

          run(900); cap("free-control")

          # Briefcase is immediately to the west side of the player cluster.
          pulse(Keys.KEY_LEFT,12,350); cap("left-1")
          pulse(Keys.KEY_LEFT,12,350); cap("left-2")
          pulse(Keys.KEY_A,12,1400); cap("briefcase-interaction")
          run(1200); cap("starter-selector-stable")

          saved=out/"starter-selector-open.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02ap-meta.json").write_text(json.dumps({
              "gate":"PB02AP_OPEN_STARTER_BRIEFCASE",
              "source_artifact":10808696362,
              "route":"A x3, LEFT x2, A",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"select starter and certify first rival battle"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AP proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ap-open-starter-briefcase-proof
          path: pb02ap-play/
          if-no-files-found: error
          retention-days: 14
