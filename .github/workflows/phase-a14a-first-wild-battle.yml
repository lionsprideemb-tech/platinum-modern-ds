name: PHASE-A14A First Normal Wild Battle

on:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a14a-first-wild-battle.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  encounter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download certified Route 202 control checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a13h-route202-control-proof
          path: checkpoint
          run-id: 36151070809
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a14a-venv"
          . "$RUNNER_TEMP/phase-a14a-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Trigger a normal Route 202 wild encounter
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a14a-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          X=0x021C5F0E
          Z=0x021C5F2E
          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a13h-route202-control-confirmed.dst")
          out=Path("phase-a14a")
          out.mkdir(exist_ok=True)

          emu=DeSmuME()
          emu.open(str(rom))
          emu.savestate.load_file(str(state))
          frame=0
          captures=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame+=1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A14A stopped at {frame}")

          def xy():
              return (
                  emu.memory.unsigned.read_short(X),
                  emu.memory.unsigned.read_short(Z),
              )

          def pulse(key,held=10,settle=130):
              m=keymask(key)
              emu.input.keypad_add_key(m)
              run(held)
              emu.input.keypad_rm_key(m)
              run(settle)

          def snap(label):
              name=f"{len(captures):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              captures.append({"stage":label,"frame":frame,"file":name,"xy":xy()})

          def lower_stats(img):
              rgb=img.convert("RGB")
              tan=red=total=0
              for yy in range(196,382,4):
                  for xx in range(4,252,4):
                      r,g,b=rgb.getpixel((xx,yy))
                      total+=1
                      if 120<=r<=220 and 100<=g<=200 and 45<=b<=140 and r>g>b:
                          tan+=1
                      if r>=165 and g<=115 and b<=115 and r>g*1.45:
                          red+=1
              return tan/total,red/total

          def is_overworld(img):
              return lower_stats(img)[0]>=0.35

          def is_fight_menu(img):
              return lower_stats(img)[1]>=0.10

          run(180)
          snap("route202-grass-start")

          # Walk back and forth through the same certified Route 202 grass
          # patch until the vanilla encounter system starts a normal battle.
          encountered=False
          steps=0
          for i in range(1,121):
              key=Keys.KEY_RIGHT if i%2 else Keys.KEY_LEFT
              pulse(key)
              steps=i
              if not is_overworld(emu.screenshot()):
                  encountered=True
                  snap("wild-encounter-transition")
                  break

          if not encountered:
              raise SystemExit("No normal Route 202 wild encounter after 120 grass steps")

          # Let the normal battle introduction settle, then advance only intro
          # text until the player's command menu is visible.
          run(700)
          for i in range(1,25):
              img=emu.screenshot()
              if is_fight_menu(img):
                  break
              pulse(Keys.KEY_A,12,350)
          else:
              raise SystemExit("Wild battle did not reach the normal command menu")

          snap("wild-battle-command-menu")
          final=out/"phase-a14a-wild-battle-command.dst"
          emu.savestate.save_file(str(final))

          (out/"phase-a14a-meta.json").write_text(json.dumps({
              "gate":"PHASE_A14A_FIRST_NORMAL_WILD_BATTLE",
              "source_run":36151070809,
              "source_state":state.name,
              "grass_steps_before_encounter":steps,
              "battle_command_reached":True,
              "output_state":final.name,
              "captures":captures,
              "result":"PASS",
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A14A evidence
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a14a-first-wild-battle
          path: phase-a14a/
          if-no-files-found: error
          retention-days: 30
