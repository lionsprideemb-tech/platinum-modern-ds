name: PHASE-A12 Twinleaf Home Parcel

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a12-twinleaf-home-parcel.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A11F checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a11f-route201-west
          path: checkpoint
          run-id: 36025127693
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a12-venv"
          . "$RUNNER_TEMP/phase-a12-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Enter Twinleaf home and complete Journal Parcel sequence
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a12-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a11f-route201-west-final.dst")
          out=Path("phase-a12"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A12 stopped at {frame}")

          def pulse(key, held=10, settle=170):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(240); cap("twinleaf-turn-start")

          # Route 201 south entrance -> Twinleaf player house approach.
          for i in range(28):
              pulse(Keys.KEY_DOWN)
              if i in (7,15,23,27): cap(f"south-{i+1:02d}")
          for i in range(7):
              pulse(Keys.KEY_RIGHT)
          cap("player-house-row")
          pulse(Keys.KEY_DOWN, held=12, settle=1000)
          run(900); cap("inside-player-house")

          # Approach Mom from the entry tile and start her Pokédex-return sequence.
          pulse(Keys.KEY_UP, settle=300)
          pulse(Keys.KEY_RIGHT, settle=300)
          pulse(Keys.KEY_A, settle=1200)
          cap("mom-sequence-start")

          # Advance Journal + rival's mom + Parcel dialogue/fanfare safely.
          for i in range(1,19):
              pulse(Keys.KEY_A, held=12, settle=900)
              if i in (4,8,12,16,18): cap(f"mom-sequence-a-{i:02d}")

          run(1800); cap("parcel-sequence-stable")
          saved=out/"phase-a12-post-parcel.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a12-meta.json").write_text(json.dumps({
              "gate":"PHASE_A12_TWINLEAF_HOME_PARCEL",
              "source_run":36025127693,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a12-post-parcel
          path: phase-a12/
          if-no-files-found: error
          retention-days: 30
