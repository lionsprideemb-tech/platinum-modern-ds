name: MR10E1 Restored Ability Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr10-16bit-ability-storage
    paths:
      - "tools/install_mr10e1_restored_scalar_batch.py"
      - "data/mr10_ability_partition_16bit_full_identity.json"
      - ".github/workflows/mr10e1-restored-ability-runtime.yml"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-pip wget xz-utils libpng-dev rsync jq

      - name: Checkout pinned sources
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"
          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply Mercury overlay
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Restore modern move namespace
        run: |
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum
          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report modern-moves.json \
            --implemented-registry implemented-moves.txt

      - name: Rebuild canonical Ability runtime
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report canonical-namespace.json \
            --implemented-registry implemented-abilities.txt
          python3 tools/run_mr08_canonical_stack.py \
            vendor/pokeplatinum \
            --implemented-registry implemented-abilities.txt \
            --reports-dir canonical-reports \
            --report canonical-stack.json
          test "$(jq -r '.status' canonical-stack.json)" = "PASS"

      - name: Apply approved canonical Redux overrides
        run: |
          python3 tools/install_mr10b1_er_safe_scalar_overrides.py \
            vendor/pokeplatinum --partition data/mr10_safe_ability_partition.json \
            --report b1.json
          python3 tools/install_mr10b2_safe_defensive_reaction_overrides.py \
            vendor/pokeplatinum --partition data/mr10_safe_ability_partition.json \
            --report b2.json
          python3 tools/install_mr10b3_safe_precision_offense_status.py \
            vendor/pokeplatinum --partition data/mr10_safe_ability_partition.json \
            --report b3.json

      - name: Upgrade to 16-bit persistence and full namespace
        run: |
          python3 tools/install_mr10_16bit_ability_storage.py \
            vendor/pokeplatinum --report storage.json
          python3 tools/install_mr10a2_16bit_full_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --partition data/mr10_ability_partition_16bit_full_identity.json \
            --report full-namespace.json
          test "$(jq -r '.status' full-namespace.json)" = "PASS"

      - name: Implement restored scalar batch E1
        run: |
          python3 tools/install_mr10e1_restored_scalar_batch.py \
            vendor/pokeplatinum \
            --partition data/mr10_ability_partition_16bit_full_identity.json \
            --implemented-registry implemented-abilities.txt \
            --report mr10e1.json
          test "$(jq -r '.status' mr10e1.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr10e1.json)" = "8"
          test "$(jq -r '.historical_runtime_missing_after_batch' mr10e1.json)" = "118"

      - name: Compile and build ROM
        working-directory: vendor/pokeplatinum
        run: |
          sudo make skrew
          make configure
          make -j2
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage proof
        run: |
          mkdir -p proof
          cp storage.json full-namespace.json mr10e1.json proof/
          cp "$BUILD/pokeplatinum.us.nds" proof/Pokemon_Mercury_MR10E1.nds
          sha256sum proof/Pokemon_Mercury_MR10E1.nds > proof/SHA256SUMS.txt

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr10e1-restored-ability-runtime
          path: proof/
          if-no-files-found: error
          retention-days: 14
