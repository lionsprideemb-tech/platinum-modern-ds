name: MP05B Modern Ability Data Assignment

on:
  push:
    branches:
      - feature/modern-platinum-fast
    paths:
      - ".github/workflows/mp05b-modern-ability-data.yml"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends             bison flex g++ gcc-arm-none-eabi git make ninja-build             pkg-config python3 python3-venv python3-pip wget xz-utils             libpng-dev rsync jq fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set             /include/constants/moves.h             /include/constants/move_effects.h             /data/Moves.c             /data/Species.c             /data/BaseExperienceTable.c             /data/IconPaletteTable.c             /data/HeightTable.c             /data/SpriteOffsets.c             /data/Evolutions.c             /data/graphics/sprites/             /data/learnsets/learnsets.json             /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply PB04 overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Install compact ability IDs before species import
        shell: bash
        run: |
          python3 tools/install_mp05a_ability_namespace.py             vendor/pokeplatinum             --report mp05b-ability-namespace.json

      - name: Rebuild species with modern primary and secondary abilities
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum             --through 1025             --output vendor/pokeplatinum/generated/species.txt             --report mp05b-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py               vendor/pokeplatinum vendor/hg-engine               --start-dex "$start" --end-dex "$end"               --gate "MP05B_${tag}_RESOURCE_INSTALL"               --report "mp05b-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          reports=[
              json.loads(Path(f"mp05b-{tag}.json").read_text())
              for tag in ("GEN5","GEN6","GEN7","GEN8","GEN9")
          ]
          missing=[]
          for report in reports:
              missing.extend(report["exceptions"]["unsupported_abilities"])

          expected={
              ("SPECIES_MORPEKO", "ABILITY_HUNGER_SWITCH"),
              ("SPECIES_PALAFIN", "ABILITY_ZERO_TO_HERO"),
              ("SPECIES_TATSUGIRI", "ABILITY_COMMANDER"),
              ("SPECIES_TERAPAGOS", "ABILITY_TERA_SHIFT"),
          }
          actual={(row["species"],row["donor"]) for row in missing}
          if actual != expected:
              raise SystemExit(
                  f"unexpected ability fallback set: {sorted(actual)}"
              )
          print("Only four explicitly deferred stateful abilities remain:", sorted(actual))

          checks={
              "victini":"ABILITY_VICTORY_STAR",
              "golisopod":"ABILITY_EMERGENCY_EXIT",
              "regieleki":"ABILITY_TRANSISTOR",
              "baxcalibur":"ABILITY_THERMAL_EXCHANGE",
              "kingambit":"ABILITY_SUPREME_OVERLORD",
              "pecharunt":"ABILITY_POISON_PUPPETEER",
          }
          for species,ability in checks.items():
              path=Path("vendor/pokeplatinum/res/pokemon")/species/"data.json"
              data=json.loads(path.read_text())
              if ability not in data["abilities"]:
                  raise SystemExit(
                      f"{species}: expected {ability}, got {data['abilities']}"
                  )
              print(species, data["abilities"])
          PY

      - name: Restore MP04 moves learnsets and evolutions
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py             vendor/pokeplatinum vendor/hg-engine             --report mp05b-modern-moves.json             --implemented-registry mp05b-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 1025             --implemented-moves mp05b-implemented-moves.txt             --report mp05b-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 1025             --report mp05b-evolutions.json

      - name: Generate Mercury title
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mp05b-venv"
          . "$RUNNER_TEMP/mp05b-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Build full ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage MP05B artifact
        shell: bash
        run: |
          mkdir -p mp05b
          cp "$BUILD/pokeplatinum.us.nds" mp05b/Pokemon_Mercury_Modern_Platinum_MP05B.nds
          cp mp05b-ability-namespace.json mp05b/
          cp mp05b-GEN5.json mp05b/
          cp mp05b-GEN6.json mp05b/
          cp mp05b-GEN7.json mp05b/
          cp mp05b-GEN8.json mp05b/
          cp mp05b-GEN9.json mp05b/
          sha256sum mp05b/Pokemon_Mercury_Modern_Platinum_MP05B.nds > mp05b/SHA256SUMS.txt
          {
            echo "MP05B modern ability data"
            echo "Modern compact ability constants available: 132"
            echo "Primary/secondary modern abilities assigned to species: yes"
            echo "Deferred stateful abilities: 4"
            echo "Battle mechanics for new IDs: not yet certified; next MP05C family ports"
            echo "Runtime playtest: intentionally skipped"
          } > mp05b/MP05B_MANIFEST.txt

      - name: Upload MP05B proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-modern-platinum-mp05b-ability-data
          path: mp05b/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## MP05B modern ability data"
            echo
            echo "- Modern ability namespace: PASS"
            echo "- Species primary/secondary ability assignment: PASS"
            echo "- Only four stateful ability families remain unassigned: PASS"
            echo "- Full ROM compile: PASS"
            echo "- Battle-effect mechanics remain the next MP05C stage."
            echo "- Runtime playtest: intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"
