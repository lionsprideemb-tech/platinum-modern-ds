name: PB02C Rowan Poke Ball To Player Choice

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02c-pokeball-to-player-choice.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download sealed PB01 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01-artifact.zip
          unzip -q pb01-artifact.zip -d pb01-artifact
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02c-venv"
          . "$RUNNER_TEMP/pb02c-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Play through Poke Ball touch sequence
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02c-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          out=Path("pb02c-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom))
          frame=0; captures=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"emulator stopped at {frame}")

          def pulse(key, held=12, settle=240):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(captures):02d}-{label}-{frame:05d}.png"
              im.save(out/name)
              captures.append({"stage":label,"frame":frame,"file":name})

          def touch(x,y,held=30,settle=480):
              emu.input.touch_set_pos(x,y); run(held)
              emu.input.touch_release(); run(settle)

          try:
              run(16000); cap("title")
              pulse(Keys.KEY_START,20,700); cap("rowan-entry")
              for _ in range(6): pulse(Keys.KEY_A,12,300)
              pulse(Keys.KEY_DOWN,12,120)
              pulse(Keys.KEY_DOWN,12,120)
              pulse(Keys.KEY_A,12,420)
              cap("world-intro-after-no-info")

              pulse(Keys.KEY_A,12,320); cap("pokeball-shown")
              pulse(Keys.KEY_A,12,320); cap("touch-pokeball-prompt")

              # Touch the center of the large Poké Ball on the lower screen.
              touch(128,94,30,600); cap("pokeball-touch-result")

              for i in range(1,9):
                  pulse(Keys.KEY_A,12,360)
                  cap(f"post-pokeball-a-{i:02d}")

              run(600); cap("stable-end")
          finally:
              emu.destroy()

          (out/"pb02c-meta.json").write_text(json.dumps({
              "gate":"PB02C_POKEBALL_TO_PLAYER_CHOICE",
              "touch":{"x":128,"y":94},
              "last_frame":frame,
              "captures":captures,
              "visual_review_required":True
          },indent=2)+"\n")
          PY

      - name: Upload PB02C screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02c-pokeball-to-player-choice-proof
          path: pb02c-play/
          if-no-files-found: warn
          retention-days: 14
