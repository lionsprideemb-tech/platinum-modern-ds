name: PHASE-A05 Exit Rowan Lab

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a05-exit-rowan-lab.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A04 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a04-lab-free-control
          path: checkpoint
          run-id: 36017158071
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a05-venv"
          . "$RUNNER_TEMP/phase-a05-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Walk out of Rowan lab
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a05-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a04-lab-free-control.dst")
          out=Path("phase-a05"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A05 stopped at {frame}")

          def pulse(key, held=12, settle=500):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(180); cap("lab-free-start")
          for i in range(1,13):
              pulse(Keys.KEY_DOWN)
              if i in (3,6,9,12):
                  cap(f"walk-south-{i:02d}")

          run(1800); cap("outside-sequence-stable")
          saved=out/"phase-a05-outside-lab.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a05-meta.json").write_text(json.dumps({
              "gate":"PHASE_A05_EXIT_ROWAN_LAB",
              "source_run":36017158071,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a05-outside-lab
          path: phase-a05/
          if-no-files-found: error
          retention-days: 30
