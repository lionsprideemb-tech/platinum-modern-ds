name: DS01 Sprite Library Duplicate Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - assets/ds01-community-sprites-20260922
    paths:
      - "tools/audit_ds01_sprite_library.py"
      - ".github/workflows/ds01-sprite-library-audit.yml"
      - "staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip"
  push:
    branches:
      - audit/ds01-sprite-dedup-20260928
    paths:
      - "tools/audit_ds01_sprite_library.py"
      - ".github/workflows/ds01-sprite-library-audit.yml"
      - "staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sprite audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install "Pillow>=10,<13"

      - name: Syntax gate
        run: python -m py_compile tools/audit_ds01_sprite_library.py

      - name: Audit staged community sprite archive
        run: |
          python tools/audit_ds01_sprite_library.py \
            staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip \
            --json data/ds01_sprite_library_audit.json \
            --markdown docs/DS01_SPRITE_LIBRARY_AUDIT.md \
            --near-radius 4 \
            --path-contains "/hg_engine_ready/data/graphics/sprites/"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: ds01-sprite-library-audit
          path: |
            data/ds01_sprite_library_audit.json
            docs/DS01_SPRITE_LIBRARY_AUDIT.md

      - name: Upload source archive for deep audit
        uses: actions/upload-artifact@v4
        with:
          name: ds01-sprite-source-archive
          path: staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip
          compression-level: 0

      - name: Commit audit reports on push runs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ds01_sprite_library_audit.json docs/DS01_SPRITE_LIBRARY_AUDIT.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged."
          else
            git commit -m "Record DS01 sprite duplicate audit"
            git push
          fi
