name: PB02B Rowan Intro Corrected Play

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02b-rowan-intro-corrected.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download sealed PB01 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip \
            > pb01-artifact.zip
          unzip -q pb01-artifact.zip -d pb01-artifact
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02b-venv"
          . "$RUNNER_TEMP/pb02b-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Play through help menu and continue Rowan intro
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02b-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom = Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          out = Path("pb02b-play")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("PB02B ROM did not boot")

          frame = 0
          captures = []

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02B emulator stopped at {frame}")

          def pulse(key, held=12, settle=300):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              run(held)
              emu.input.keypad_rm_key(mask)
              run(settle)

          def cap(label):
              img = emu.screenshot()
              name = f"{len(captures):02d}-{label}-{frame:05d}.png"
              img.save(out / name)
              colors = img.convert("RGB").getcolors(maxcolors=256*384)
              unique = len(colors) if colors is not None else 256*384
              captures.append({"stage":label,"frame":frame,"file":name,"unique_colors":unique})

          try:
              run(16000)
              cap("title")
              pulse(Keys.KEY_START, held=20, settle=700)
              cap("intro-entry")

              # Six A presses are proven to reach the CONTROL/ADVENTURE/NO INFO menu.
              for i in range(1, 7):
                  pulse(Keys.KEY_A)
                  cap(f"pre-menu-a-{i:02d}")

              # Choose NO INFO NEEDED instead of entering the controls tutorial.
              pulse(Keys.KEY_DOWN, held=8, settle=120)
              cap("help-menu-down-1")
              pulse(Keys.KEY_DOWN, held=8, settle=120)
              cap("help-menu-no-info-selected")
              pulse(Keys.KEY_A, held=12, settle=400)
              cap("help-menu-no-info-confirmed")

              # Continue carefully through Rowan's actual introduction.
              for i in range(1, 7):
                  pulse(Keys.KEY_A, held=12, settle=360)
                  cap(f"rowan-continue-{i:02d}")

              run(600)
              cap("stable-end")
          finally:
              emu.destroy()

          meta = {
              "gate":"PB02B_ROWAN_INTRO_CORRECTED_REAL_PLAY",
              "source_rom_sha256":"87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16",
              "inputs":[
                  "START",
                  "A x6",
                  "DOWN",
                  "DOWN",
                  "A (NO INFO NEEDED)",
                  "A x6"
              ],
              "last_frame":frame,
              "captures":captures,
              "visual_review_required":True
          }
          (out/"pb02b-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload corrected Rowan play proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02b-rowan-corrected-play-proof
          path: pb02b-play/
          if-no-files-found: error
          retention-days: 14
