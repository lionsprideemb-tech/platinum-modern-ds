name: PHASE-A12C Correct Home Entry Parcel

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a12c-correct-home-entry-parcel.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A12B checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a12b-post-parcel
          path: checkpoint
          run-id: 36026859055
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a12c-venv"
          . "$RUNNER_TEMP/phase-a12c-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Route around mailbox enter home and complete Parcel event
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a12c-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a12b-post-parcel.dst")
          out=Path("phase-a12c"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A12C stopped at {frame}")

          def pulse(key, held=10, settle=220):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(180); cap("mailbox-block-start")

          # Player is pinned just north of the player's mailbox.
          pulse(Keys.KEY_LEFT); cap("clear-mailbox-left")
          pulse(Keys.KEY_DOWN); pulse(Keys.KEY_DOWN); cap("below-mailbox")
          for _ in range(3): pulse(Keys.KEY_RIGHT)
          cap("below-front-door")
          pulse(Keys.KEY_UP, held=12, settle=1200)
          run(1000); cap("inside-home-confirm")

          # Exterior warp lands at (6,10); Mom is at (7,8).
          pulse(Keys.KEY_UP)
          pulse(Keys.KEY_RIGHT)
          pulse(Keys.KEY_A, held=12, settle=800)
          cap("mom-journal-start")

          # Journal + rival's mom + Parcel sequence.
          for i in range(1,29):
              pulse(Keys.KEY_A, held=12, settle=430)
              if i in (6,12,18,24,28):
                  cap(f"story-a-{i:02d}")

          run(1600); cap("post-parcel-stable")
          saved=out/"phase-a12c-post-parcel.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a12c-meta.json").write_text(json.dumps({
              "gate":"PHASE_A12C_CORRECT_HOME_ENTRY_PARCEL",
              "source_run":36026859055,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A12C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a12c-post-parcel
          path: phase-a12c/
          if-no-files-found: error
          retention-days: 30
