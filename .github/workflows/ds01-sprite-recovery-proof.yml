name: DS01 Sprite Recovery Proof

on:
  pull_request:
    branches:
      - assets/ds01-community-sprites-20260922
    paths:
      - "tools/render_ds01_sprite_recovery_proof.py"
      - ".github/workflows/ds01-sprite-recovery-proof.yml"
      - "data/ds01_sprite_quarantine.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Render recovery proof
        run: |
          python tools/render_ds01_sprite_recovery_proof.py \
            staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip \
            --out ds01_sprite_recovery_proof.png \
            --json ds01_sprite_recovery_proof.json
      - name: Upload recovery proof
        uses: actions/upload-artifact@v4
        with:
          name: ds01-sprite-recovery-proof
          path: |
            ds01_sprite_recovery_proof.png
            ds01_sprite_recovery_proof.json
