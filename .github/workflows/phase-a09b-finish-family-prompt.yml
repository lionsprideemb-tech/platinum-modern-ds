name: PHASE-A09B Finish Dawn Family Prompt

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a09b-finish-family-prompt.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A09 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a09-sandgem-free-control
          path: checkpoint
          run-id: 36019525334
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a09b-venv"
          . "$RUNNER_TEMP/phase-a09b-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Finish Dawn dialogue and verify Sandgem control
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a09b-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a09-sandgem-free-control.dst")
          out=Path("phase-a09b"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A09B stopped at {frame}")

          def pulse(key, held=12, settle=1100):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(180); cap("family-prompt-page-2")
          for i in range(1,5):
              pulse(Keys.KEY_A)
              cap(f"finish-family-a-{i:02d}")

          run(2200); cap("dawn-left-stable")
          pulse(Keys.KEY_DOWN, held=24, settle=700)
          cap("control-probe-down")

          saved=out/"phase-a09b-sandgem-control.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a09b-meta.json").write_text(json.dumps({
              "gate":"PHASE_A09B_FINISH_DAWN_FAMILY_PROMPT",
              "source_run":36019525334,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A09B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a09b-sandgem-control
          path: phase-a09b/
          if-no-files-found: error
          retention-days: 30
