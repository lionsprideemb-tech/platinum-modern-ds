name: PB02AW2 Direct Verity Lakefront Route

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02aw2-direct-verity.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download certified Route 201 partner state
        uses: actions/download-artifact@v4
        with:
          name: pb02av-route201-partner-certified
          path: checkpoint
          run-id: 36007613928
          github-token: ${{ github.token }}

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02aw2-venv"
          . "$RUNNER_TEMP/pb02aw2-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Take direct west-then-north route
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02aw2-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/route201-partner-certified.dst")
          out=Path("pb02aw2-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"PB02AW2 stopped at {frame}")

          def pulse(key,held=10,settle=150):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          cap("route201-partner-start")

          for i in range(1,32):
              pulse(Keys.KEY_LEFT)
              if i in (10,20,31): cap(f"west-{i:02d}")

          for i in range(1,14):
              pulse(Keys.KEY_UP)
              if i in (5,10,13): cap(f"north-{i:02d}")

          run(1200); cap("verity-trigger-probe")

          # If Lakefront's automatic 'We're at the lake' dialogue fired,
          # advance it and allow the scripted warp into Lake Verity.
          for i in range(1,5):
              pulse(Keys.KEY_A,12,700)
              cap(f"lakefront-a-{i:02d}")

          run(1800); cap("lake-verity-entry-probe")

          saved=out/"direct-verity-probe.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02aw2-meta.json").write_text(json.dumps({
              "gate":"PB02AW2_DIRECT_VERITY_ROUTE",
              "source_artifact":10810553417,
              "route":"LEFT x31, UP x13",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AW2 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02aw2-direct-verity-proof
          path: pb02aw2-play/
          if-no-files-found: error
          retention-days: 14
