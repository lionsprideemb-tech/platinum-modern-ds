name: PB02U Barry House Interior Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02u-barry-house-checkpoint.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Twinleaf checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10789223904/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/twinleaf-exterior.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02u-venv"
          . "$RUNNER_TEMP/pb02u-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Enter Barry house, save state, and probe interior
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02u-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/twinleaf-exterior.dst")
          out=Path("pb02u-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=300):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          # Certified route from exterior checkpoint into Barry house.
          for _ in range(8): pulse(Keys.KEY_LEFT,12,240)
          pulse(Keys.KEY_UP,12,320)
          pulse(Keys.KEY_LEFT,12,320)
          pulse(Keys.KEY_LEFT,12,320)
          pulse(Keys.KEY_UP,12,1200)
          run(800)
          cap("barry-house-1f-arrival")

          saved=out/"barry-house-1f.dst"
          emu.savestate.save_file(str(saved))
          cap("barry-house-checkpoint-saved")

          # Map probe from the entrance, one tile at a time.
          for i in range(1,5):
              pulse(Keys.KEY_LEFT,12,240); cap(f"left-{i:02d}")
          for i in range(1,6):
              pulse(Keys.KEY_UP,12,240); cap(f"up-{i:02d}")
          for i in range(1,5):
              pulse(Keys.KEY_RIGHT,12,240); cap(f"right-{i:02d}")
          pulse(Keys.KEY_A,12,500); cap("interaction-probe")
          run(700); cap("probe-stable")

          meta={
              "gate":"PB02U_BARRY_HOUSE_1F_CHECKPOINT",
              "rom_sha256":hashlib.sha256(rom.read_bytes()).hexdigest(),
              "source_checkpoint_artifact":10789223904,
              "state_file":saved.name,
              "last_resumed_frame":frame,
              "captures":caps,
              "visual_review_required":True
          }
          (out/"pb02u-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload Barry house checkpoint and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02u-barry-house-1f-checkpoint
          path: pb02u-play/
          if-no-files-found: error
          retention-days: 14
