name: PHASE-A07 Finish Sandgem Tour

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a07-finish-sandgem-tour.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A06 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a06-sandgem-free-control
          path: checkpoint
          run-id: 36018079020
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a07-venv"
          . "$RUNNER_TEMP/phase-a07-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Complete Dawn mentor tour and restore Sandgem control
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a07-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a06-sandgem-free-control.dst")
          out=Path("phase-a07"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A07 stopped at {frame}")

          def pulse(key, held=12, settle=1500):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(180); cap("mentor-dialogue")
          for i in range(1,6):
              pulse(Keys.KEY_A)
              cap(f"mentor-tour-a-{i:02d}")

          run(1000); cap("tour-finished-stable")
          pulse(Keys.KEY_DOWN, held=36, settle=700)
          cap("sandgem-control-probe")
          run(900); cap("sandgem-control-stable")

          saved=out/"phase-a07-sandgem-tour-complete.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a07-meta.json").write_text(json.dumps({
              "gate":"PHASE_A07_FINISH_SANDGEM_TOUR",
              "source_run":36018079020,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a07-sandgem-tour-complete
          path: phase-a07/
          if-no-files-found: error
          retention-days: 30
