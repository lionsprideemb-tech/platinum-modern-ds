name: CM01 Community Moves Native Platinum

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/community_moves_cm01.json"
      - "tools/install_cm01_community_moves.py"
      - "tools/install_pt05d_animation_preview_harness.py"
      - ".github/workflows/cm01-community-moves-native-platinum.yml"

permissions:
  contents: read

concurrency:
  group: cm01-community-moves-native-platinum
  cancel-in-progress: true

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  build-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends             bison flex g++ gcc-arm-none-eabi git make ninja-build             pkg-config python3 python3-venv python3-pip wget xz-utils             libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core ffmpeg

      - name: Checkout pinned Platinum and HG-Engine donor
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set             /include/constants/moves.h             /include/constants/move_effects.h             /data/Moves.c             /data/Species.c             /data/BaseExperienceTable.c             /data/IconPaletteTable.c             /data/HeightTable.c             /data/SpriteOffsets.c             /data/Evolutions.c             /data/graphics/sprites/             /data/learnsets/learnsets.json             /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Rebuild complete 1025-species layer
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum             --through 1025             --output vendor/pokeplatinum/generated/species.txt             --report cm01-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py               vendor/pokeplatinum vendor/hg-engine               --start-dex "$start" --end-dex "$end"               --gate "CM01_${tag}_RESOURCE_INSTALL"               --report "cm01-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore certified Gen 5-9 move foundation
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py             vendor/pokeplatinum vendor/hg-engine             --report cm01-modern-moves.json             --implemented-registry cm01-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 1025             --implemented-moves cm01-implemented-moves.txt             --report cm01-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 1025             --report cm01-evolutions.json

      - name: Install CM01 community moves
        shell: bash
        run: |
          python3 tools/install_cm01_community_moves.py             vendor/pokeplatinum             --batch data/community_moves_cm01.json             --report cm01-community-moves-install.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          moves = Path("vendor/pokeplatinum/generated/moves.txt").read_text().splitlines()
          assert moves[919] == "MOVE_MALIGNANT_CHAIN", moves[919]
          assert moves[1024] == "MOVE_DRACONIC_FANGS", moves[1024]
          assert moves[1025] == "MOVE_AQUA_BASH", moves[1025]
          assert moves[1026] == "MOVE_ATOMIC_FIRE", moves[1026]
          assert moves[1027] == "MAX_MOVES", moves[1027]

          report = json.loads(Path("cm01-community-moves-install.json").read_text())
          assert report["community_moves_installed_this_pass"] == 3
          assert report["reserved_placeholder_count_added_this_pass"] == 1128
          print("CM01 registry layout: PASS")
          PY

      - name: Install native battle proof for Draconic Fangs
        shell: bash
        run: |
          python3 tools/install_pt04c_runtime_harness.py             vendor/pokeplatinum --report cm01-base-party.json
          python3 tools/install_pt04c_summary_harness.py             vendor/pokeplatinum --report cm01-base-summary.json
          python3 tools/install_pt04c_pc_harness.py             vendor/pokeplatinum --report cm01-base-pc.json
          python3 tools/install_pt04c_battle_harness.py             vendor/pokeplatinum --report cm01-base-battle.json

          python3 tools/install_pt05d_animation_preview_harness.py             vendor/pokeplatinum             --move MOVE_DRACONIC_FANGS             --preview-id cm01_2048             --report cm01-runtime-harness.json

          grep -q 'MOVE_DRACONIC_FANGS' vendor/pokeplatinum/src/field_map_change.c

      - name: Verify CM01 native animation sources
        shell: bash
        run: |
          cmp             vendor/pokeplatinum/res/moves/draconic_fangs/anim.s             vendor/pokeplatinum/res/moves/bite/anim.s
          cmp             vendor/pokeplatinum/res/moves/aqua_bash/anim.s             vendor/pokeplatinum/res/moves/aqua_tail/anim.s
          cmp             vendor/pokeplatinum/res/moves/atomic_fire/anim.s             vendor/pokeplatinum/res/moves/fire_blast/anim.s

      - name: Build native Platinum with community moves
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Run Draconic Fangs native runtime proof
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cm01-venv"
          . "$RUNNER_TEMP/cm01-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)
          mp4 = out / "cm01-draconic-fangs-native-platinum.mp4"

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("CM01 native Platinum ROM did not boot")

          fps = 15
          sample_every = 4
          proc = subprocess.Popen([
              "ffmpeg", "-y", "-loglevel", "error",
              "-f", "rawvideo", "-pix_fmt", "rgb24",
              "-s", "256x192", "-r", str(fps), "-i", "-",
              "-an", "-c:v", "libx264", "-preset", "veryfast",
              "-crf", "25", "-pix_fmt", "yuv420p", "-movflags", "+faststart",
              str(mp4)
          ], stdin=subprocess.PIPE)

          current = 0
          written = 0
          captures = []

          def cycle(frames):
              global current, written
              for _ in range(frames):
                  emu.cycle(False)
                  current += 1
                  if not emu.is_running():
                      raise SystemExit(f"CM01 emulator stopped at frame {current}")
                  if current % sample_every == 0:
                      image = emu.screenshot().crop((0, 0, 256, 192)).convert("RGB")
                      proc.stdin.write(image.tobytes())
                      written += 1

          def pulse_a(held=20, settle=180):
              emu.input.keypad_add_key(keymask(Keys.KEY_A))
              cycle(held)
              emu.input.keypad_rm_key(keymask(Keys.KEY_A))
              cycle(settle)

          try:
              cycle(1500)
              for _ in range(14):
                  pulse_a()
              cycle(800)

              image = emu.screenshot()
              path = out / "cm01-draconic-fangs-final.png"
              image.save(path)
              colors = image.convert("RGB").getcolors(maxcolors=256 * 384)
              captures.append({
                  "file": path.name,
                  "unique_colors": len(colors) if colors is not None else 256 * 384,
              })
          finally:
              try:
                  if proc.stdin is not None:
                      proc.stdin.close()
                  rc = proc.wait()
                  if rc != 0:
                      raise SystemExit(f"ffmpeg failed with exit code {rc}")
              finally:
                  emu.destroy()

          if written < 100 or not mp4.exists() or mp4.stat().st_size < 10_000:
              raise SystemExit("CM01 runtime video proof is incomplete")

          meta = {
              "gate": "CM01_DRACONIC_FANGS_NATIVE_RUNTIME",
              "runtime": "pokeplatinum",
              "move_id": 1024,
              "move": "MOVE_DRACONIC_FANGS",
              "mechanics": {
                  "power": 85,
                  "accuracy": 100,
                  "pp": 15,
                  "effect": "BATTLE_EFFECT_FLINCH_HIT",
                  "effect_chance": 20,
              },
              "animation": "native Platinum Bite animation",
              "captured_frames": written,
              "emulator_cycles": current,
              "mp4": mp4.name,
              "mp4_bytes": mp4.stat().st_size,
              "captures": captures,
              "visual_review_required": True,
          }
          (out / "cm01-meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload CM01 proof
        uses: actions/upload-artifact@v4
        with:
          name: cm01-community-moves-native-platinum-proof
          path: |
            cm01-community-moves-install.json
            cm01-runtime-harness.json
            runtime-preview/cm01-draconic-fangs-native-platinum.mp4
            runtime-preview/cm01-draconic-fangs-*.png
            runtime-preview/cm01-meta.json
          if-no-files-found: error
          retention-days: 14

      - name: CM01 summary
        shell: bash
        run: |
          {
            echo "## CM01 community move implementation"
            echo
            echo "- Native runtime: pokeplatinum"
            echo "- ID 1024: Draconic Fangs"
            echo "- ID 1025: Aqua Bash"
            echo "- ID 1026: Atomic Fire"
            echo "- Future official IDs 920-2047 preserved as inert reserved slots"
            echo "- First new community move exercised in a real native Platinum battle"
          } >> "$GITHUB_STEP_SUMMARY"
