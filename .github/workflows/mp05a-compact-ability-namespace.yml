name: MP05A Compact Modern Ability Namespace

on:
  push:
    branches:
      - feature/modern-platinum-fast
    paths:
      - ".github/workflows/mp05a-compact-ability-namespace.yml"
      - "tools/install_mp05a_ability_namespace.py"
      - "data/modern_ability_namespace.json"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends             bison flex g++ gcc-arm-none-eabi git make ninja-build             pkg-config python3 python3-venv python3-pip wget xz-utils             libpng-dev rsync jq fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set             /include/constants/moves.h             /include/constants/move_effects.h             /data/Moves.c             /data/Species.c             /data/BaseExperienceTable.c             /data/IconPaletteTable.c             /data/HeightTable.c             /data/SpriteOffsets.c             /data/Evolutions.c             /data/graphics/sprites/             /data/learnsets/learnsets.json             /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply sealed PB04 Mercury overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Rebuild MP04 modern foundation
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum             --through 1025             --output vendor/pokeplatinum/generated/species.txt             --report mp05a-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py               vendor/pokeplatinum vendor/hg-engine               --start-dex "$start" --end-dex "$end"               --gate "MP05A_${tag}_RESOURCE_INSTALL"               --report "mp05a-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py             vendor/pokeplatinum vendor/hg-engine             --report mp05a-modern-moves.json             --implemented-registry mp05a-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 1025             --implemented-moves mp05a-implemented-moves.txt             --report mp05a-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 1025             --report mp05a-evolutions.json

      - name: Install compact modern ability namespace
        shell: bash
        run: |
          python3 tools/install_mp05a_ability_namespace.py             vendor/pokeplatinum             --report mp05a-ability-namespace.json

          test "$(jq -r '.modern_abilities_added' mp05a-ability-namespace.json)" = "132"
          test "$(jq -r '.species_assignment' mp05a-ability-namespace.json)" = "not_yet"
          test "$(wc -l < vendor/pokeplatinum/generated/abilities.txt)" = "256"
          test "$(sed -n '124p' vendor/pokeplatinum/generated/abilities.txt)" = "ABILITY_BAD_DREAMS"
          test "$(sed -n '125p' vendor/pokeplatinum/generated/abilities.txt)" = "ABILITY_PICKPOCKET"
          test "$(sed -n '256p' vendor/pokeplatinum/generated/abilities.txt)" = "ABILITY_POISON_PUPPETEER"

      - name: Generate Mercury title
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mp05a-venv"
          . "$RUNNER_TEMP/mp05a-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Build full ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage MP05A artifact
        shell: bash
        run: |
          mkdir -p mp05a
          cp "$BUILD/pokeplatinum.us.nds" mp05a/Pokemon_Mercury_Modern_Platinum_MP05A.nds
          cp mp05a-ability-namespace.json mp05a/
          cp data/modern_ability_namespace.json mp05a/
          sha256sum mp05a/Pokemon_Mercury_Modern_Platinum_MP05A.nds > mp05a/SHA256SUMS.txt
          {
            echo "MP05A compact ability namespace"
            echo "Vanilla IDs preserved: 0..123"
            echo "Modern compact IDs installed: 124..255"
            echo "Modern ability constants/text added: 132"
            echo "Species assignment: intentionally deferred until mechanics batches"
            echo "Deferred stateful abilities: Hunger Switch, Zero to Hero, Commander, Tera Shift"
            echo "Runtime playtest: intentionally skipped"
          } > mp05a/MP05A_MANIFEST.txt

      - name: Upload MP05A proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-modern-platinum-mp05a-ability-namespace
          path: mp05a/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## MP05A compact modern ability namespace"
            echo
            echo "- Stable u8 save-compatible namespace: PASS"
            echo "- 132 modern ability IDs/text entries: PASS"
            echo "- Four stateful overflow abilities explicitly deferred: PASS"
            echo "- Species assignment held back until mechanics exist: PASS"
            echo "- Full ROM compile: PASS"
            echo "- Runtime playtest: intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"
