name: PB02AD Barry 2F Actual Progression

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ad-barry-2f-actual.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and verified Barry-house 1F state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10792752716/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/pb02ac-post-barry-upstairs.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ad-venv"
          . "$RUNNER_TEMP/pb02ad-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Cross Barry stair warp and complete actual upstairs script
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ad-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/pb02ac-post-barry-upstairs.dst")
          out=Path("pb02ad-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AD stopped at {frame}")

          def pulse(key,held=12,settle=500):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("actual-barry-1f-stair-position")

          # Visual PB02AC proof leaves the player immediately east of the
          # native stair warp. One LEFT crosses into Barry's actual 2F.
          pulse(Keys.KEY_LEFT,12,1200)
          cap("actual-barry-2f-arrival")
          run(800); cap("actual-barry-2f-stable")

          # Native events: 2F arrival warp (3,4); Barry object (9,5).
          for _ in range(6): pulse(Keys.KEY_RIGHT,12,240)
          pulse(Keys.KEY_DOWN,12,280)
          cap("facing-actual-barry")

          pulse(Keys.KEY_A,12,900)
          cap("take-bag-journal-message")

          # Source script has TakeBagAndJournal, then WaitingOnTheRoad.
          for i in range(1,5):
              pulse(Keys.KEY_A,12,1100)
              cap(f"barry-progression-a-{i:02d}")

          run(2400)
          cap("barry-left-home-stable")

          # Field input proves ReleaseAll after FLAG_RIVAL_LEFT_HOME is set.
          pulse(Keys.KEY_LEFT,12,350)
          cap("post-barry-field-control")

          saved=out/"post-barry-left-home-certified.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02ad-meta.json").write_text(json.dumps({
              "gate":"PB02AD_BARRY_2F_ACTUAL_PROGRESSION",
              "source_artifact":10792752716,
              "source_text_expected":[
                "...I'd better take my Bag and Journal, too...",
                "Oh, hey, MERCURY!",
                "I'll be waiting on the road!",
                "It's a $10 million fine if you're late!"
              ],
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"fast Route 201 starter scene certification"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AD proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ad-barry-2f-actual-proof
          path: pb02ad-play/
          if-no-files-found: error
          retention-days: 14
