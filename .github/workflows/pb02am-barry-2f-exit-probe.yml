name: PB02AM Barry 2F Exit Direction Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02am-barry-2f-exit-probe.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and Barry-complete state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10803922585/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/pb02ak-horizontal-probe.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02am-venv"
          . "$RUNNER_TEMP/pb02am-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Probe four exit directions from Barry 2F
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02am-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/pb02ak-horizontal-probe.dst")
          out=Path("pb02am-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AM stopped at {frame}")

          def pulse(key, held=12, settle=1100):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          tests=[
              ("up",Keys.KEY_UP),
              ("down",Keys.KEY_DOWN),
              ("left",Keys.KEY_LEFT),
              ("right",Keys.KEY_RIGHT),
          ]
          for label,key in tests:
              emu.savestate.load_file(str(state)); run(250)
              cap(f"{label}-start")
              pulse(key); cap(f"{label}-one")
              pulse(key); cap(f"{label}-two")

          (out/"pb02am-meta.json").write_text(json.dumps({
              "gate":"PB02AM_BARRY_2F_EXIT_DIRECTION_PROBE",
              "source_artifact":10803922585,
              "tests":["UP x2","DOWN x2","LEFT x2","RIGHT x2"],
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02am-barry-2f-exit-probe
          path: pb02am-play/
          if-no-files-found: error
          retention-days: 14
