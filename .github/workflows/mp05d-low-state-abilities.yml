name: MP05D Low-State Modern Abilities

on:
  push:
    branches:
      - feature/modern-platinum-fast
    paths:
      - ".github/workflows/mp05d-low-state-abilities.yml"
      - "tools/install_mp05d_low_state_abilities.py"
      - "tools/install_mp05c_scalar_abilities.py"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 160

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply sealed PB04 Mercury overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_mp05c_scalar_abilities.py \
            tools/install_mp05d_low_state_abilities.py \
            tools/install_pt04d_species_batch.py

      - name: Restore canonical ability architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mp05d-ability-namespace.json \
            --implemented-registry mp05d-implemented-abilities.txt

          test "$(wc -l < mp05d-implemented-abilities.txt)" = "124"

      - name: Restore MP05C exact scalar family
        shell: bash
        run: |
          python3 tools/install_mp05c_scalar_abilities.py \
            vendor/pokeplatinum \
            --implemented-registry mp05d-implemented-abilities.txt \
            --report mp05d-mp05c-scalar.json

          test "$(wc -l < mp05d-implemented-abilities.txt)" = "131"

      - name: Install MP05D low-state ability family
        shell: bash
        run: |
          python3 tools/install_mp05d_low_state_abilities.py \
            vendor/pokeplatinum \
            --implemented-registry mp05d-implemented-abilities.txt \
            --report mp05d-low-state-abilities.json

          test "$(jq -r '.abilities_added_count' mp05d-low-state-abilities.json)" = "6"
          test "$(jq -r '.implemented_ability_count' mp05d-low-state-abilities.json)" = "137"
          test "$(jq -r '.approximate_mechanics' mp05d-low-state-abilities.json)" = "false"

          for ability in \
            ABILITY_SAND_RUSH \
            ABILITY_TOUGH_CLAWS \
            ABILITY_MERCILESS \
            ABILITY_SLUSH_RUSH \
            ABILITY_FLUFFY \
            ABILITY_ICE_SCALES; do
            grep -qx "$ability" mp05d-implemented-abilities.txt
          done

      - name: Rebuild 1025 species with implemented abilities live
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mp05d-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --implemented-abilities mp05d-implemented-abilities.txt \
              --gate "MP05D_${tag}_RESOURCE_INSTALL" \
              --report "mp05d-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          checks = {
              "excadrill": "ABILITY_SAND_RUSH",
              "barbaracle": "ABILITY_TOUGH_CLAWS",
              "toxapex": "ABILITY_MERCILESS",
              "bewear": "ABILITY_FLUFFY",
              "cetitan": "ABILITY_SLUSH_RUSH",
          }
          for species, ability in checks.items():
              path = Path("vendor/pokeplatinum/res/pokemon") / species / "data.json"
              data = json.loads(path.read_text())
              if ability not in data["abilities"]:
                  raise SystemExit(
                      f"{species}: expected implemented {ability}, got {data['abilities']}"
                  )
              print(species, data["abilities"])

          # Ice Scales is implemented in the battle engine but Frosmoth carries it
          # as a hidden ability in the pinned donor; hidden-ability assignment is a
          # later species-data pass, so it is verified by the registry/source audit.

          remaining = 0
          for tag in ("GEN5","GEN6","GEN7","GEN8","GEN9"):
              data=json.loads(Path(f"mp05d-{tag}.json").read_text())
              remaining += len(data["exceptions"]["unsupported_abilities"])
          print("remaining deliberately deferred ability assignments:", remaining)
          PY

      - name: Restore move learnset and evolution foundation
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mp05d-modern-moves.json \
            --implemented-registry mp05d-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mp05d-implemented-moves.txt \
            --report mp05d-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mp05d-evolutions.json

      - name: Static mechanics audit
        shell: bash
        run: |
          set -euo pipefail
          B=vendor/pokeplatinum/src/battle/battle_lib.c

          grep -q 'ABILITY_SAND_RUSH' "$B"
          grep -q 'ABILITY_SLUSH_RUSH' "$B"
          grep -q 'ABILITY_TOUGH_CLAWS' "$B"
          grep -q 'ABILITY_MERCILESS' "$B"
          grep -q 'ABILITY_FLUFFY' "$B"
          grep -q 'ABILITY_ICE_SCALES' "$B"
          grep -q 'MOVE_FLAG_MAKES_CONTACT' "$B"
          grep -q 'WEATHER_IS_SAND' "$B"
          grep -q 'WEATHER_IS_HAIL' "$B"
          echo "MP05D low-state mechanics source audit: PASS"

      - name: Generate Mercury title
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mp05d-venv"
          . "$RUNNER_TEMP/mp05d-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Build full Modern Platinum ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage MP05D proof
        shell: bash
        run: |
          mkdir -p mp05d-proof
          cp "$BUILD/pokeplatinum.us.nds" mp05d-proof/Pokemon_Mercury_Modern_Platinum_MP05D.nds
          cp mp05d-ability-namespace.json mp05d-proof/
          cp mp05d-mp05c-scalar.json mp05d-proof/
          cp mp05d-low-state-abilities.json mp05d-proof/
          cp mp05d-implemented-abilities.txt mp05d-proof/
          sha256sum mp05d-proof/Pokemon_Mercury_Modern_Platinum_MP05D.nds > mp05d-proof/SHA256SUMS.txt

          {
            echo "MP05D low-state modern ability family"
            echo "New exact ability behaviors: 6"
            echo "Total implemented ability registry size: 137"
            echo "No new persistent battle state, switching framework, terrain, or form engine"
            echo "Unported modern abilities remain gated out of live species data"
            echo "Full ROM compile required"
            echo "Long runtime playtest intentionally skipped"
          } > mp05d-proof/MP05D_MANIFEST.txt

      - name: Upload MP05D proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-modern-platinum-mp05d-low-state-abilities
          path: mp05d-proof/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## MP05D low-state modern abilities"
            echo
            echo "- Sand Rush / Slush Rush: PASS"
            echo "- Tough Claws: PASS"
            echo "- Merciless: PASS"
            echo "- Fluffy / Ice Scales: PASS"
            echo "- Modern species assignments gated by exact implementation: PASS"
            echo "- Full native DS ROM compile: PASS"
            echo "- Long runtime playthrough: intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"
