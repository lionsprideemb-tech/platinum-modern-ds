name: PB02AH Rebuild And Certify Barry Chain

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ah-certify-barry-chain.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and certified Twinleaf exterior state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10789223904/zip > twinleaf.zip
          unzip -q twinleaf.zip -d checkpoint
          test -s checkpoint/twinleaf-exterior.dst
          test "$(sha256sum rom/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ah-venv"
          . "$RUNNER_TEMP/pb02ah-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Rebuild THUD chain and certify Barry leaves home
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ah-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import ImageChops, ImageStat
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/twinleaf-exterior.dst")
          out=Path("pb02ah-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02AH stopped at {frame}")

          def pulse(key,held=12,settle=420):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})
              return img

          def is_indoor(img):
              rgb=img.convert("RGB")
              r,g,b=rgb.getpixel((10,50))
              cr,cg,cb=rgb.getpixel((128,90))
              return r<12 and g<12 and b<12 and (cr+cg+cb)>40

          cap("twinleaf-certified-start")

          # Exact coordinate-backed route from the certified exterior state.
          for _ in range(4): pulse(Keys.KEY_LEFT,12,220)
          for _ in range(10): pulse(Keys.KEY_UP,12,220)
          for _ in range(6): pulse(Keys.KEY_LEFT,12,220)
          cap("one-before-thud")
          pulse(Keys.KEY_LEFT,12,1600)
          run(1000)
          cap("thud-start")

          # Finish every page and timed movement in the native THUD event.
          # Long settle windows prevent presses from landing only during movement.
          for i in range(1,13):
              pulse(Keys.KEY_A,12,900)
              if i in (1,3,5,7,9,12):
                  cap(f"thud-a-{i:02d}")
          run(3000)
          cap("thud-finish-probe")

          # Move north until the Barry-house warp is actually crossed.
          # If the THUD flag did not set, this will retrigger the scene and the
          # indoor gate below will fail rather than falsely certifying.
          entered=False
          entry_presses=0
          for i in range(1,7):
              pulse(Keys.KEY_UP,12,650)
              img=cap(f"door-up-{i:02d}")
              if is_indoor(img):
                  entered=True
                  entry_presses=i
                  break

          if not entered:
              raise SystemExit("PB02AH: Barry THUD event did not release into Barry house")

          run(900)
          one_f=cap("barry-house-1f-certified")

          # Route already proven in PB02Y from the true 1F entrance.
          for _ in range(3): pulse(Keys.KEY_LEFT,12,240)
          for _ in range(6): pulse(Keys.KEY_UP,12,280)
          cap("barry-stair-approach")
          pulse(Keys.KEY_LEFT,12,1200)
          two_f=cap("barry-house-2f-arrival")
          run(900)
          cap("barry-2f-take-bag-message")

          # 2F has strong black side margins; 1F does not at this pixel.
          r,g,b=two_f.convert("RGB").getpixel((50,60))
          if not (r<12 and g<12 and b<12):
              raise SystemExit("PB02AH: did not cross Barry 1F -> 2F warp")

          # Native OnFrame sequence: Take Bag/Journal -> Waiting on Road -> leave.
          for i in range(1,7):
              pulse(Keys.KEY_A,12,1100)
              cap(f"barry-2f-a-{i:02d}")

          run(3000)
          before=cap("barry-left-home-probe")

          # Prove the script reached ReleaseAll with actual field movement.
          moved=False
          for label,key in [("DOWN",Keys.KEY_DOWN),("RIGHT",Keys.KEY_RIGHT),("LEFT",Keys.KEY_LEFT)]:
              base=emu.screenshot().convert("RGB")
              pulse(key,12,500)
              after=emu.screenshot().convert("RGB")
              mean=sum(ImageStat.Stat(ImageChops.difference(base,after)).mean)/3
              cap(f"field-control-{label.lower()}")
              if mean>1.0:
                  moved=True
                  break

          if not moved:
              raise SystemExit("PB02AH: Barry upstairs script did not return field control")

          saved=out/"post-barry-left-home-certified.dst"
          emu.savestate.save_file(str(saved))
          cap("certified-continuation-state")

          meta={
              "gate":"PB02AH_REBUILD_AND_CERTIFY_BARRY_CHAIN",
              "source_checkpoint_artifact":10789223904,
              "entry_up_presses":entry_presses,
              "thud_finished":True,
              "barry_house_1f":True,
              "barry_house_2f":True,
              "field_control_after_barry_departure":True,
              "output_state":saved.name,
              "captures":caps,
              "next":"PB02AI exit Barry house and fast-certify Route 201 starter acquisition"
          }
          (out/"pb02ah-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          emu.destroy()
          PY

      - name: Upload PB02AH certified proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ah-barry-chain-certified
          path: pb02ah-play/
          if-no-files-found: error
          retention-days: 14
