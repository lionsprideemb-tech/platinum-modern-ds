name: DS04 Twinleaf Transplant Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ds04-twinleaf-transplant
    paths:
      - "tools/stage_ds04_twinleaf.py"
      - "tools/narc_append.py"
      - "tools/convert_platinum_landdata.py"
      - "tools/convert_platinum_areadata.py"
      - "tools/build_hgss_prop_set.py"
      - "platinum_port/twinleaf/**"
      - "engine-overlay/**"
      - "upstream/LOCK.json"
      - ".github/workflows/ds04-twinleaf-build.yml"

permissions:
  contents: read

env:
  CC: gcc-10
  CXX: g++-10
  COMPARE: 0
  SDL_VIDEODRIVER: dummy

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt -y --allow-downgrades install \
            g++-10-multilib linux-libc-dev binutils-arm-none-eabi p7zip-full \
            pkg-config libpugixml-dev libpng-dev build-essential cmake \
            python3-pip python3-venv git automake autoconf gcc-arm-none-eabi wget
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo add-apt-repository ppa:cybermax-dexter/sdl2-backport -y
          sudo wget -q -NP /etc/apt/sources.list.d/ "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"
          sudo apt update
          sudo apt -y --allow-downgrades install --install-recommends winehq-stable

      - name: Checkout pinned public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pret/pokeheartgold.git vendor/pokeheartgold
          git -C vendor/pokeheartgold checkout "$(jq -r '.sources["pokeheartgold"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

      - name: Run DS04 staging regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_narc_append.py
          python3 tests/test_landdata_converter.py
          python3 tests/test_areadata_converter.py

      - name: Stage runtime-safe Twinleaf proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_ds04_twinleaf.py \
            --pokeheartgold vendor/pokeheartgold \
            --pokeplatinum vendor/pokeplatinum \
            --test-start \
            --runtime-compat-slot \
            --report /tmp/ds04_runtime_stage.json
          cat /tmp/ds04_runtime_stage.json

      - name: Verify runtime-safe source injection
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .strategy == "APPEND_ONLY" and
            .runtime_compat_slot == true and
            .archives.land_data.members == 682 and
            .archives.area_data.members == 108 and
            .archives.prop_sets.members == 106 and
            .archives.map_textures.members == 108 and
            .archives.prop_textures.members == 106 and
            .archives.exterior_models.members == 344 and
            .archives.interior_models.members == 244 and
            .matrices == [288,289,290,291,292,293] and
            .map_headers == [538] and
            .scripts == [965,966] and
            .test_start == true and
            .test_start_map == 538 and
            .test_start_x == 4 and
            .test_start_y == 6 and
            .test_start_direction == 0
          ' /tmp/ds04_runtime_stage.json >/dev/null

          grep -q '^#define MAP_ID_MAX[[:space:]]*540' vendor/pokeheartgold/include/constants/maps.h
          if grep -q '^#define MAP_SINNOH_TWINLEAF_' vendor/pokeheartgold/include/constants/maps.h; then
            echo "runtime-safe mode unexpectedly expanded map constants" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          headers = Path("vendor/pokeheartgold/src/data/map_headers.h").read_text()
          pos = headers.index("[MAP_UNUSED]")
          block = headers[pos:pos + 1800]
          assert ".areaDataBank = 107" in block
          assert "NARC_map_matrix_map_matrix_0293_SINNOH_TWINLEAF_PLAYER_2F_bin" in block
          assert "NARC_scr_seq_scr_seq_0965_SINNOH_TWINLEAF_EMPTY_bin" in block
          assert "NARC_scr_seq_scr_seq_0966_SINNOH_TWINLEAF_EMPTY_hdr_bin" in block

          loc = Path("vendor/pokeheartgold/src/location_backup.c").read_text()
          assert ".mapId = MAP_UNUSED," in loc
          assert ".x = 4," in loc
          assert ".y = 6," in loc
          assert ".direction = 0," in loc

          print("DS04 runtime-safe source injection: PASS")
          PY

          test -f vendor/pokeheartgold/files/fielddata/mapmatrix/map_matrix/map_matrix_0293_SINNOH_TWINLEAF_PLAYER_2F.bin
          test -f vendor/pokeheartgold/files/fielddata/script/scr_seq/scr_seq_0965_SINNOH_TWINLEAF_EMPTY.s
          test -f vendor/pokeheartgold/files/fielddata/script/scr_seq/scr_seq_0966_SINNOH_TWINLEAF_EMPTY_hdr.s

      - name: Bootstrap pokeheartgold toolchain
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools"
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub"
          mkdir -p "$RUNNER_TEMP/phg-download"
          cd "$RUNNER_TEMP/phg-download"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/mwccarm.zip
          unzip -q -o mwccarm.zip
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/mwccarm"
          mv mwccarm "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/NitroSDK-3_2-060901.7z
          7z x -y NitroSDK-3_2-060901.7z >/dev/null
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/bin"
          mv NitroSDK-3_2-060901/tools/bin "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM7-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM9-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/mwldarm.response.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 19

      - name: Build HeartGold with static Twinleaf shell
        working-directory: vendor/pokeheartgold
        env:
          LM_LICENSE_FILE: "${{ github.workspace }}/vendor/pokeheartgold/tools/mwccarm/license.dat"
          GAME_VERSION: HEARTGOLD
          GAME_LANGUAGE: ENGLISH
          GAME_REVISION: 0
        shell: bash
        run: make -j"$(nproc)"

      - name: Verify generated Twinleaf NARC indices
        working-directory: vendor/pokeheartgold
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NARC_map_matrix_map_matrix_0288_SINNOH_TWINLEAF_bin 288' files/fielddata/mapmatrix/map_matrix.naix
          grep -q 'NARC_map_matrix_map_matrix_0293_SINNOH_TWINLEAF_PLAYER_HOUSE_2F_bin 293' files/fielddata/mapmatrix/map_matrix.naix
          grep -q 'NARC_scr_seq_scr_seq_0965_SINNOH_TWINLEAF_EMPTY_bin 965' files/fielddata/script/scr_seq.naix
          grep -q 'NARC_scr_seq_scr_seq_0966_SINNOH_TWINLEAF_EMPTY_hdr_bin 966' files/fielddata/script/scr_seq.naix

      - name: Checkout pinned HG-Engine
        shell: bash
        run: |
          git clone --recursive https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          git -C vendor/hg-engine submodule update --init --recursive

      - name: Apply project engine overlay
        shell: bash
        run: |
          rsync -a --exclude README.md engine-overlay/ vendor/hg-engine/

      - name: Prepare HG-Engine inputs
        shell: bash
        run: |
          cp vendor/pokeheartgold/build/heartgold.us/pokeheartgold.us.nds vendor/hg-engine/rom.nds
          wget -q https://github.com/BluRosie/hg-engine/raw/workflows/assets/test.sav -O vendor/hg-engine/test.sav

      - name: Preflight HG-Engine overlay patch offsets
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import sys

          rom = Path("rom.nds").read_bytes()
          y9_off, y9_size = struct.unpack_from("<II", rom, 0x50)
          y9 = rom[y9_off:y9_off + y9_size]

          defines = {
              "DEBUG_BATTLE_SCENARIOS": True,
              "DEBUG_AUTO_CONTINUE_GAME": True,
          }

          def import_defines(path):
              p = Path(path)
              if not p.exists():
                  return
              for raw in p.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line.startswith("#define "):
                      continue
                  parts = line.split()
                  if len(parts) >= 2:
                      defines[parts[1]] = True if len(parts) == 2 or parts[2].startswith(("//", "/*")) else parts[2]

          lines = Path("bytereplacement").read_text(encoding="utf-8").splitlines()
          conditionals = []
          bad = []

          for raw in lines:
              line = raw.strip()
              if line.startswith('#include "'):
                  try:
                      import_defines(line.split('"')[1])
                  except Exception as exc:
                      print(f"include parse warning: {line}: {exc}")
                  continue

              upper = line.upper()
              words = line.split()
              if upper.startswith("#IFDEF ") and len(words) > 1:
                  conditionals.insert(0, (words[1], True))
                  continue
              if upper.startswith("#IFNDEF ") and len(words) > 1:
                  conditionals.insert(0, (words[1], False))
                  continue
              if upper == "#ELSE":
                  if conditionals:
                      name, state = conditionals.pop(0)
                      conditionals.insert(0, (name, not state))
                  continue
              if upper == "#ENDIF":
                  if conditionals:
                      conditionals.pop(0)
                  continue

              inactive = False
              for name, must_be_defined in conditionals:
                  present = name in defines
                  if (must_be_defined and not present) or ((not must_be_defined) and present):
                      inactive = True
                      break
              if inactive or not line or line.startswith("#"):
                  continue

              openbin = line[:4]
              if openbin == "arm9":
                  continue
              try:
                  overlay = int(openbin)
                  address = int(line[4:13], 16)
              except ValueError:
                  continue
              if not (address & 0x02000000):
                  continue

              entry = overlay * 0x20
              if entry + 8 > len(y9):
                  bad.append((line, overlay, address, None, None, "overlay table entry missing"))
                  continue
              base = struct.unpack_from("<I", y9, entry + 4)[0]
              offset = address - base
              if offset < 0:
                  bad.append((line, overlay, address, base, offset, "negative patch offset"))

          print(f"ARM9 overlay table: offset=0x{y9_off:X}, bytes={y9_size}, entries={len(y9)//0x20}")
          if bad:
              print("HG-Engine overlay patch preflight: FAIL")
              for line, overlay, address, base, offset, reason in bad:
                  print(
                      f"{reason}: overlay={overlay:04d} target=0x{address:08X} "
                      f"base={('n/a' if base is None else f'0x{base:08X}')} "
                      f"offset={('n/a' if offset is None else offset)} line={line}"
                  )
              sys.exit(1)

          print("HG-Engine overlay patch preflight: PASS")
          PY

      - name: Build HG-Engine on Twinleaf base
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          unset CC
          unset CXX
          make AUTO_TEST=Y -j"$(nproc)"

      - name: Run HG-Engine tests
        working-directory: vendor/hg-engine
        shell: bash
        run: scripts/run_tests.sh -c -j "$(nproc)"

      - name: Record DS04 build fingerprint
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          {
            echo "## DS04 Twinleaf transplant build passed"
            echo
            echo "- test start: imported Twinleaf Player House 2F @ (4,6)"
            echo "- temporary runtime header slot: MAP_UNUSED / 538"
            echo "- MAP_ID_MAX preserved: 540"
            echo "- land-data IDs: 676-681"
            echo "- matrix IDs: 288-293"
            echo "- shared empty scripts: 965 / 966"
            echo "- HG-Engine: `$(jq -r '.sources["hg-engine"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")`"
            echo "- pokeheartgold: `$(jq -r '.sources["pokeheartgold"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")`"
            echo "- pokeplatinum: `$(jq -r '.sources["pokeplatinum"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")`"
            echo "- test.nds SHA-256: `$(sha256sum test.nds | awk '{print $1}')`"
            echo "- test.nds bytes: `$(stat -c%s test.nds)`"
            echo
            echo "No ROM artifact is uploaded by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
