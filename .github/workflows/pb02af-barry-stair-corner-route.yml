name: PB02AF Barry Stair Corner Route

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02af-barry-stair-corner-route.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Barry near-stair state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10792752716/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/pb02ac-post-barry-upstairs.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02af-venv"
          . "$RUNNER_TEMP/pb02af-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Use corner approach to stair warp and finish Barry event
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02af-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/pb02ac-post-barry-upstairs.dst")
          out=Path("pb02af-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=650):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("near-stairs")
          sequence=[
              ("up-to-block", Keys.KEY_UP),
              ("right-around-rail", Keys.KEY_RIGHT),
              ("up-along-stair", Keys.KEY_UP),
              ("left-onto-warp", Keys.KEY_LEFT),
          ]
          for label,key in sequence:
              pulse(key,12,800)
              cap(label)

          run(1600); cap("two-f-event-visible")

          # If upstairs is reached, the native auto-script is waiting on dialogue.
          for i in range(1,6):
              pulse(Keys.KEY_A,12,1200)
              cap(f"upstairs-a-{i:02d}")

          run(2000); cap("post-barry-upstairs-stable")
          saved=out/"pb02af-post-barry-upstairs.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02af-meta.json").write_text(json.dumps({
              "gate":"PB02AF_BARRY_STAIR_CORNER_ROUTE",
              "route":"UP -> RIGHT -> UP -> LEFT from PB02AC near-stair state",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AF proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02af-barry-stair-corner-route-proof
          path: pb02af-play/
          if-no-files-found: error
          retention-days: 14
