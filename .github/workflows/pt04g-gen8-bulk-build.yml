name: PT04G Gen VIII Bulk Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pt04g-gen8-bulk-expansion
    paths:
      - "data/canonical_species_1025.txt"
      - "tools/build_species_registry.py"
      - "tools/audit_pt04d_species_batch.py"
      - "tools/install_pt04d_species_batch.py"
      - "platinum-overlay/**"
      - "tools/generate_mercury_title.py"
      - "assets/title_screen/**"
      - ".github/workflows/pt04g-gen8-bulk-build.yml"
      - "upstream/LOCK.json"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  gen8-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends             bison flex g++ gcc-arm-none-eabi git make ninja-build             pkg-config python3 python3-venv python3-pip wget xz-utils             libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned pokeplatinum
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Checkout pinned HG-Engine donor
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set             /data/Species.c             /data/BaseExperienceTable.c             /data/IconPaletteTable.c             /data/HeightTable.c             /data/SpriteOffsets.c             /data/graphics/sprites/
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          test -s vendor/hg-engine/data/Species.c
          test -s vendor/hg-engine/data/SpriteOffsets.c
          test -s vendor/hg-engine/data/graphics/sprites/grookey/male/front.png
          test -s vendor/hg-engine/data/graphics/sprites/enamorus/female/front.png

      - name: Register canonical species through Enamorus
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum             --through 905             --output vendor/pokeplatinum/generated/species.txt             --report pt04g-gen8-registry.json
          test "$(sed -n '810p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_MELMETAL"
          test "$(sed -n '811p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_GROOKEY"
          test "$(sed -n '906p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_ENAMORUS"
          test "$(sed -n '907p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_EGG"
          test "$(sed -n '908p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_BAD_EGG"

      - name: Re-audit Gen VIII donor batch
        shell: bash
        run: |
          python3 tools/audit_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 810 --end-dex 905             --gate PT04G_GEN8_DONOR_AUDIT             --report pt04g-gen8-donor-audit.json

      - name: Restore sealed Gen V resources
        shell: bash
        run: |
          python3 tools/install_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 649             --gate PT04D_GEN5_PREREQUISITE_INSTALL             --report pt04g-gen5-prerequisite-install.json
          test "$(jq -r '.installed_species' pt04g-gen5-prerequisite-install.json)" = "156"

      - name: Restore sealed Gen VI resources
        shell: bash
        run: |
          python3 tools/install_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 650 --end-dex 721             --gate PT04E_GEN6_PREREQUISITE_INSTALL             --report pt04g-gen6-prerequisite-install.json
          test "$(jq -r '.installed_species' pt04g-gen6-prerequisite-install.json)" = "72"

      - name: Restore sealed Gen VII resources
        shell: bash
        run: |
          python3 tools/install_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 722 --end-dex 809             --gate PT04F_GEN7_PREREQUISITE_INSTALL             --report pt04g-gen7-prerequisite-install.json
          test "$(jq -r '.installed_species' pt04g-gen7-prerequisite-install.json)" = "88"

      - name: Install Gen VIII resource batch
        shell: bash
        run: |
          python3 tools/install_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 810 --end-dex 905             --gate PT04G_GEN8_BATCH_INSTALL             --report pt04g-gen8-install.json
          test "$(jq -r '.installed_species' pt04g-gen8-install.json)" = "96"
          test "$(jq -r '.first.species' pt04g-gen8-install.json)" = "SPECIES_GROOKEY"
          test "$(jq -r '.last.species' pt04g-gen8-install.json)" = "SPECIES_ENAMORUS"
          test -s vendor/pokeplatinum/res/pokemon/grookey/data.json
          test -s vendor/pokeplatinum/res/pokemon/toxtricity/data.json
          test -s vendor/pokeplatinum/res/pokemon/morpeko/data.json
          test -s vendor/pokeplatinum/res/pokemon/zacian/data.json
          test -s vendor/pokeplatinum/res/pokemon/enamorus/data.json

      - name: Generate sealed Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pt04g-venv"
          . "$RUNNER_TEMP/pt04g-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Install Metroskrew
        working-directory: vendor/pokeplatinum
        shell: bash
        run: sudo make skrew

      - name: Configure Gen VIII-expanded Platinum
        working-directory: vendor/pokeplatinum
        shell: bash
        run: make configure

      - name: Build Platinum through Enamorus
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Verify Gen VIII expanded archives
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct

          roots = [Path("/var/tmp/pokeplatinum"), Path("vendor/pokeplatinum")]

          def find_one(name):
              for root in roots:
                  if root.exists():
                      matches = list(root.rglob(name))
                      if matches:
                          return matches[0]
              raise SystemExit(f"missing compiled archive: {name}")

          def narc_count(path):
              data = path.read_bytes()
              pos = data.find(b"BTAF")
              if pos < 0:
                  pos = data.find(b"FATB")
              if data[:4] != b"NARC" or pos < 0:
                  raise SystemExit(f"invalid NARC: {path}")
              return struct.unpack_from("<H", data, pos + 8)[0]

          counts = {
              "pl_personal": narc_count(find_one("pl_personal.narc")),
              "pl_pokegra": narc_count(find_one("pl_pokegra.narc")),
              "pl_poke_icon": narc_count(find_one("pl_poke_icon.narc")),
              "height": narc_count(find_one("height.narc")),
          }
          expected = {
              "pl_personal": 920,
              "pl_pokegra": 5436,
              "pl_poke_icon": 959,
              "height": 3624,
          }
          if counts != expected:
              raise SystemExit(f"unexpected cumulative archive counts: {counts} != {expected}")

          proof = {
              "gate": "PT04G_GEN8_COMPILED_ARCHIVES",
              "canonical_range": [810, 905],
              "first": "SPECIES_GROOKEY",
              "last": "SPECIES_ENAMORUS",
              "counts": counts,
              "next_gate": "PT04G_GEN8_SAVE_RELOAD_RUNTIME",
          }
          Path("pt04g-gen8-archive-proof.json").write_text(
              json.dumps(proof, indent=2) + "\n"
          )
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload PT04G Gen VIII build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt04g-gen8-bulk-build-proof
          path: |
            pt04g-gen8-registry.json
            pt04g-gen8-donor-audit.json
            pt04g-gen5-prerequisite-install.json
            pt04g-gen6-prerequisite-install.json
            pt04g-gen7-prerequisite-install.json
            pt04g-gen8-install.json
            pt04g-gen8-archive-proof.json
          if-no-files-found: warn
          retention-days: 14

      - name: PT04G summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PT04G Gen VIII bulk build"
            echo
            echo "- Canonical native IDs: Grookey 810 through Enamorus 905"
            echo "- 96 Gen VIII donor species/resources processed as one batch"
            echo "- Sealed Gen V, VI, and VII resource layers are regenerated first"
            echo "- Alternate forms remain a separate form-registry pass"
          } >> "$GITHUB_STEP_SUMMARY"
