name: PT05C Move Compatibility Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-build-forward
    paths:
      - "tools/audit_pt05c_move_compatibility.py"
      - ".github/workflows/pt05c-move-compatibility-audit.yml"
      - "upstream/LOCK.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned donors
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/Moves.c
          git -C vendor/hg-engine checkout "$(python3 -c 'import json; print(json.load(open("upstream/LOCK.json"))["sources"]["hg-engine"]["commit"])')"

          git clone --filter=blob:none --no-checkout https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum sparse-checkout init --no-cone
          git -C vendor/pokeplatinum sparse-checkout set /generated/move_battle_effects.txt
          git -C vendor/pokeplatinum checkout "$(python3 -c 'import json; print(json.load(open("upstream/LOCK.json"))["sources"]["pokeplatinum"]["commit"])')"

      - name: Audit modern move compatibility
        shell: bash
        run: |
          python3 tools/audit_pt05c_move_compatibility.py \
            vendor/hg-engine vendor/pokeplatinum \
            --report pt05c-move-compatibility.json

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: pt05c-move-compatibility-audit
          path: pt05c-move-compatibility.json
          if-no-files-found: error
          retention-days: 30
