name: PB02AX Continue West To Verity Lakefront

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ax-continue-west-verity.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PB02AW route probe
        uses: actions/download-artifact@v4
        with:
          name: pb02aw-route201-verity-probe
          path: checkpoint
          run-id: 36008087694
          github-token: ${{ github.token }}

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ax-venv"
          . "$RUNNER_TEMP/pb02ax-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Continue west from cleared upper corridor
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ax-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/west_then_north.dst")
          out=Path("pb02ax-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"PB02AX stopped at {frame}")

          def pulse(key,held=10,settle=190):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})
              return img

          def text_box_present(img):
              rgb=img.convert("RGB")
              total=0; light=0
              for y in range(148,188,4):
                  for x in range(4,252,4):
                      r,g,b=rgb.getpixel((x,y)); total+=1
                      if r>205 and g>205 and b>205: light+=1
              return light/total > 0.25

          cap("upper-corridor-start")

          trigger_at=None
          for i in range(1,36):
              pulse(Keys.KEY_LEFT)
              if i % 5 == 0:
                  img=cap(f"west-{i:02d}")
                  if text_box_present(img):
                      trigger_at=i
                      break

          run(900); cap("west-route-stable")

          # If Lakefront auto dialogue fired, advance through 'We're at the lake'
          # and allow the scripted transition into Lake Verity.
          for i in range(1,6):
              pulse(Keys.KEY_A,12,800)
              cap(f"advance-{i:02d}")

          run(1800); cap("verity-entry-stable")

          saved=out/"verity-entry-probe.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02ax-meta.json").write_text(json.dumps({
              "gate":"PB02AX_CONTINUE_WEST_TO_VERITY",
              "source_artifact":10811073827,
              "source_state":"west_then_north.dst",
              "west_trigger_at":trigger_at,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AX proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ax-continue-west-verity-proof
          path: pb02ax-play/
          if-no-files-found: error
          retention-days: 14
