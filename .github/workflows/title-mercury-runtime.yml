name: Mercury Title Runtime Proof

on:
  workflow_dispatch:
  push:
    branches:
      - feature/title-mercury-art
      - feature/title-mercury-motion
    paths:
      - "tools/generate_mercury_title.py"
      - "assets/title_screen/**"
      - "docs/MERCURY_TITLE_SCREEN_SPEC.md"
      - "platinum-overlay/res/text/title_screen.json"
      - ".github/workflows/title-mercury-runtime.yml"
      - "upstream/LOCK.json"

concurrency:
  group: mercury-title-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  title-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned pokeplatinum
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

      - name: Apply Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Generate Mercury title assets
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/title-venv"
          . "$RUNNER_TEMP/title-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum
          test -s vendor/pokeplatinum/res/graphics/title_screen/logo.png
          test -s vendor/pokeplatinum/res/graphics/title_screen/top_screen_border.png
          for p in assets/title_screen/logo64.b64.{a,b,c,d}; do test -s "$p"; done
          for p in assets/title_screen/footer16.b64.{a,b}; do test -s "$p"; done
          grep -q '"en_US": "PRESS START"' vendor/pokeplatinum/res/text/title_screen.json
          grep -q 'GX_RGB(26, 26, 31)' vendor/pokeplatinum/src/applications/title_screen.c
          grep -q 'Mercury Redux: subtle DS-native logo float' vendor/pokeplatinum/src/applications/title_screen.c

      - name: Install Metroskrew
        working-directory: vendor/pokeplatinum
        shell: bash
        run: sudo make skrew

      - name: Configure
        working-directory: vendor/pokeplatinum
        shell: bash
        run: make configure

      - name: Build ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Install emulator proof tools
        shell: bash
        run: |
          . "$RUNNER_TEMP/title-venv/bin/activate"
          pip install py-desmume

      - name: Capture real title screen
        shell: bash
        run: |
          . "$RUNNER_TEMP/title-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME

          rom=Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out=Path("runtime-preview")
          out.mkdir(exist_ok=True)

          emu=DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start Mercury title build")

          captures=[14800,15200,15600,16000]
          current=0
          meta=[]
          try:
              for target in captures:
                  for _ in range(target-current):
                      emu.cycle(False)
                  current=target
                  image=emu.screenshot()
                  path=out/f"mercury-title-{target}.png"
                  image.save(path)
                  rgb=image.convert("RGB")
                  colors=rgb.getcolors(maxcolors=256*384)
                  unique=len(colors) if colors is not None else 256*384
                  meta.append({"frame":target,"file":path.name,"unique_colors":unique,"blank_like":unique < 16})
          finally:
              emu.destroy()

          usable=[m for m in meta if not m["blank_like"]]
          if not usable:
              raise SystemExit("all Mercury title captures were blank")
          (out/"title-meta.json").write_text(json.dumps({
              "gate":"MERCURY_TITLE_NATIVE_RUNTIME",
              "expected_prompt":"PRESS START",
              "preserved_native_behavior":True,
              "captures":meta,
              "usable_capture_count":len(usable)
          },indent=2)+"\n")
          PY

      - name: Upload runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-title-runtime-proof
          path: |
            runtime-preview/*.png
            runtime-preview/title-meta.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Mercury Redux title build completed"
            echo
            echo "- Native Platinum title application retained"
            echo "- Mercury Redux generated branding applied"
            echo "- PRESS START restored as live native layer"
            echo "- Original title timing/input behavior retained"
            echo "- Runtime screenshots captured from actual ROM"
          } >> "$GITHUB_STEP_SUMMARY"
