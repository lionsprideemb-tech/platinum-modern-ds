name: PB02AA Exact Barry THUD Route

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02aa-exact-barry-thud.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Twinleaf checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10789223904/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/twinleaf-exterior.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02aa-venv"
          . "$RUNNER_TEMP/pb02aa-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Walk exact central-road route into Barry THUD trigger
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02aa-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/twinleaf-exterior.dst")
          out=Path("pb02aa-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=280):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("twinleaf-checkpoint")

          # Checkpoint is one tile south of the player-house door (116,885).
          # Use the clear central road: west 4 -> north 10 -> west 7.
          # Final west step should enter the pinned THUD coord event at (105,876).
          for i in range(1,5):
              pulse(Keys.KEY_LEFT,12,220)
              cap(f"central-west-{i:02d}")

          for i in range(1,11):
              pulse(Keys.KEY_UP,12,220)
              if i in (2,4,6,8,10):
                  cap(f"central-north-{i:02d}")

          for i in range(1,7):
              pulse(Keys.KEY_LEFT,12,220)
              if i in (2,4,6):
                  cap(f"rival-approach-west-{i:02d}")

          cap("one-tile-before-thud")
          pulse(Keys.KEY_LEFT,12,1600)
          cap("thud-trigger-step")
          run(1000); cap("thud-event-visible")

          # The native event contains several timed movements and messages.
          for i in range(1,9):
              pulse(Keys.KEY_A,12,600)
              cap(f"thud-event-a-{i:02d}")

          run(1200); cap("post-thud-stable")

          saved=out/"post-barry-thud-confirmed.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02aa-meta.json").write_text(json.dumps({
              "gate":"PB02AA_EXACT_BARRY_THUD_ROUTE",
              "source_checkpoint_artifact":10789223904,
              "source_rom_sha256":hashlib.sha256(rom.read_bytes()).hexdigest(),
              "route":"LEFT x4, UP x10, LEFT x6, final LEFT into (105,876)",
              "target_coord":[105,876],
              "state_file":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02aa-exact-barry-thud-proof
          path: pb02aa-play/
          if-no-files-found: error
          retention-days: 14
