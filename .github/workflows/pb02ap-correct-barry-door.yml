name: PB02AP Correct Barry Front Door Exit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ap-correct-barry-door.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and near-door state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10808268896/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/post-barry-house-exit.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ap-venv"
          . "$RUNNER_TEMP/pb02ap-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Align to front door and exit
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ap-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/post-barry-house-exit.dst")
          out=Path("pb02ap-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"PB02AP stopped at {frame}")

          def pulse(key,held=12,settle=850):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("near-front-door")
          pulse(Keys.KEY_LEFT); cap("left-1")
          pulse(Keys.KEY_LEFT); cap("left-2")
          pulse(Keys.KEY_DOWN,12,1200); cap("down-1")
          pulse(Keys.KEY_DOWN,12,1200); cap("down-2")
          run(800); cap("exit-stable")

          saved=out/"twinleaf-post-barry-exterior.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02ap-meta.json").write_text(json.dumps({
              "gate":"PB02AP_CORRECT_BARRY_FRONT_DOOR_EXIT",
              "source_artifact":10808268896,
              "route":"LEFT x2, DOWN x2",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ap-correct-barry-door-proof
          path: pb02ap-play/
          if-no-files-found: error
          retention-days: 14
