name: PT04E Gen VI Bulk Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pt04e-gen6-bulk-expansion
    paths:
      - "data/canonical_species_1025.txt"
      - "tools/build_species_registry.py"
      - "tools/build_ds_species_id_map.py"
      - "tools/audit_pt04d_species_batch.py"
      - "tools/install_pt04d_species_batch.py"
      - "platinum-overlay/**"
      - "tools/generate_mercury_title.py"
      - "assets/title_screen/**"
      - ".github/workflows/pt04e-gen6-bulk-build.yml"
      - "upstream/LOCK.json"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  gen6-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends             bison flex g++ gcc-arm-none-eabi git make ninja-build             pkg-config python3 python3-venv python3-pip wget xz-utils             libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned pokeplatinum
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Checkout pinned HG-Engine Gen VI donor
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set             /data/Species.c             /data/BaseExperienceTable.c             /data/IconPaletteTable.c             /data/HeightTable.c             /data/SpriteOffsets.c             /data/graphics/sprites/
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          test -s vendor/hg-engine/data/Species.c
          test -s vendor/hg-engine/data/SpriteOffsets.c
          test -s vendor/hg-engine/data/graphics/sprites/chespin/male/front.png
          test -s vendor/hg-engine/data/graphics/sprites/volcanion/male/front.png

      - name: Register canonical species through Volcanion
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum             --through 721             --output vendor/pokeplatinum/generated/species.txt             --report pt04e-gen6-registry.json
          test "$(sed -n '650p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_GENESECT"
          test "$(sed -n '651p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_CHESPIN"
          test "$(sed -n '722p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_VOLCANION"
          test "$(sed -n '723p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_EGG"
          test "$(sed -n '724p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_BAD_EGG"

      - name: Re-audit Gen VI donor batch
        shell: bash
        run: |
          python3 tools/audit_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 650 --end-dex 721             --gate PT04E_GEN6_DONOR_AUDIT             --report pt04e-gen6-donor-audit.json

      - name: Restore sealed Gen V prerequisite resources
        shell: bash
        run: |
          python3 tools/install_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 494 --end-dex 649             --gate PT04D_GEN5_PREREQUISITE_INSTALL             --report pt04e-gen5-prerequisite-install.json
          test "$(jq -r '.installed_species' pt04e-gen5-prerequisite-install.json)" = "156"
          test -s vendor/pokeplatinum/res/pokemon/victini/meson.build
          test -s vendor/pokeplatinum/res/pokemon/genesect/meson.build

      - name: Install Gen VI resource batch
        shell: bash
        run: |
          python3 tools/install_pt04d_species_batch.py             vendor/pokeplatinum vendor/hg-engine             --start-dex 650 --end-dex 721             --gate PT04E_GEN6_BATCH_INSTALL             --report pt04e-gen6-install.json
          test "$(jq -r '.installed_species' pt04e-gen6-install.json)" = "72"
          test "$(jq -r '.first.species' pt04e-gen6-install.json)" = "SPECIES_CHESPIN"
          test "$(jq -r '.last.species' pt04e-gen6-install.json)" = "SPECIES_VOLCANION"
          test -s vendor/pokeplatinum/res/pokemon/chespin/data.json
          test -s vendor/pokeplatinum/res/pokemon/flabebe/data.json
          test -s vendor/pokeplatinum/res/pokemon/meowstic/data.json
          test -s vendor/pokeplatinum/res/pokemon/aegislash/data.json
          test -s vendor/pokeplatinum/res/pokemon/volcanion/data.json

      - name: Generate sealed Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pt04e-venv"
          . "$RUNNER_TEMP/pt04e-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Install Metroskrew
        working-directory: vendor/pokeplatinum
        shell: bash
        run: sudo make skrew

      - name: Configure Gen VI-expanded Platinum
        working-directory: vendor/pokeplatinum
        shell: bash
        run: make configure

      - name: Build Platinum through Volcanion
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Verify Gen VI expanded archives
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct

          roots = [Path("/var/tmp/pokeplatinum"), Path("vendor/pokeplatinum")]

          def find_one(name):
              for root in roots:
                  if root.exists():
                      matches = list(root.rglob(name))
                      if matches:
                          return matches[0]
              raise SystemExit(f"missing compiled archive: {name}")

          def narc_count(path):
              data = path.read_bytes()
              pos = data.find(b"BTAF")
              if pos < 0:
                  pos = data.find(b"FATB")
              if data[:4] != b"NARC" or pos < 0:
                  raise SystemExit(f"invalid NARC: {path}")
              return struct.unpack_from("<H", data, pos + 8)[0]

          counts = {
              "pl_personal": narc_count(find_one("pl_personal.narc")),
              "pl_pokegra": narc_count(find_one("pl_pokegra.narc")),
              "pl_poke_icon": narc_count(find_one("pl_poke_icon.narc")),
              "height": narc_count(find_one("height.narc")),
          }

          # NONE + 721 canonical base species plus pre-existing form data.
          if counts["pl_personal"] < 722:
              raise SystemExit(f"personal archive did not reach Volcanion: {counts}")
          if counts["pl_pokegra"] < 722 * 6:
              raise SystemExit(f"pokegra archive did not reach Volcanion: {counts}")
          if counts["pl_poke_icon"] < 722:
              raise SystemExit(f"icon archive did not reach Volcanion: {counts}")
          if counts["height"] < 722 * 4:
              raise SystemExit(f"height archive did not reach Volcanion: {counts}")

          proof = {
              "gate": "PT04E_GEN6_COMPILED_ARCHIVES",
              "canonical_range": [650, 721],
              "first": "SPECIES_CHESPIN",
              "last": "SPECIES_VOLCANION",
              "counts": counts,
              "next_gate": "PT04E_GEN6_SAVE_RELOAD_RUNTIME",
          }
          Path("pt04e-gen6-archive-proof.json").write_text(
              json.dumps(proof, indent=2) + "\n"
          )
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload PT04E Gen VI build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt04e-gen6-bulk-build-proof
          path: |
            pt04e-gen6-registry.json
            pt04e-gen6-donor-audit.json
            pt04e-gen5-prerequisite-install.json
            pt04e-gen6-install.json
            pt04e-gen6-archive-proof.json
          if-no-files-found: warn
          retention-days: 14

      - name: PT04E summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PT04E Gen VI bulk build"
            echo
            echo "- Canonical native IDs: Chespin 650 through Volcanion 721"
            echo "- 72 donor species/resources processed as one batch"
            echo "- Alternate forms remain a separate form-registry pass"
            echo "- Unsupported modern mechanics remain explicit in pt04e-gen6-install.json"
          } >> "$GITHUB_STEP_SUMMARY"
