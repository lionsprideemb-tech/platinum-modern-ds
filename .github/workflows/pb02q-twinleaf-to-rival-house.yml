name: PB02Q Twinleaf Exterior To Rival House

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02q-twinleaf-to-rival-house.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Twinleaf checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact pb02p2-checkpoint
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01-artifact.zip
          unzip -q pb01-artifact.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10789223904/zip > pb02p2.zip
          unzip -q pb02p2.zip -d pb02p2-checkpoint
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"
          test -s pb02p2-checkpoint/twinleaf-exterior.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02q-venv"
          . "$RUNNER_TEMP/pb02q-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Resume from Twinleaf and walk toward rival house
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02q-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("pb02p2-checkpoint/twinleaf-exterior.dst")
          out=Path("pb02q-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"stopped at resumed frame {frame}")

          def pulse(key,held=12,settle=300):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("twinleaf-checkpoint-loaded")
          run(500); cap("twinleaf-checkpoint-stable")

          # Player starts just outside home. Move west toward Barry's side of town,
          # preserving every tile so we can visually correct the route if needed.
          for i in range(1,9):
              pulse(Keys.KEY_LEFT,12,260)
              cap(f"left-{i:02d}")

          for i in range(1,5):
              pulse(Keys.KEY_UP,12,260)
              cap(f"up-{i:02d}")

          # If a Barry event or house-entry dialogue has triggered, advance it
          # cautiously; otherwise these are harmless interaction probes.
          for i in range(1,7):
              pulse(Keys.KEY_A,12,420)
              cap(f"a-probe-{i:02d}")

          run(700); cap("rival-house-route-stable")

          (out/"pb02q-meta.json").write_text(json.dumps({
              "gate":"PB02Q_TWINLEAF_EXTERIOR_TO_RIVAL_HOUSE",
              "source_checkpoint_artifact":10789223904,
              "input_mode":"native DS keys from saved emulator checkpoint",
              "last_resumed_frame":frame,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02Q screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02q-twinleaf-to-rival-house-proof
          path: pb02q-play/
          if-no-files-found: warn
          retention-days: 14
