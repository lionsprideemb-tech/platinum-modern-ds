name: PB02B Rowan Intro To Player Choice

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02b-rowan-to-player-choice.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download sealed PB01 playable candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip \
            > pb01-artifact.zip
          unzip -q pb01-artifact.zip -d pb01-artifact
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02b-venv"
          . "$RUNNER_TEMP/pb02b-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Play Rowan intro through no-info choice
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02b-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          out=Path("pb02b-play")
          out.mkdir(exist_ok=True)

          emu=DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("PB02B ROM did not boot")

          frame=0
          captures=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"emulator stopped at frame {frame}")

          def pulse(key, held=12, settle=240):
              m=keymask(key)
              emu.input.keypad_add_key(m)
              run(held)
              emu.input.keypad_rm_key(m)
              run(settle)

          def cap(label):
              im=emu.screenshot()
              name=f"{len(captures):02d}-{label}-{frame:05d}.png"
              im.save(out/name)
              colors=im.convert("RGB").getcolors(maxcolors=256*384)
              unique=len(colors) if colors is not None else 256*384
              captures.append({"stage":label,"frame":frame,"file":name,"unique_colors":unique})

          try:
              run(16000); cap("title")
              pulse(Keys.KEY_START,20,700); cap("rowan-entry")

              for i in range(1,7):
                  pulse(Keys.KEY_A,12,300)
                  cap(f"rowan-dialogue-{i:02d}")

              # PB02A proved the default selector is CONTROL INFO.
              # Move deliberately to NO INFO NEEDED instead of entering help.
              pulse(Keys.KEY_DOWN,12,120); cap("advice-menu-down-1")
              pulse(Keys.KEY_DOWN,12,120); cap("advice-menu-no-info-selected")
              pulse(Keys.KEY_A,12,420); cap("no-info-confirmed")

              # Continue the normal Rowan sequence in small observable steps.
              for i in range(1,11):
                  pulse(Keys.KEY_A,12,320)
                  cap(f"post-advice-a-{i:02d}")

              run(600); cap("stable-end")
          finally:
              emu.destroy()

          meta={
              "gate":"PB02B_ROWAN_TO_PLAYER_CHOICE",
              "input_mode":"native DS keys",
              "last_frame":frame,
              "captures":captures,
              "visual_review_required":True
          }
          (out/"pb02b-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload PB02B screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02b-rowan-to-player-choice-proof
          path: pb02b-play/
          if-no-files-found: warn
          retention-days: 14
