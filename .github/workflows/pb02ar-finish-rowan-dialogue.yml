name: PB02AR Finish Rowan Starter Dialogue

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ar-finish-rowan-dialogue.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and Rowan scene state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10808757882/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/route201-rowan-starter-gate.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ar-venv"
          . "$RUNNER_TEMP/pb02ar-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Continue Rowan scene to starter gate
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ar-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/route201-rowan-starter-gate.dst")
          out=Path("pb02ar-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AR stopped at {frame}")

          def pulse(key,held=12,settle=1050):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("rowan-scene-resume")

          for i in range(1,31):
              pulse(Keys.KEY_A)
              if i in (4,8,12,16,20,24,28,30):
                  cap(f"a-{i:02d}")

          run(1800); cap("rowan-scene-stable")

          saved=out/"route201-starter-ready.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02ar-meta.json").write_text(json.dumps({
              "gate":"PB02AR_FINISH_ROWAN_STARTER_DIALOGUE",
              "source_artifact":10808757882,
              "additional_a_presses":30,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"interact with briefcase and choose starter"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ar-finish-rowan-dialogue-proof
          path: pb02ar-play/
          if-no-files-found: error
          retention-days: 14
