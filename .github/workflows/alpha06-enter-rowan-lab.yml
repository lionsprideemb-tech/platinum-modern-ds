name: ALPHA06 Enter Rowan Lab

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/alpha06-enter-rowan-lab.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  enter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS alpha branch
        uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download ALPHA05 Rowan approach checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-alpha05-rowan-escort
          path: checkpoint
          run-id: 36013936863
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/mercury-alpha06-venv"
          . "$RUNNER_TEMP/mercury-alpha06-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Finish Barry handoff and enter lab
        shell: bash
        run: |
          . "$RUNNER_TEMP/mercury-alpha06-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/alpha05-rowan-approach.dst")
          out=Path("alpha06-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"ALPHA06 stopped at {frame}")

          def pulse(key, held=12, settle=850):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(180); cap("barry-lab-door")
          for i in range(1,6):
              pulse(Keys.KEY_A)
              cap(f"lab-entry-a-{i:02d}")

          run(1200); cap("lab-entry-stable")
          saved=out/"alpha06-rowan-lab.dst"
          emu.savestate.save_file(str(saved))
          (out/"alpha06-meta.json").write_text(json.dumps({
              "gate":"ALPHA06_ENTER_ROWAN_LAB",
              "source_run":36013936863,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload ALPHA06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-alpha06-rowan-lab
          path: alpha06-play/
          if-no-files-found: error
          retention-days: 30
