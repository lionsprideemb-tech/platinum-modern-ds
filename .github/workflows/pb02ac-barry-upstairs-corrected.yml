name: PB02AC Barry Upstairs Corrected Fast Pass

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ac-barry-upstairs-corrected.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and safe Twinleaf checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10790910656/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/post-barry-thud-confirmed.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ac-venv"
          . "$RUNNER_TEMP/pb02ac-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Complete THUD, enter Barry house, finish upstairs event
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ac-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/post-barry-thud-confirmed.dst")
          out=Path("pb02ac-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=500):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("safe-checkpoint")

          # Verified visually: UP x3 starts Barry's THUD scene.
          for _ in range(3): pulse(Keys.KEY_UP,12,450)
          cap("thud-start")

          # Source/text proof: after THUD, native dialogue requires five page/close
          # confirmations total before Barry re-enters the house.
          for i in range(1,6):
              pulse(Keys.KEY_A,12,1100)
              cap(f"thud-a-{i:02d}")

          run(1800); cap("thud-complete-field")

          # Trigger pushes player one tile south, so two UP steps reach the door warp.
          pulse(Keys.KEY_UP,12,450); cap("door-approach")
          pulse(Keys.KEY_UP,12,1200); cap("barry-house-1f-arrival")
          run(700); cap("barry-house-1f-stable")

          # Interior source: entry warp is (6,10), stairs are (2,3).
          for i in range(4):
              pulse(Keys.KEY_LEFT,12,250)
          cap("one-f-x-aligned")
          for i in range(6):
              pulse(Keys.KEY_UP,12,280)
          cap("stair-warp-step")
          run(1200); cap("barry-house-2f-event")

          # Upstairs text: Take Bag/Journal (1 confirmation) then Waiting on Road
          # (2 pages). Four A presses leave one safety confirmation after movement.
          for i in range(1,5):
              pulse(Keys.KEY_A,12,1200)
              cap(f"upstairs-a-{i:02d}")

          run(2000); cap("upstairs-event-finished")
          pulse(Keys.KEY_DOWN,12,350); cap("upstairs-field-control")

          saved=out/"pb02ac-post-barry-upstairs.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02ac-meta.json").write_text(json.dumps({
              "gate":"PB02AC_BARRY_UPSTAIRS_CORRECTED_FAST_PASS",
              "source_state":"post-barry-thud-confirmed.dst",
              "thud_confirmations":5,
              "upstairs_confirmations":4,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload corrected proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ac-barry-upstairs-corrected-proof
          path: pb02ac-play/
          if-no-files-found: error
          retention-days: 14
