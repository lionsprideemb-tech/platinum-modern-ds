name: PB02AO Barry House Exit Fast Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ao-barry-house-exit.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and Barry-complete state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10803922585/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/pb02ak-horizontal-probe.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ao-venv"
          . "$RUNNER_TEMP/pb02ao-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Exit Barry house
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ao-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/pb02ak-horizontal-probe.dst")
          out=Path("pb02ao-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AO stopped at {frame}")

          def pulse(key,held=12,settle=450):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("barry-2f-complete")
          pulse(Keys.KEY_UP,12,650)
          pulse(Keys.KEY_LEFT,12,1100)
          cap("barry-1f-return-confirmed")

          for i in range(1,9):
              pulse(Keys.KEY_DOWN,12,230)
              if i in (4,8): cap(f"down-{i:02d}")

          for i in range(1,7):
              pulse(Keys.KEY_RIGHT,12,230)
              if i in (3,6): cap(f"right-{i:02d}")

          for i in range(1,4):
              pulse(Keys.KEY_DOWN,12,900)
              cap(f"door-down-{i:02d}")

          run(900); cap("exit-stable")
          saved=out/"post-barry-house-exit.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02ao-meta.json").write_text(json.dumps({
              "gate":"PB02AO_BARRY_HOUSE_EXIT_FAST_PROBE",
              "source_artifact":10803922585,
              "two_f_to_one_f":"UP, LEFT",
              "one_f_probe":"DOWN x8, RIGHT x6, DOWN x3",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ao-barry-house-exit-proof
          path: pb02ao-play/
          if-no-files-found: error
          retention-days: 14
