name: PB02AY Finish Lake Verity Cyrus Opening

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ay-finish-cyrus-opening.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download Lake Verity opening checkpoint
        uses: actions/download-artifact@v4
        with:
          name: pb02aw3-visual-route-verity-proof
          path: checkpoint
          run-id: 36008822095
          github-token: ${{ github.token }}

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ay-venv"
          . "$RUNNER_TEMP/pb02ay-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish Cyrus and Barry Lake Verity cutscene
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ay-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/verity-opening-probe.dst")
          out=Path("pb02ay-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"PB02AY stopped at {frame}")

          def pulse(key,held=12,settle=1050):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("cyrus-lake-bed-message")

          # Continue the native cutscene. We are on Cyrus's final lake-bed page.
          # The remaining script contains Cyrus passing, the Mesprit cry, and
          # Barry realizing they have no Poké Balls before he races to Sandgem.
          for i in range(1,23):
              pulse(Keys.KEY_A,12,1050)
              if i <= 8 or i in (10,12,14,16,18,20,22):
                  cap(f"lake-verity-a-{i:02d}")

          run(2600); cap("lake-verity-cutscene-stable")

          # Prove ReleaseAll/native field control after Barry has left.
          pulse(Keys.KEY_DOWN,12,450)
          cap("lake-verity-field-control")

          saved=out/"post-lake-verity-cyrus-certified.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02ay-meta.json").write_text(json.dumps({
              "gate":"PB02AY_FINISH_LAKE_VERITY_CYRUS_OPENING",
              "source_run":36008822095,
              "source_artifact":"pb02aw3-visual-route-verity-proof",
              "expected_end_state":{
                  "VAR_FOLLOWER_RIVAL_STATE":4,
                  "VAR_VISITED_LAKE_VERITY_WITH_RIVAL":1,
                  "rival_left_lake":true
              },
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":true,
              "next":"PB02AZ exit Lake Verity and fast-play to Sandgem / Rowan lab"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AY proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ay-cyrus-opening-certified
          path: pb02ay-play/
          if-no-files-found: error
          retention-days: 14
