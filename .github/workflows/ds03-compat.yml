name: DS03 Platinum World Compatibility

on:
  push:
    branches:
      - feature/ds03-platinum-world-compat
    paths:
      - "tools/convert_platinum_landdata.py"
      - "tools/convert_platinum_events.py"
      - "tests/test_landdata_converter.py"
      - "platinum_port/**"
      - "docs/DS03_**"
      - "upstream/LOCK.json"
      - ".github/workflows/ds03-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twinleaf-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Run synthetic land-data regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_landdata_converter.py

      - name: Checkout pinned Platinum source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"
          git clone --filter=blob:none https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$commit"

      - name: Convert and validate real Twinleaf maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/twinleaf-hgss
          for id in 000 180 184 185 186 187; do
            src="vendor/pokeplatinum/res/field/maps/data/map_data_${id}.bin"
            out="/tmp/twinleaf-hgss/map_data_${id}.bin"
            python3 tools/convert_platinum_landdata.py "$src" "$out"
            src_size="$(stat -c%s "$src")"
            out_size="$(stat -c%s "$out")"
            test "$out_size" -eq "$((src_size + 4))"
          done

      - name: Smoke-test Twinleaf event conversion shape
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/convert_platinum_events.py             vendor/pokeplatinum/res/field/events/events_twinleaf_town.json             /tmp/events_twinleaf_town_hgss.json             --header fielddata/script/scr_seq/event_TWINLEAF.h

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/events_twinleaf_town_hgss.json")
          data = json.loads(p.read_text())
          assert len(data["objects"]) == 8
          assert len(data["warps"]) == 4
          assert len(data["coords"]) == 2
          assert len(data["bgs"]) == 1
          assert all(w["y"] == 0 for w in data["warps"])
          assert all("header" in w and "anchor" in w for w in data["warps"])
          print("Twinleaf event structural conversion: PASS")
          PY

      - name: Validate source manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq '.twinleaf.headers | length' platinum_port/twinleaf/source_manifest.json)" = "7"
          test "$(jq -r '.twinleaf.headers[0].map_model' platinum_port/twinleaf/source_manifest.json)" = "MAP_000"
          test "$(jq -r '.twinleaf.headers[4].map_model' platinum_port/twinleaf/source_manifest.json)" = "MAP_187"
          test "$(jq -r '.compatibility.map_matrix' platinum_port/twinleaf/source_manifest.json)" = "DIRECT_BINARY_FORMAT_AFTER_ID_REMAP"
