name: DS01 Sprite Recovery Search

on:
  push:
    branches:
      - audit/ds01-sprite-dedup-20260928
    paths:
      - "tools/audit_ds01_sprite_recovery.py"
      - ".github/workflows/ds01-sprite-recovery-search.yml"
      - "data/ds01_sprite_quarantine.json"
  pull_request:
    branches:
      - assets/ds01-community-sprites-20260922
    paths:
      - "tools/audit_ds01_sprite_recovery.py"
      - ".github/workflows/ds01-sprite-recovery-search.yml"
      - "data/ds01_sprite_quarantine.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"

      - name: Search source packs
        run: |
          python tools/audit_ds01_sprite_recovery.py \
            staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip \
            data/ds01_sprite_quarantine.json \
            --out data/ds01_sprite_recovery_candidates.json

      - name: Upload recovery report
        uses: actions/upload-artifact@v4
        with:
          name: ds01-sprite-recovery-candidates
          path: data/ds01_sprite_recovery_candidates.json

      - name: Commit recovery report on push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ds01_sprite_recovery_candidates.json
          if git diff --cached --quiet; then
            echo "Recovery report unchanged."
          else
            git commit -m "Record DS01 sprite recovery candidates"
            git push
          fi
