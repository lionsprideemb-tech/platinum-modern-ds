name: MR03F Summary Bottom Move Learner

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr03f-summary-bottom-learner
    paths:
      - ".github/workflows/mr03f-summary-bottom-learner.yml"
      - "tools/install_mr03f_summary_bottom_learner.py"
      - "tools/install_mr03e_summary_top_shell.py"
      - "tools/install_mr03_party_move_learner.py"
      - "tools/install_mercury_move_learner.py"
      - "tools/install_mr03_party_path_harness.py"
      - "tools/install_mp05_ability_namespace.py"
      - "tools/install_pt04d_species_batch.py"
      - "tools/install_pt05a_compatible_learnsets.py"
      - "tools/install_pt05b_compatible_evolutions.py"
      - "tools/install_pt05c_move_id_width.py"
      - "tools/install_pt05c1_modern_moves.py"
      - "tools/audit_move_id_namespace.py"
      - "data/**"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - "tools/generate_mercury_title.py"
      - "upstream/LOCK.json"

permissions:
  contents: read

concurrency:
  group: mr03f-summary-bottom-\${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  prove-summary-bottom-learner:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Python syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_pt04d_species_batch.py \
            tools/install_pt05a_compatible_learnsets.py \
            tools/install_pt05b_compatible_evolutions.py \
            tools/install_pt05c_move_id_width.py \
            tools/install_pt05c1_modern_moves.py \
            tools/install_mercury_move_learner.py \
            tools/install_mr03_party_move_learner.py \
            tools/install_mr03e_summary_top_shell.py \
            tools/install_mr03f_summary_bottom_learner.py \
            tools/install_mr03_party_path_harness.py

      - name: Restore modern Mercury foundation
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr03f-abilities.json \
            --implemented-registry mr03f-implemented-abilities.txt

          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mr03f-species.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --implemented-abilities mr03f-implemented-abilities.txt \
              --gate "MR03F_\${tag}" \
              --report "mr03f-\${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum
          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr03f-modern-moves.json \
            --implemented-registry mr03f-implemented-moves.txt
          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mr03f-implemented-moves.txt \
            --report mr03f-learnsets.json
          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mr03f-evolutions.json

      - name: Install universal Move Learner backend
        shell: bash
        run: |
          python3 tools/install_mercury_move_learner.py \
            vendor/pokeplatinum vendor/hg-engine \
            --implemented-moves mr03f-implemented-moves.txt \
            --report mr03f-move-learner.json

          grep -q 'MERCURY_MOVE_LEARNER_MAX_MOVES 512' \
            vendor/pokeplatinum/include/move_reminder_data.h
          grep -q 'MERCURY_MOVE_LEARNER_SOURCE_SHIFT 14' \
            vendor/pokeplatinum/generated/mercury_move_learner.h

      - name: Install Summary host and bottom learner
        shell: bash
        run: |
          python3 tools/install_mr03_party_move_learner.py \
            vendor/pokeplatinum \
            --report mr03f-party-entry.json

          python3 tools/install_mr03e_summary_top_shell.py \
            vendor/pokeplatinum \
            --report mr03f-summary-top-shell.json

          python3 tools/install_mr03f_summary_bottom_learner.py \
            vendor/pokeplatinum \
            --report mr03f-summary-bottom-learner.json

          test "$(jq -r '.status' mr03f-summary-bottom-learner.json)" = "PASS"
          grep -q 'MercuryMoveLearner_Init' \
            vendor/pokeplatinum/src/applications/pokemon_summary_screen/main.c
          grep -q 'SUMMARY_MODE_MERCURY_MOVE_LEARNER_SELECT' \
            vendor/pokeplatinum/include/applications/pokemon_summary_screen/main.h
          grep -q 'Pokemon_ResetMoveSlot' vendor/pokeplatinum/src/start_menu.c

      - name: Stage generated source
        shell: bash
        run: |
          mkdir -p mr03f-artifact
          cp mr03f-summary-bottom-learner.json mr03f-artifact/
          cp mr03f-summary-top-shell.json mr03f-artifact/
          cp mr03f-move-learner.json mr03f-artifact/
          cp vendor/pokeplatinum/src/applications/pokemon_summary_screen/main.c \
            mr03f-artifact/pokemon_summary_screen.generated.c
          cp vendor/pokeplatinum/include/applications/pokemon_summary_screen/main.h \
            mr03f-artifact/pokemon_summary_screen.generated.h
          cp vendor/pokeplatinum/src/start_menu.c \
            mr03f-artifact/start_menu.generated.c

      - name: Install CI-only Garchomp field harness
        shell: bash
        run: |
          python3 tools/install_mr03_party_path_harness.py \
            vendor/pokeplatinum \
            --report mr03f-harness.json
          cp mr03f-harness.json mr03f-artifact/

      - name: Generate Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mr03f-venv"
          . "$RUNNER_TEMP/mr03f-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Install Metroskrew and configure
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure

      - name: Build one MR03F proof ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Capture full DS Move Learner proof
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr03f-venv/bin/activate"
          pip install py-desmume
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import Keys, keymask

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start MR03F proof ROM")

          frame = 0
          captures = []

          def cycle(count):
              global frame
              for _ in range(count):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"MR03F runtime stopped near frame {frame}")

          def press(key, hold=4, settle=110):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              cycle(hold)
              emu.input.keypad_rm_key(mask)
              cycle(settle)

          def snap(label):
              full = emu.screenshot().convert("RGB")
              if full.size != (256, 384):
                  raise SystemExit(f"unexpected DeSmuME screenshot size: {full.size}")
              full_path = out / f"mr03f-{len(captures):02d}-{label}-full-{frame:05d}.png"
              top_path = out / f"mr03f-{len(captures):02d}-{label}-top-{frame:05d}.png"
              bottom_path = out / f"mr03f-{len(captures):02d}-{label}-bottom-{frame:05d}.png"
              full.save(full_path)
              full.crop((0, 0, 256, 192)).save(top_path)
              full.crop((0, 192, 256, 384)).save(bottom_path)
              captures.append({
                  "label": label,
                  "frame": frame,
                  "full": full_path.name,
                  "top": top_path.name,
                  "bottom": bottom_path.name,
              })

          try:
              cycle(3600)
              press(Keys.KEY_X, settle=120)
              press(Keys.KEY_A, settle=180)
              press(Keys.KEY_A, settle=120)
              press(Keys.KEY_DOWN, settle=60)
              press(Keys.KEY_A, settle=360)

              snap("browse")

              press(Keys.KEY_DOWN, settle=80)
              press(Keys.KEY_DOWN, settle=80)
              snap("browse-scrolled")

              press(Keys.KEY_A, settle=220)
              snap("teach-replacement")

              press(Keys.KEY_B, settle=260)
              snap("teach-cancel-return")

              press(Keys.KEY_R, settle=140)
              snap("stats-top-bottom-learner")
          finally:
              emu.destroy()

          meta = {
              "gate": "MERCURY_MR03F_RUNTIME",
              "architecture": "vanilla Platinum Summary top + Mercury Move Learner bottom",
              "captures": captures,
          }
          (out / "mr03f-runtime-meta.json").write_text(json.dumps(meta, indent=2) + "\n")

          if len(captures) != 5:
              raise SystemExit("MR03F did not capture every proof state")
          PY

      - name: Stage proof
        if: always()
        shell: bash
        run: |
          cp runtime-preview/*.png mr03f-artifact/ 2>/dev/null || true
          cp runtime-preview/mr03f-runtime-meta.json mr03f-artifact/ 2>/dev/null || true
          if test -s "$BUILD/pokeplatinum.us.nds"; then
            cp "$BUILD/pokeplatinum.us.nds" \
              mr03f-artifact/Pokemon_Mercury_MR03F_Summary_Bottom_Proof.nds
            sha256sum mr03f-artifact/Pokemon_Mercury_MR03F_Summary_Bottom_Proof.nds \
              > mr03f-artifact/SHA256SUMS.txt
          fi

      - name: Upload MR03F proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr03f-summary-bottom-move-learner
          path: mr03f-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercury MR03F"
            echo
            echo "- TOP: vanilla Platinum Summary renderer"
            echo "- BOTTOM: Mercury Move Learner browser"
            echo "- Up/Down browse learner"
            echo "- L/R change top Summary page"
            echo "- A enters native Platinum replacement screen"
            echo "- B cancels replacement back to learner"
            echo "- One proof ROM build"
          } >> "$GITHUB_STEP_SUMMARY"
