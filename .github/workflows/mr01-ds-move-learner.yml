name: MR01 DS Move Learner

on:
  push:
    branches:
      - feature/mercury-ds-move-learner
    paths:
      - ".github/workflows/mr01-ds-move-learner.yml"
      - "tools/install_mercury_move_learner.py"
      - "tools/install_mercury_move_learner_harness.py"
      - "tools/install_mp05_ability_namespace.py"
      - "tools/install_pt04d_species_batch.py"
      - "tools/install_pt05a_compatible_learnsets.py"
      - "tools/install_pt05b_compatible_evolutions.py"
      - "tools/install_pt05c_move_id_width.py"
      - "tools/install_pt05c1_modern_moves.py"
      - "tools/audit_move_id_namespace.py"
      - "data/**"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - "tools/generate_mercury_title.py"
      - "upstream/LOCK.json"

permissions:
  contents: read

concurrency:
  group: mr01-move-learner-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  build-runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          test -s vendor/hg-engine/data/learnsets/learnsets.json

      - name: Apply sealed Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Python syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_pt04d_species_batch.py \
            tools/install_pt05a_compatible_learnsets.py \
            tools/install_pt05b_compatible_evolutions.py \
            tools/install_pt05c_move_id_width.py \
            tools/install_pt05c1_modern_moves.py \
            tools/install_mercury_move_learner.py \
            tools/install_mercury_move_learner_harness.py

      - name: Restore MP05 canonical ability architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr01-ability-namespace.json \
            --implemented-registry mr01-implemented-abilities.txt

          test "$(jq -r '.canonical_ability_count' mr01-ability-namespace.json)" = "311"
          test "$(jq -r '.save_storage.capacity' mr01-ability-namespace.json)" = "1023"

      - name: Build canonical 1025 species registry
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mr01-species-registry.json
          test "$(sed -n '1026p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_PECHARUNT"

      - name: Install modern species resources
        shell: bash
        run: |
          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --implemented-abilities mr01-implemented-abilities.txt \
              --gate "MR01_${tag}_RESOURCE_INSTALL" \
              --report "mr01-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore 16-bit move namespace and modern learnsets
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr01-modern-moves.json \
            --implemented-registry mr01-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mr01-implemented-moves.txt \
            --report mr01-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mr01-evolutions.json

      - name: Install Mercury universal DS Move Learner
        shell: bash
        run: |
          python3 tools/install_mercury_move_learner.py \
            vendor/pokeplatinum vendor/hg-engine \
            --implemented-moves mr01-implemented-moves.txt \
            --report mr01-move-learner.json

          test "$(jq -r '.status' mr01-move-learner.json)" = "PASS"
          test "$(jq -r '.species_count' mr01-move-learner.json)" = "1025"
          test "$(jq -r '.total_extra_move_entries > 0' mr01-move-learner.json)" = "true"
          grep -q 'MERCURY_MOVE_LEARNER_MAX_MOVES 512' vendor/pokeplatinum/include/move_reminder_data.h
          grep -q 'sMercuryMoveLearnerExtraOffsets' vendor/pokeplatinum/generated/mercury_move_learner.h
          grep -q 'u16 numMoves;' vendor/pokeplatinum/src/applications/move_reminder.c
          grep -q '"MOVE LEARNER"' vendor/pokeplatinum/res/text/move_reminder.json
          if grep -q 'RemoveItem ITEM_HEART_SCALE' vendor/pokeplatinum/res/field/scripts/scripts_pastoria_city_east_house.s; then
            echo "Heart Scale cost still present" >&2
            exit 1
          fi

      - name: Install CI-only Move Learner direct-launch harness
        shell: bash
        run: |
          python3 tools/install_mercury_move_learner_harness.py \
            vendor/pokeplatinum \
            --report mr01-runtime-harness.json
          grep -q 'FieldSystem_OpenMoveReminderMenu(fieldSystem, learner)' vendor/pokeplatinum/src/field_map_change.c
          grep -q 'SPECIES_GARCHOMP' vendor/pokeplatinum/src/field_map_change.c

      - name: Generate Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mr01-venv"
          . "$RUNNER_TEMP/mr01-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Install Metroskrew
        working-directory: vendor/pokeplatinum
        shell: bash
        run: sudo make skrew

      - name: Configure Mercury DS
        working-directory: vendor/pokeplatinum
        shell: bash
        run: make configure

      - name: Build Mercury DS Move Learner ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Capture real Move Learner in DeSmuME
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr01-venv/bin/activate"
          pip install py-desmume
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start MR01 Move Learner ROM")

          checkpoints = list(range(480, 3121, 120))
          current = 0
          frames = []
          stopped_at = None
          try:
              for target in checkpoints:
                  for _ in range(target - current):
                      emu.cycle(False)
                      current += 1
                      if not emu.is_running():
                          stopped_at = current
                          break
                  if stopped_at is not None:
                      break

                  image = emu.screenshot()
                  path = out / f"mercury-move-learner-{target:04d}.png"
                  image.save(path)
                  rgb = image.convert("RGB")
                  colors = rgb.getcolors(maxcolors=256 * 384)
                  unique = len(colors) if colors is not None else 256 * 384
                  frames.append({
                      "frame": target,
                      "file": path.name,
                      "unique_colors": unique,
                      "blank_like": unique < 16,
                  })
          finally:
              emu.destroy()

          meta = {
              "gate": "MERCURY_DS_MOVE_LEARNER_RUNTIME",
              "rom": rom.name,
              "expected_label": "MOVE LEARNER",
              "expected_species": "GARCHOMP",
              "stopped_at": stopped_at,
              "captures": frames,
          }
          (out / "move-learner-meta.json").write_text(json.dumps(meta, indent=2) + "\n")

          if stopped_at is not None:
              raise SystemExit(f"Move Learner runtime stopped near frame {stopped_at}")
          if not any(not row["blank_like"] for row in frames):
              raise SystemExit("all Move Learner runtime captures were blank")
          PY

      - name: Stage MR01 build and proof
        if: always()
        shell: bash
        run: |
          mkdir -p mr01-artifact
          if test -s "$BUILD/pokeplatinum.us.nds"; then
            cp "$BUILD/pokeplatinum.us.nds" mr01-artifact/Pokemon_Mercury_MR01_Move_Learner.nds
            sha256sum mr01-artifact/Pokemon_Mercury_MR01_Move_Learner.nds > mr01-artifact/SHA256SUMS.txt
          fi
          cp mr01-move-learner.json mr01-artifact/ 2>/dev/null || true
          cp mr01-runtime-harness.json mr01-artifact/ 2>/dev/null || true
          cp mr01-modern-moves.json mr01-artifact/ 2>/dev/null || true
          cp runtime-preview/*.png mr01-artifact/ 2>/dev/null || true
          cp runtime-preview/move-learner-meta.json mr01-artifact/ 2>/dev/null || true

      - name: Upload MR01 Move Learner artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr01-ds-move-learner
          path: mr01-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercury MR01 — DS Move Learner"
            echo
            echo "- Platinum-native DS Move Reminder UI repurposed as MOVE LEARNER"
            echo "- Level-up + Egg + machine + tutor move pool"
            echo "- Platinum TM compatibility bits are not required by the learner"
            echo "- Known moves are removed from the selectable list"
            echo "- Unsupported modern move mechanics remain filtered"
            echo "- Pastoria learner is free; Heart Scale consumption removed"
            echo "- Full ROM compile and real DeSmuME screenshots required"
            echo "- Long playthrough intentionally skipped"
          } >> "$GITHUB_STEP_SUMMARY"
