name: PHASE-A12E Enter Home Finish Parcel

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a12e-enter-home-finish-parcel.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A12C checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a12c-post-parcel
          path: checkpoint
          run-id: 36027624518
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a12e-venv"
          . "$RUNNER_TEMP/phase-a12e-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Enter home and finish Journal Parcel event
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a12e-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a12c-post-parcel.dst")
          out=Path("phase-a12e"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]
          K={"U":Keys.KEY_UP,"D":Keys.KEY_DOWN,"L":Keys.KEY_LEFT,"R":Keys.KEY_RIGHT}

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A12E stopped at {frame}")

          def press(key, held=22, settle=180):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          def green_ratio():
              img=emu.screenshot().convert("RGB"); green=total=0
              for y in range(0,192,4):
                  for x in range(0,256,4):
                      r,g,b=img.getpixel((x,y)); total+=1
                      if g>=95 and g>r*1.18 and g>b*1.12: green+=1
              return green/total

          run(180); cap("start")
          for ch in "LDDDRRRUU":
              press(K[ch])
          run(900); cap("home-entry")

          if green_ratio() >= 0.12:
              raise SystemExit("Player house entry did not trigger")

          # Entry warp is at (6,10); Mom is at (7,8).
          press(Keys.KEY_UP)
          press(Keys.KEY_RIGHT)
          press(Keys.KEY_A,held=12,settle=700)
          cap("mom-journal-start")

          for i in range(1,27):
              press(Keys.KEY_A,held=12,settle=480)
              if i in (6,12,18,24,26):
                  cap(f"story-{i:02d}")

          run(1800); cap("post-parcel-stable")
          saved=out/"phase-a12e-post-parcel.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a12e-meta.json").write_text(json.dumps({
              "gate":"PHASE_A12E_ENTER_HOME_FINISH_PARCEL",
              "door_route":"LDDDRRRUU",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A12E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a12e-post-parcel
          path: phase-a12e/
          if-no-files-found: error
          retention-days: 30
