name: Mercury Move Learner Visual Proof

on:
  push:
    branches:
      - feature/ds-move-learner-complete
    paths:
      - ".github/workflows/mercury-move-learner-visual-proof.yml"

permissions:
  actions: read
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISPLAY: ":99"
      PROOF_RUN_ID: "36172838050"

    steps:
      - uses: actions/checkout@v4

      - name: Install emulator proof dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            desmume xvfb xdotool imagemagick git unzip

          EMU="$(command -v desmume || true)"
          if [ -z "$EMU" ] && [ -x /usr/games/desmume ]; then
            EMU=/usr/games/desmume
          fi
          if [ -z "$EMU" ]; then
            EMU="$(dpkg -L desmume | grep -E '/(desmume|desmume-cli)$' | head -n1 || true)"
          fi

          test -n "$EMU"
          test -x "$EMU"
          echo "EMU=$EMU" >> "$GITHUB_ENV"
          echo "DeSmuME executable: $EMU"
          dpkg -L desmume | grep -E '/usr/(bin|games)/' || true
          command -v Xvfb
          command -v xdotool
          command -v import
          "$EMU" --help > /tmp/desmume-help.txt 2>&1 || true
          head -100 /tmp/desmume-help.txt || true

      - name: Download compiled Move Learner ROM
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          gh run download "$PROOF_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name mercury-ds-move-learner \
            --dir runtime
          test -s runtime/Pokemon_Mercury_DS_Move_Learner.nds
          sha256sum runtime/Pokemon_Mercury_DS_Move_Learner.nds

      - name: Install compatible completed Platinum save
        shell: bash
        run: |
          SAVE_URL="https://raw.githubusercontent.com/Xieon/XFork_ProjectCompleteDexSaves/master/Gen%204%20-%20Pokemon%20Platinum%20(ENG).sav"
          curl -L --fail --retry 3 \
            "$SAVE_URL" \
            -o runtime/Pokemon_Mercury_DS_Move_Learner.sav

          SAVE="runtime/Pokemon_Mercury_DS_Move_Learner.sav"
          test -s "$SAVE"
          test "$(stat -c '%s' "$SAVE")" -ge 524288
          sha256sum "$SAVE"

          # The Ubuntu GTK build keeps battery data under ~/.config/desmume.
          # Seed both known locations so the raw Platinum save is available
          # before the ROM creates its first .dsv.
          mkdir -p "$HOME/.config/desmume" "$HOME/.config/desmume/Battery"
          cp "$SAVE" "$HOME/.config/desmume/Pokemon_Mercury_DS_Move_Learner.sav"
          cp "$SAVE" "$HOME/.config/desmume/Battery/Pokemon_Mercury_DS_Move_Learner.sav"
          rm -f runtime/Pokemon_Mercury_DS_Move_Learner.dsv
          rm -f "$HOME/.config/desmume/Pokemon_Mercury_DS_Move_Learner.dsv"
          rm -f "$HOME/.config/desmume/Battery/Pokemon_Mercury_DS_Move_Learner.dsv"

      - name: Boot ROM in DeSmuME
        shell: bash
        run: |
          mkdir -p proof
          Xvfb :99 -screen 0 900x1000x24 -nolisten tcp >proof/xvfb.log 2>&1 &
          echo $! > proof/xvfb.pid
          sleep 2

          "$EMU" --disable-sound --nojoy=1 \
            runtime/Pokemon_Mercury_DS_Move_Learner.nds \
            >proof/desmume.log 2>&1 &
          echo $! > proof/desmume.pid

          for i in $(seq 1 30); do
            WIN="$(xdotool search --name 'DeSmuME' 2>/dev/null | head -n1 || true)"
            if [ -n "$WIN" ]; then
              echo "$WIN" > proof/window.id
              break
            fi
            sleep 1
          done

          test -s proof/window.id
          WIN="$(cat proof/window.id)"
          xdotool windowactivate --sync "$WIN" || true
          # Let Platinum's full startup/title animation settle before sending input.
          sleep 40
          import -window "$WIN" proof/00-title-ready.png

      - name: Navigate to universal Move Learner
        shell: bash
        run: |
          WIN="$(cat proof/window.id)"

          press() {
            xdotool windowactivate "$WIN" || true
            xdotool key --window "$WIN" "$1"
            sleep "${2:-1}"
          }

          # Debian DeSmuME GTK defaults: Start=Return, DS A=Z, DS B=X, DS X=S.
          # Platinum's title screen requires START, not A.
          press Return 3
          import -window "$WIN" proof/01-continue-menu.png

          # Select CONTINUE and wait for the save to enter the overworld.
          press z 12
          import -window "$WIN" proof/02-overworld.png

          # Open field menu with DS X.
          press s 2
          import -window "$WIN" proof/03-field-menu.png

          # Pokemon is one slot below Pokedex in the normal field menu.
          press Down 1
          press z 3
          import -window "$WIN" proof/04-party-menu.png

          # Select first party member.
          press z 2
          import -window "$WIN" proof/05-party-context.png

          # Mercury inserts MOVE LEARNER directly into this context menu.
          press Down 1
          press z 4
          import -window "$WIN" proof/06-move-learner.png

          identify proof/*.png

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          if [ -s proof/desmume.pid ]; then
            kill "$(cat proof/desmume.pid)" 2>/dev/null || true
          fi
          if [ -s proof/xvfb.pid ]; then
            kill "$(cat proof/xvfb.pid)" 2>/dev/null || true
          fi
          tail -200 proof/desmume.log 2>/dev/null || true

      - name: Upload runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-move-learner-runtime-proof
          path: |
            proof/*.png
            proof/*.log
          if-no-files-found: warn
          retention-days: 30
