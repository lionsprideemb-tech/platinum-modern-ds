name: PHASE-A11E Route 201 West Exit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a11e-route201-west-exit.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A11D checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a11d-route201-west-side
          path: checkpoint
          run-id: 36024285238
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a11e-venv"
          . "$RUNNER_TEMP/phase-a11e-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Continue west past wandering breeder
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a11e-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a11d-route201-west-side.dst")
          out=Path("phase-a11e"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A11E stopped at {frame}")

          def hold(key, frames, settle=260):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(frames)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(900); cap("breeder-cleared-start")
          for i in range(1,7):
              hold(Keys.KEY_LEFT,48)
              cap(f"west-exit-{i:02d}")

          run(1000); cap("west-end-stable")
          saved=out/"phase-a11e-route201-west-exit.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a11e-meta.json").write_text(json.dumps({
              "gate":"PHASE_A11E_ROUTE_201_WEST_EXIT",
              "source_run":36024285238,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A11E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a11e-route201-west-exit
          path: phase-a11e/
          if-no-files-found: error
          retention-days: 30
