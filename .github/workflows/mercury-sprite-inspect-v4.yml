name: Inspect Mercury Sprite Archive Names V4
on:
  push:
    branches: [work/sprites-audit-20260930]
    paths: ['.github/workflows/mercury-sprite-inspect-v4.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sprites-audit-20260930
          fetch-depth: 0
          lfs: true
      - name: Extract and sample archive names
        run: |
          set -e
          rm -rf /tmp/mercury-sprites
          mkdir -p /tmp/mercury-sprites sprite-work/raw-batches/batch01
          unzip -q staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip -d /tmp/mercury-sprites
          find /tmp/mercury-sprites -type f | sort | head -n 400 | sed 's#^/tmp/mercury-sprites/##' > sprite-work/raw-batches/batch01/archive_sample_400.txt || true
          find /tmp/mercury-sprites -type d | sort | head -n 250 | sed 's#^/tmp/mercury-sprites/##' > sprite-work/raw-batches/batch01/archive_dirs_250.txt || true
      - name: Commit inspection
        run: |
          git config user.name "Mercury Sprite Batch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sprite-work/raw-batches/batch01/archive_sample_400.txt sprite-work/raw-batches/batch01/archive_dirs_250.txt
          git commit -m "Inspect sprite archive paths" || true
          git push origin HEAD:work/sprites-audit-20260930
