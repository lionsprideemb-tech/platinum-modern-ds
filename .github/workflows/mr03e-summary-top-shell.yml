name: MR03E Platinum Summary Top Shell
# Fast visual proof: one build, native Summary host, top screen only.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr03e-summary-top-shell
    paths:
      - ".github/workflows/mr03e-summary-top-shell.yml"
      - "tools/install_mr03e_summary_top_shell.py"
      - "tools/install_mr03_party_move_learner.py"
      - "tools/install_mr03_party_path_harness.py"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - "tools/generate_mercury_title.py"
      - "upstream/LOCK.json"

permissions:
  contents: read

concurrency:
  group: mr03e-summary-top-\${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  prove-native-top-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned Platinum only
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Python syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mr03_party_move_learner.py \
            tools/install_mr03e_summary_top_shell.py \
            tools/install_mr03_party_path_harness.py \
            tools/generate_mercury_title.py

      - name: Install party entry and native Summary top shell
        shell: bash
        run: |
          python3 tools/install_mr03_party_move_learner.py \
            vendor/pokeplatinum \
            --report mr03e-party-entry.json

          python3 tools/install_mr03e_summary_top_shell.py \
            vendor/pokeplatinum \
            --report mr03e-summary-top-shell.json

          test "$(jq -r '.status' mr03e-summary-top-shell.json)" = "PASS"
          grep -q 'SUMMARY_MODE_MERCURY_MOVE_LEARNER' \
            vendor/pokeplatinum/include/applications/pokemon_summary_screen/main.h
          grep -q 'sMercuryMoveLearnerTopPages' vendor/pokeplatinum/src/start_menu.c

      - name: Stage generated source before build
        shell: bash
        run: |
          mkdir -p mr03e-artifact
          cp mr03e-summary-top-shell.json mr03e-artifact/
          cp mr03e-party-entry.json mr03e-artifact/
          cp vendor/pokeplatinum/src/applications/pokemon_summary_screen/main.c \
            mr03e-artifact/pokemon_summary_screen.generated.c
          cp vendor/pokeplatinum/src/start_menu.c \
            mr03e-artifact/start_menu.generated.c

      - name: Install CI-only Garchomp field harness
        shell: bash
        run: |
          python3 tools/install_mr03_party_path_harness.py \
            vendor/pokeplatinum \
            --report mr03e-harness.json
          cp mr03e-harness.json mr03e-artifact/

      - name: Generate Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mr03e-venv"
          . "$RUNNER_TEMP/mr03e-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Install Metroskrew and configure
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure

      - name: Build one MR03E proof ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage proof ROM
        shell: bash
        run: |
          cp "$BUILD/pokeplatinum.us.nds" \
            mr03e-artifact/Pokemon_Mercury_MR03E_Summary_Top_Proof.nds
          sha256sum mr03e-artifact/Pokemon_Mercury_MR03E_Summary_Top_Proof.nds \
            > mr03e-artifact/SHA256SUMS.txt

      - name: Capture native top pages in DeSmuME
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr03e-venv/bin/activate"
          pip install py-desmume
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import Keys, keymask

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start MR03E proof ROM")

          frame = 0
          captures = []

          def cycle(count):
              global frame
              for _ in range(count):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"MR03E runtime stopped near frame {frame}")

          def press(key, hold=4, settle=100):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              cycle(hold)
              emu.input.keypad_rm_key(mask)
              cycle(settle)

          def snap(label):
              full = emu.screenshot().convert("RGB")
              if full.size != (256, 384):
                  raise SystemExit(f"unexpected DeSmuME screenshot size: {full.size}")
              top = full.crop((0, 0, 256, 192))
              path = out / f"mr03e-{len(captures):02d}-{label}-{frame:05d}.png"
              top.save(path)
              colors = top.getcolors(maxcolors=256 * 192)
              unique = len(colors) if colors is not None else 256 * 192
              captures.append({
                  "label": label,
                  "frame": frame,
                  "file": path.name,
                  "size": list(top.size),
                  "unique_colors": unique,
                  "blank_like": unique < 32,
              })

          try:
              cycle(3600)
              press(Keys.KEY_X, settle=120)
              press(Keys.KEY_A, settle=180)
              press(Keys.KEY_A, settle=120)
              press(Keys.KEY_DOWN, settle=60)
              press(Keys.KEY_A, settle=360)

              snap("move-native-battle-moves")

              press(Keys.KEY_LEFT, settle=120)
              snap("stats-native-skills")

              press(Keys.KEY_LEFT, settle=120)
              snap("ability-base-native-info")
          finally:
              emu.destroy()

          meta = {
              "gate": "MERCURY_MR03E_NATIVE_TOP_RUNTIME",
              "architecture": "Pokemon Platinum Summary Screen host",
              "path": "Start Menu -> POKEMON -> Garchomp -> MOVE LEARNER",
              "captures": captures,
          }
          (out / "mr03e-runtime-meta.json").write_text(json.dumps(meta, indent=2) + "\n")

          if len(captures) != 3:
              raise SystemExit("MR03E did not capture all native top pages")
          if any(row["blank_like"] for row in captures):
              raise SystemExit("MR03E contains a blank-like top-screen capture")
          PY

      - name: Stage top-screen proofs
        if: always()
        shell: bash
        run: |
          cp runtime-preview/*.png mr03e-artifact/ 2>/dev/null || true
          cp runtime-preview/mr03e-runtime-meta.json mr03e-artifact/ 2>/dev/null || true

      - name: Upload MR03E top-shell proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr03e-summary-top-shell
          path: mr03e-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercury MR03E — Platinum-native top shell"
            echo
            echo "- One proof build only"
            echo "- No MR03C custom top-window renderer"
            echo "- Native Platinum Summary BG/VRAM/palettes/fonts/sprites"
            echo "- Native Platinum 3D Pokemon renderer"
            echo "- Top-screen crops captured at exact 256x192"
            echo "- MOVE baseline: Battle Moves"
            echo "- STATS baseline: Skills"
            echo "- ABILITY baseline: Info (to be re-authored after visual approval)"
          } >> "$GITHUB_STEP_SUMMARY"
