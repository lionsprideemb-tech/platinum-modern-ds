name: MR05B Authored Encounters

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr05b-authored-encounters
    paths:
      - ".github/workflows/mr05b-authored-encounters.yml"
      - "tools/install_mercury_move_learner.py"
      - "tools/install_mr03_party_move_learner.py"
      - "tools/install_mr03e_summary_top_shell.py"
      - "tools/install_mr03f_summary_bottom_learner.py"
      - "tools/install_mr05a_hm_free_traversal.py"
      - "tools/install_mr05b_encounter_framework.py"
      - "tools/install_mr05b_authored_encounters.py"
      - "tools/build_mr05b_authored_encounter_overrides.py"
      - "tools/extend_mr05b_great_marsh_overrides.py"
      - "tools/extend_mr05b_special_areas.py"
      - "tools/extend_mr05b_iron_coronet.py"
      - "data/encounters/**"
      - "tools/install_mp05_ability_namespace.py"
      - "tools/install_pt04d_species_batch.py"
      - "tools/install_pt05a_compatible_learnsets.py"
      - "tools/install_pt05b_compatible_evolutions.py"
      - "tools/install_pt05c_move_id_width.py"
      - "tools/install_pt05c1_modern_moves.py"
      - "tools/audit_move_id_namespace.py"
      - "data/**"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - "tools/generate_mercury_title.py"
      - "upstream/LOCK.json"

permissions:
  contents: read

concurrency:
  group: mr05b-authored-encounters-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  prove-authored-encounters:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          test -s vendor/hg-engine/data/learnsets/learnsets.json

      - name: Apply sealed Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Python syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_pt04d_species_batch.py \
            tools/install_pt05a_compatible_learnsets.py \
            tools/install_pt05b_compatible_evolutions.py \
            tools/install_pt05c_move_id_width.py \
            tools/install_pt05c1_modern_moves.py \
            tools/install_mercury_move_learner.py \
            tools/install_mr03_party_move_learner.py \
            tools/install_mr03e_summary_top_shell.py \
            tools/install_mr03f_summary_bottom_learner.py \
            tools/install_mr05a_hm_free_traversal.py \
            tools/install_mr05b_encounter_framework.py \
            tools/install_mr05b_authored_encounters.py \
            tools/build_mr05b_authored_encounter_overrides.py \
            tools/extend_mr05b_great_marsh_overrides.py \
            tools/extend_mr05b_special_areas.py \
            tools/extend_mr05b_iron_coronet.py

      - name: Restore MP05 canonical ability architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr04-ability-namespace.json \
            --implemented-registry mr04-implemented-abilities.txt

          test "$(jq -r '.canonical_ability_count' mr04-ability-namespace.json)" = "311"
          test "$(jq -r '.save_storage.capacity' mr04-ability-namespace.json)" = "1023"

      - name: Build canonical 1025 species registry
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mr04-species-registry.json
          test "$(sed -n '1026p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_PECHARUNT"

      - name: Install modern species resources
        shell: bash
        run: |
          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --implemented-abilities mr04-implemented-abilities.txt \
              --gate "MR05A_${tag}_RESOURCE_INSTALL" \
              --report "mr04-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore 16-bit move namespace and modern learnsets
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr04-modern-moves.json \
            --implemented-registry mr04-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mr04-implemented-moves.txt \
            --report mr04-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mr04-evolutions.json

      - name: Install production Mercury Move Learner
        shell: bash
        run: |
          python3 tools/install_mercury_move_learner.py \
            vendor/pokeplatinum vendor/hg-engine \
            --implemented-moves mr04-implemented-moves.txt \
            --report mr04-move-learner.json

          test "$(jq -r '.status' mr04-move-learner.json)" = "PASS"
          test "$(jq -r '.species_count' mr04-move-learner.json)" = "1025"
          test "$(jq -r '.total_extra_move_entries > 0' mr04-move-learner.json)" = "true"

      - name: Install sealed MR03F player-facing Move Learner
        shell: bash
        run: |
          python3 tools/install_mr03_party_move_learner.py \
            vendor/pokeplatinum \
            --report mr04-party-entry.json

          python3 tools/install_mr03e_summary_top_shell.py \
            vendor/pokeplatinum \
            --report mr04-summary-top-shell.json

          python3 tools/install_mr03f_summary_bottom_learner.py \
            vendor/pokeplatinum \
            --report mr04-summary-bottom-learner.json

          test "$(jq -r '.status' mr04-summary-bottom-learner.json)" = "PASS"
          grep -q 'MercuryMoveLearner_Init' \
            vendor/pokeplatinum/src/applications/pokemon_summary_screen/main.c
          grep -q 'SUMMARY_MODE_MERCURY_MOVE_LEARNER_SELECT' \
            vendor/pokeplatinum/include/applications/pokemon_summary_screen/main.h
          grep -q 'Pokemon_ResetMoveSlot' vendor/pokeplatinum/src/start_menu.c

      - name: Install MR05A HM-free traversal foundation
        shell: bash
        run: |
          python3 tools/install_mr05a_hm_free_traversal.py \
            vendor/pokeplatinum \
            --report mr05a-hm-free-traversal.json

          test "$(jq -r '.status' mr05a-hm-free-traversal.json)" = "PASS"
          grep -q 'MoveReminderData_IsMoveCompatible' vendor/pokeplatinum/src/move_reminder_data.c
          grep -q 'ScrCmd_FindPartySlotCompatibleWithMove' vendor/pokeplatinum/src/scrcmd_party.c
          grep -q 'FindPartySlotCompatibleWithMove VAR_RESULT, MOVE_CUT' vendor/pokeplatinum/res/field/scripts/scripts_field_moves.s
          grep -q 'CheckBadgeAcquired BADGE_ID_FOREST' vendor/pokeplatinum/res/field/scripts/scripts_field_moves.s
          grep -q 'CheckBadgeAcquired BADGE_ID_COAL' vendor/pokeplatinum/res/field/scripts/scripts_field_moves.s
          grep -q 'CheckBadgeAcquired BADGE_ID_FEN' vendor/pokeplatinum/res/field/scripts/scripts_field_moves.s
          grep -q 'CheckBadgeAcquired BADGE_ID_MINE' vendor/pokeplatinum/res/field/scripts/scripts_field_moves.s
          grep -q 'CheckBadgeAcquired BADGE_ID_ICICLE' vendor/pokeplatinum/res/field/scripts/scripts_field_moves.s
          grep -q 'CheckBadgeAcquired BADGE_ID_BEACON' vendor/pokeplatinum/res/field/scripts/scripts_field_moves.s
          grep -q 'FindPartySlotWithMove VAR_RESULT, MOVE_STRENGTH' vendor/pokeplatinum/res/field/scripts/scripts_canalave_city.s

      - name: Build authored Mercury route and Honey Tree overrides
        shell: bash
        run: |
          python3 tools/build_mr05b_authored_encounter_overrides.py \
            vendor/pokeplatinum \
            data/encounters/mercury_authored_routes_201_230.json \
            mr05b-authored-overrides.json \
            --report mr05b-authored-port.json

          test "$(jq -r '.status' mr05b-authored-port.json)" = "PASS"
          test "$(jq -r '.route_segments_expected' mr05b-authored-port.json)" = "35"
          test "$(jq -r '.route_segments_ported' mr05b-authored-port.json)" = "35"
          test "$(jq -r '.honey_tree_updated' mr05b-authored-port.json)" = "true"
          test "$(jq -r '.honey_tree_burmy_present' mr05b-authored-port.json)" = "false"

      - name: Extend authored encounters with Great Marsh biomes
        shell: bash
        run: |
          python3 tools/extend_mr05b_great_marsh_overrides.py \
            vendor/pokeplatinum \
            mr05b-authored-overrides.json \
            data/encounters/legacy_sources/mercury_gba_authored_runtime.json \
            mr05b-authored-overrides-with-marsh.json \
            --report mr05b-great-marsh-port.json

          test "$(jq -r '.status' mr05b-great-marsh-port.json)" = "PASS"
          test "$(jq -r '.area_count' mr05b-great-marsh-port.json)" = "6"
          test "$(jq -r '.full_tod_table_count' mr05b-great-marsh-port.json)" = "24"
          test "$(jq -r '.full_tod_slot_count' mr05b-great-marsh-port.json)" = "288"
          test "$(jq -r '.daily_rng_gate' mr05b-great-marsh-port.json)" = "false"

      - name: Extend authored encounters with first cave and special-area batch
        shell: bash
        run: |
          python3 tools/extend_mr05b_special_areas.py \
            vendor/pokeplatinum \
            mr05b-authored-overrides-with-marsh.json \
            data/encounters/legacy_sources/sinnoh_missing_area_audit.json \
            mr05b-authored-overrides-with-specials.json \
            --report mr05b-special-areas-port.json

          test "$(jq -r '.status' mr05b-special-areas-port.json)" = "PASS"
          test "$(jq -r '.resource_count' mr05b-special-areas-port.json)" = "16"
          test "$(jq -r '.old_chateau_resource_count' mr05b-special-areas-port.json)" = "9"
          test "$(jq -r '.snowpoint_temple_floor_count' mr05b-special-areas-port.json)" = "6"
          test "$(jq -r '.full_tod_area_count_added' mr05b-special-areas-port.json)" = "15"
          test "$(jq -r '.full_tod_slot_count_added' mr05b-special-areas-port.json)" = "720"

      - name: Extend authored encounters with Iron Island and Mt. Coronet
        shell: bash
        run: |
          python3 tools/extend_mr05b_iron_coronet.py \
            vendor/pokeplatinum \
            mr05b-authored-overrides-with-specials.json \
            mr05b-authored-overrides-with-iron-coronet.json \
            --report mr05b-iron-coronet-port.json

          test "$(jq -r '.status' mr05b-iron-coronet-port.json)" = "PASS"
          test "$(jq -r '.resource_count' mr05b-iron-coronet-port.json)" = "19"
          test "$(jq -r '.iron_island_resource_count' mr05b-iron-coronet-port.json)" = "7"
          test "$(jq -r '.mt_coronet_resource_count' mr05b-iron-coronet-port.json)" = "12"
          test "$(jq -r '.full_tod_area_count_added' mr05b-iron-coronet-port.json)" = "18"
          test "$(jq -r '.full_tod_slot_count_added' mr05b-iron-coronet-port.json)" = "864"
          test "$(jq -r '.mt_coronet_feebas_regular_fishing' mr05b-iron-coronet-port.json)" = "true"
          test "$(jq -r '.mt_coronet_elusive_rod_metadata_preserved' mr05b-iron-coronet-port.json)" = "true"
          test "$(jq -r '.regi_ruins_random_encounters_added' mr05b-iron-coronet-port.json)" = "false"

      - name: Install MR05B authored encounter tables
        shell: bash
        run: |
          python3 tools/install_mr05b_encounter_framework.py \
            vendor/pokeplatinum \
            mr05b-authored-overrides-with-iron-coronet.json \
            --manifest mr05b-encounter-manifest.json \
            --report mr05b-encounter-framework.json

          test "$(jq -r '.status' mr05b-encounter-framework.json)" = "PASS"
          test "$(jq -r '.area_count' mr05b-encounter-framework.json)" = "185"
          test "$(jq -r '.changed_area_count' mr05b-encounter-framework.json)" -ge "77"
          test "$(jq -r '.baseline_preserved' mr05b-encounter-framework.json)" = "false"
          test "$(jq -r '.area_count' mr05b-encounter-manifest.json)" = "185"
          jq -e '.changed_areas | index("encounters_honey_tree") != null' mr05b-encounter-framework.json
          jq -e '.areas.encounters_honey_tree.common | index("SPECIES_BURMY") == null' mr05b-encounter-manifest.json
          jq -e '.areas.encounters_honey_tree.uncommon | index("SPECIES_BURMY") == null' mr05b-encounter-manifest.json
          jq -e '.areas.encounters_honey_tree.rare | index("SPECIES_BURMY") == null' mr05b-encounter-manifest.json

      - name: Enable full Mercury four-period encounter runtime
        shell: bash
        run: |
          python3 tools/install_mr05b_authored_encounters.py \
            vendor/pokeplatinum \
            --runtime-only \
            --report mr05b-authored-runtime.json

          test "$(jq -r '.status' mr05b-authored-runtime.json)" = "PASS"
          test "$(jq -r '.mode' mr05b-authored-runtime.json)" = "runtime-only"
          test "$(jq -r '.four_period_full_land_tables' mr05b-authored-runtime.json)" = "true"
          test "$(jq -r '.changed_area_count' mr05b-authored-runtime.json)" = "71"
          test "$(jq -r '.full_tod_slot_count' mr05b-authored-runtime.json)" = "3408"
          test "$(jq -r '.vanilla_special_replacements_bypassed_for_mercury_tables' mr05b-authored-runtime.json)" = "true"
          grep -q 'convert_mercury_tod' vendor/pokeplatinum/tools/jsoncnv/encounter.py
          grep -q 'WildEncounters_PopulateGrassEncounterTable' vendor/pokeplatinum/src/overlay006/wild_encounters.c
          grep -q 'mercuryTimedGrassMagic' vendor/pokeplatinum/include/overlay006/wild_encounters.h

      - name: Prove CI direct-launch harness is absent
        shell: bash
        run: |
          grep -q 'EnqueueApplication(FS_OVERLAY_ID(game_opening), &gOpeningCutsceneAppTemplate);' vendor/pokeplatinum/src/main.c
          if grep -q 'FieldSystem_OpenMoveReminderMenu(fieldSystem, learner)' vendor/pokeplatinum/src/field_map_change.c; then
            echo "CI Move Learner direct-launch hook leaked into player build" >&2
            exit 1
          fi
          if grep -q 'SPECIES_GARCHOMP' vendor/pokeplatinum/src/field_map_change.c; then
            echo "CI Garchomp injection leaked into player build" >&2
            exit 1
          fi

      - name: Generate Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mr04-venv"
          . "$RUNNER_TEMP/mr04-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum
          test -s vendor/pokeplatinum/res/graphics/title_screen/logo.png
          grep -q '"en_US": "PRESS START"' vendor/pokeplatinum/res/text/title_screen.json

      - name: Install Metroskrew
        working-directory: vendor/pokeplatinum
        shell: bash
        run: sudo make skrew

      - name: Configure Mercury DS
        working-directory: vendor/pokeplatinum
        shell: bash
        run: make configure

      - name: Build MR05B authored-encounter ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Capture MR05B authored encounter boot in DeSmuME
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr04-venv/bin/activate"
          pip install py-desmume
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start Mercury player ROM")

          captures = [14800, 15200, 15600, 16000]
          current = 0
          rows = []
          stopped_at = None
          try:
              for target in captures:
                  for _ in range(target-current):
                      emu.cycle(False)
                      current += 1
                      if not emu.is_running():
                          stopped_at = current
                          break
                  if stopped_at is not None:
                      break

                  image = emu.screenshot()
                  path = out / f"mercury-player-boot-{target}.png"
                  image.save(path)
                  rgb = image.convert("RGB")
                  colors = rgb.getcolors(maxcolors=256 * 384)
                  unique = len(colors) if colors is not None else 256 * 384
                  rows.append({
                      "frame": target,
                      "file": path.name,
                      "unique_colors": unique,
                      "blank_like": unique < 16,
                  })
          finally:
              emu.destroy()

          meta = {
              "gate": "MERCURY_MR05B_NORMAL_BOOT",
              "rom": rom.name,
              "normal_story_boot": True,
              "ci_move_learner_direct_launch": False,
              "expected_title_prompt": "PRESS START",
              "stopped_at": stopped_at,
              "captures": rows,
          }
          (out / "mr05b-normal-boot-meta.json").write_text(json.dumps(meta, indent=2) + "\n")

          if stopped_at is not None:
              raise SystemExit(f"Mercury player ROM stopped near frame {stopped_at}")
          if not any(not row["blank_like"] for row in rows):
              raise SystemExit("all Mercury normal-boot captures were blank")
          PY

      - name: Stage player ROM and proof
        if: always()
        shell: bash
        run: |
          mkdir -p mr05b-artifact
          if test -s "$BUILD/pokeplatinum.us.nds"; then
            cp "$BUILD/pokeplatinum.us.nds" mr05b-artifact/Pokemon_Mercury_MR05B_Authored_Encounters.nds
            sha256sum mr05b-artifact/Pokemon_Mercury_MR05B_Authored_Encounters.nds > mr05b-artifact/SHA256SUMS.txt
          fi
          cp mr04-move-learner.json mr05b-artifact/ 2>/dev/null || true
          cp mr04-modern-moves.json mr05b-artifact/ 2>/dev/null || true
          cp mr04-learnsets.json mr05b-artifact/ 2>/dev/null || true
          cp mr04-party-entry.json mr05b-artifact/ 2>/dev/null || true
          cp mr04-summary-top-shell.json mr05b-artifact/ 2>/dev/null || true
          cp mr04-summary-bottom-learner.json mr05b-artifact/ 2>/dev/null || true
          cp mr05a-hm-free-traversal.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-authored-port.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-authored-runtime.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-authored-overrides.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-authored-overrides-with-marsh.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-great-marsh-port.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-authored-overrides-with-specials.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-special-areas-port.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-authored-overrides-with-iron-coronet.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-iron-coronet-port.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-encounter-framework.json mr05b-artifact/ 2>/dev/null || true
          cp mr05b-encounter-manifest.json mr05b-artifact/ 2>/dev/null || true
          cp runtime-preview/*.png mr05b-artifact/ 2>/dev/null || true
          cp runtime-preview/mr05b-normal-boot-meta.json mr05b-artifact/ 2>/dev/null || true

      - name: Upload Mercury player build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr05b-authored-encounters
          path: mr05b-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercury MR05B — Authored Encounters"
            echo
            echo "- Full 1025-species modern foundation rebuilt"
            echo "- Sealed MR03F dual-screen Move Learner included"
            echo "- TOP remains vanilla Platinum Summary renderer"
            echo "- BOTTOM remains Mercury Move Learner browser"
            echo "- CI-only Garchomp/direct-launch harness excluded"
            echo "- Normal Platinum/Mercury story boot retained"
            echo "- Mercury title resources included"
            echo "- Full ROM compile required"
            echo "- Real DeSmuME normal-boot screenshots required"
            echo "- Sealed MR05A HM-free traversal retained"
            echo "- Routes 201-224 ported from recovered Mercury authored encounter source"
            echo "- Routes 201-230 authored across 35 route segments"
            echo "- Full 12-slot Morning/Day/Evening/Night runtime tables enabled for 32 land-capable routes plus all 6 Great Marsh biomes"
            echo "- Great Marsh daily RNG no longer gates encounter availability; binoculars remain informational"
            echo "- Ravaged Path water/fishing, all 9 Old Chateau encounter maps, and all 6 Snowpoint Temple floors authored"
            echo "- All 7 Iron Island encounter resources and 12 additional Mt. Coronet resources authored"
            echo "- Mt. Coronet B1F Feebas is available by normal fishing while special elusive-rod metadata remains preserved"
            echo "- Regi ruins remain reserved for the separate static/map-event pass"
            echo "- Honey Tree pools replaced with Mercury premium pool; Burmy removed"
            echo "- Encounter-framework ROM staged as Pokemon_Mercury_MR05B_Authored_Encounters.nds"
          } >> "$GITHUB_STEP_SUMMARY"
