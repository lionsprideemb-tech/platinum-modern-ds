              raise SystemExit("DeSmuME did not start MR07B2 editor QA ROM")

          current = 0
          captures = []

          def cycle(frames):
              global current
              for _ in range(frames):
                  emu.cycle(False)
                  current += 1
                  if not emu.is_running():
                      raise SystemExit(f"MR07B2 emulator stopped near frame {current}")

          def cycle_to(target):
              if target > current:
                  cycle(target-current)

          def press(key, hold=8, settle=24):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              cycle(hold)
              emu.input.keypad_rm_key(mask)
              cycle(settle)

          def capture(label):
              img = emu.screenshot().convert("RGB")
              path = out / f"{label}-{current}.png"
              img.save(path)
              top = img.crop((0, 0, 256, 192))
              bottom = img.crop((0, 192, 256, 384))
              tc = top.getcolors(maxcolors=256*192)
              bc = bottom.getcolors(maxcolors=256*192)
              captures.append({
                  "label": label,
                  "frame": current,
                  "file": path.name,
                  "top_unique_colors": len(tc) if tc is not None else 256*192,
                  "bottom_unique_colors": len(bc) if bc is not None else 256*192,
              })
              return img

          def diff_pixels(a, b, box):
              d = ImageChops.difference(a.crop(box), b.crop(box))
              return sum(1 for px in d.getdata() if px != (0, 0, 0))

          cycle_to(1050)
          normal = capture("skills-normal")

          # X -> primary Ability highlight, A -> actual bottom-screen selector.
          press(Keys.KEY_X)
          selected_ability = capture("skills-edit-ability-highlight")
          press(Keys.KEY_A)
          ability_editor = capture("ability-editor-guts")
          press(Keys.KEY_DOWN)
          ability_second = capture("ability-editor-no-guard")
          press(Keys.KEY_A)
          ability_committed = capture("ability-committed-radial-restored")

          # Primary Ability cursor remains selected. Down wraps to HP, A opens
          # the real EV editor. X MAX takes HP 0 -> 252 and total 258 -> 510.
          press(Keys.KEY_DOWN)
          hp_selected = capture("skills-edit-hp-highlight")
          press(Keys.KEY_A)
          ev_before = capture("ev-editor-hp-0-total-258")
          press(Keys.KEY_X)
          ev_after = capture("ev-editor-hp-252-total-510")
          press(Keys.KEY_B)
          ev_closed = capture("ev-committed-radial-restored")

          # HP -> Ability -> Nature. MR07C opens its real scrolling selector;
          # Down chooses the next Nature and A commits the persistent override.
          press(Keys.KEY_UP)
          press(Keys.KEY_UP)
          nature_selected = capture("skills-edit-nature-highlight")
          press(Keys.KEY_A)
          nature_editor = capture("nature-editor-current")
          press(Keys.KEY_DOWN)
          nature_next = capture("nature-editor-next")
          press(Keys.KEY_A)
          nature_committed = capture("nature-committed-radial-restored")

          top = (0, 0, 256, 192)
          bottom = (0, 192, 256, 384)

          diffs = {
              "normal_to_ability_highlight_top":
                  diff_pixels(normal, selected_ability, top),
              "radial_to_ability_editor_bottom":
                  diff_pixels(selected_ability, ability_editor, bottom),
              "ability_choice_change_bottom":
                  diff_pixels(ability_editor, ability_second, bottom),
              "ability_commit_top":
                  diff_pixels(selected_ability, ability_committed, top),
              "radial_to_ev_editor_bottom":
                  diff_pixels(hp_selected, ev_before, bottom),
              "ev_max_top":
                  diff_pixels(ev_before, ev_after, top),
              "ev_max_bottom":
                  diff_pixels(ev_before, ev_after, bottom),
              "ev_close_bottom":
                  diff_pixels(ev_after, ev_closed, bottom),
              "radial_to_nature_editor_bottom":
                  diff_pixels(nature_selected, nature_editor, bottom),
              "nature_choice_change_bottom":
                  diff_pixels(nature_editor, nature_next, bottom),
              "nature_commit_top":
                  diff_pixels(nature_selected, nature_committed, top),
              "nature_close_bottom":
                  diff_pixels(nature_next, nature_committed, bottom),
          }

          if diffs["radial_to_ability_editor_bottom"] < 2500:
              raise SystemExit(f"Ability editor did not visibly open: {diffs}")
          if diffs["ability_choice_change_bottom"] < 100:
              raise SystemExit(f"Ability selection did not visibly move: {diffs}")
          if diffs["ability_commit_top"] < 80:
              raise SystemExit(f"Ability commit did not visibly update top screen: {diffs}")
          if diffs["radial_to_ev_editor_bottom"] < 2500:
              raise SystemExit(f"EV editor did not visibly open: {diffs}")
          if diffs["ev_max_top"] < 50:
              raise SystemExit(f"EV MAX did not visibly recalculate top stats: {diffs}")
          if diffs["ev_max_bottom"] < 80:
              raise SystemExit(f"EV MAX did not visibly update EV totals: {diffs}")
          if diffs["ev_close_bottom"] < 2500:
              raise SystemExit(f"EV editor did not visibly restore radial screen: {diffs}")
          if diffs["radial_to_nature_editor_bottom"] < 2500:
              raise SystemExit(f"Nature editor did not visibly open: {diffs}")
          if diffs["nature_choice_change_bottom"] < 100:
              raise SystemExit(f"Nature selection did not visibly move: {diffs}")
          if diffs["nature_commit_top"] < 80:
              raise SystemExit(f"Nature commit did not visibly update top screen: {diffs}")
          if diffs["nature_close_bottom"] < 2500:
              raise SystemExit(f"Nature editor did not visibly restore radial screen: {diffs}")

          stable = [
              row for row in captures
              if row["top_unique_colors"] >= 24
              and row["bottom_unique_colors"] >= 8
          ]
          if len(stable) != len(captures):
              raise SystemExit(f"MR07B2 blank/unstable capture: {captures}")

          # Leave top edit-selection, close Summary, and let the CI-only field
          # harness assert HP EV 252 + Ability 2 + selected effective Nature,
          # while also proving the Pokemon personality/PID never changed.
          press(Keys.KEY_X)
          press(Keys.KEY_B)
          cycle(240)
          post_summary = capture("post-summary-commit-assertions")

          meta = {
              "gate": "MERCURY_MR07B2_SUMMARY_EDITOR_DESMUME_PROOF",
              "status": "PASS",
              "production_player_rom_staged_before_harness": True,
              "qa_only_harness": True,
              "pokemon": "Machamp Lv50",
              "ability_flow": "Ability 1 -> Ability 2",
              "ev_flow": "HP 0 / total 258 -> HP 252 / total 510",
              "nature_flow": "current effective Nature -> next Nature; PID unchanged",
              "screens": {
                  "top": "production Mercury Skills renderer with live stat/Ability updates",
                  "bottom_normal": "vanilla Platinum radial Summary navigator",
                  "bottom_edit": "temporary native EV/Ability/Nature editor",
              },
              "pixel_diffs": diffs,
              "captures": captures,
              "post_summary_assertion_frame": post_summary is not None,
              "visual_review_required": True,
          }
          (out / "mr07b2-summary-editor-runtime-meta.json").write_text(
              json.dumps(meta, indent=2) + "\n"
          )
          emu.destroy()
          PY

