      - name: Capture production Pokétch Radar area detail and SEARCH in DeSmuME
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr04-venv/bin/activate"
          pip install py-desmume
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import ImageChops
          from desmume.emulator import DeSmuME

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("poketch-radar-production-proof")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start MR06B2O production Poketch QA ROM")

          current = 0
          rows = []
          images = {}

          def cycle_to(target):
              global current
              for _ in range(target - current):
                  emu.cycle(False)
                  current += 1
                  if not emu.is_running():
                      raise SystemExit(f"MR06B2O emulator stopped near frame {current}")

          def capture(frame, label):
              cycle_to(frame)
              img = emu.screenshot().convert("RGB")
              path = out / f"{label}-{frame}.png"
              img.save(path)

              top = img.crop((0, 0, 256, 192))
              bottom = img.crop((0, 192, 256, 384))
              top_colors = top.getcolors(maxcolors=256 * 192)
              bottom_colors = bottom.getcolors(maxcolors=256 * 192)

              row = {
                  "frame": frame,
                  "label": label,
                  "file": path.name,
                  "top_unique_colors": len(top_colors) if top_colors is not None else 256 * 192,
                  "bottom_unique_colors": len(bottom_colors) if bottom_colors is not None else 256 * 192,
              }
              rows.append(row)
              images[label] = img
              return img

          def touch(x, y, hold=8):
              global current
              emu.input.touch_set_pos(x, y)
              for _ in range(hold):
                  emu.cycle(False)
                  current += 1
                  if not emu.is_running():
                      raise SystemExit(f"MR06B2O stopped while touching ({x},{y})")
              emu.input.touch_release()

          # Give native field + Poketch enough time to settle. These are the
          # actual production app screens; no Pokemon History substitution.
          area_a = capture(700, "production-area")
          area_b = capture(900, "production-area")

          # First 3x4 icon cell.
          cycle_to(980)
          touch(36, 52)
          detail_a = capture(1100, "production-detail")
          detail_b = capture(1250, "production-detail")

          area_detail_diff = ImageChops.difference(area_b, detail_b)
          area_detail_pixels = sum(
              1 for px in area_detail_diff.getdata()
              if px != (0, 0, 0)
          )
          if area_detail_pixels < 2500:
              raise SystemExit(
                  "MR06B2O touch did not visibly open the production detail page; "
                  f"pixel_diff={area_detail_pixels}"
              )

          # Wide SEARCH button on the production detail page.
          cycle_to(1320)
          touch(100, 150)

          post = []
          for frame in [1380, 1500, 1660, 1840, 2040]:
              img = capture(frame, "post-search")
              post.append(img)

          diffs = []
          for img in post:
              diff = ImageChops.difference(detail_b, img)
              diffs.append(sum(
                  1 for px in diff.getdata()
                  if px != (0, 0, 0)
              ))

          if max(diffs, default=0) < 5000:
              raise SystemExit(
                  "MR06B2O SEARCH did not visibly leave the detail page for "
                  f"the immediate battle path; pixel_diffs={diffs}"
              )

          stable_area = [
              row for row in rows
              if row["label"] == "production-area"
              and row["top_unique_colors"] >= 24
              and row["bottom_unique_colors"] >= 8
          ]
          stable_detail = [
              row for row in rows
              if row["label"] == "production-detail"
              and row["top_unique_colors"] >= 24
              and row["bottom_unique_colors"] >= 8
          ]
          if len(stable_area) < 2 or len(stable_detail) < 2:
              raise SystemExit(
                  "MR06B2O did not produce stable production Poketch frames: "
                  f"area={stable_area}, detail={stable_detail}"
              )

          meta = {
              "gate": "MERCURY_MR06B2O_PRODUCTION_POKETCH_RUNTIME_PROOF",
              "status": "PASS",
              "production_rom_was_staged_before_harness": True,
              "ci_only_harness": True,
              "proof_map": "Route 202",
              "screens": {
                  "top": "live Platinum overworld until normal battle transition",
                  "bottom": "actual MR06B2N Research Radar Poketch app",
              },
              "inputs": [
                  {"action": "touch first area icon", "x": 36, "y": 52},
                  {"action": "touch SEARCH", "x": 100, "y": 150},
              ],
              "area_to_detail_pixel_diff": area_detail_pixels,
              "detail_to_post_search_pixel_diffs": diffs,
              "captures": rows,
          }
          (out / "mr06b2o-production-poketch-runtime-meta.json").write_text(
              json.dumps(meta, indent=2) + "\n"
          )

          emu.destroy()
          PY

