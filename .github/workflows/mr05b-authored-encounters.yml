      - "tools/export_mr05m_encounter_charts.py"
      - "tools/install_mr05n_instant_honey_trees.py"
      - "tools/install_mr05o_exact_tod_periods.py"
      - "tools/install_mr06a_encounter_chart_runtime.py"
      - "tools/install_mr06b1_research_radar_foundation.py"
      - "tools/install_mr06b2a_dexnav_progression.py"
      - "tools/install_mr06b2b_radar_save_storage.py"
      - "tools/install_mr06b2c1_scanner_session_model.py"
      - "tools/install_mr06b2c2_dual_screen_scanner.py"
      - "tools/install_mr06b2c3_radar_item_target_patch.py"
      - "tools/install_mr06b2d_dexnav_quality_rolls.py"
      - "tools/install_mr06b2e_overworld_search_hud.py"
      - "tools/install_mr06b2f_radar_visual_polish.py"
      - "tools/install_mr06b2g_preleague_radar_access.py"
      - "tools/install_mr06b2h_runtime_proof_harness.py"
      - "tools/install_mr06b2i_radar_linker_placement.py"
      - "tools/install_mr06b2j_scanner_vram_cleanup.py"
      - "tools/install_mr06b2k_poketch_radar_shell.py"
      - "tools/install_mr06b2l_poketch_radar_detail.py"
      - "tools/install_mr06b2m_poketch_hunter_detail.py"
      - "tools/install_mr06b2n_production_poketch_radar.py"
      - "tools/install_mr06b2o_production_poketch_proof.py"
      - "tools/install_mr05f_sinnoh_legendary_statics.py"
      - "data/encounters/**"
      - "tools/install_mp05_ability_namespace.py"
      - "tools/install_pt04d_species_batch.py"
      - "tools/install_pt05a_compatible_learnsets.py"
      - "tools/install_pt05b_compatible_evolutions.py"
      - "tools/install_pt05c_move_id_width.py"
      - "tools/install_pt05c1_modern_moves.py"
      - "tools/audit_move_id_namespace.py"
      - "data/**"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - "tools/generate_mercury_title.py"
      - "upstream/LOCK.json"

permissions:
  contents: read

concurrency:
  group: mr05b-authored-encounters-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  prove-authored-encounters:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          test -s vendor/hg-engine/data/learnsets/learnsets.json

      - name: Apply sealed Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Python syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_pt04d_species_batch.py \
            tools/install_pt05a_compatible_learnsets.py \
            tools/install_pt05b_compatible_evolutions.py \
            tools/install_pt05c_move_id_width.py \
            tools/install_pt05c1_modern_moves.py \
            tools/install_mercury_move_learner.py \
            tools/install_mr03_party_move_learner.py \
            tools/install_mr03e_summary_top_shell.py \
            tools/install_mr03f_summary_bottom_learner.py \
            tools/install_mr07a_summary_skills.py \
            tools/install_mr07b1_summary_training_editors.py \
            tools/install_mr07c_nature_editor.py \
            tools/install_mr07d_summary_visual_polish.py \
            tools/install_mr07d2_summary_selection_polish.py \
            tools/install_mr07d3_vanilla_skills_palette.py \
            tools/install_mr07d4_summary_typography_polish.py \
            tools/install_mr07d5_summary_editor_color_polish.py \
            tools/install_mr08a_canonical_ability_batch.py \
            tools/install_mr08b_unchanged_ability_fastpass.py \
            tools/install_mr08c_unchanged_ability_interactions.py \
            tools/install_mr08d_unchanged_ability_shared_hooks.py \
            tools/install_mr08e_unchanged_ability_stat_damage.py \
            tools/install_mr07a_summary_skills_proof.py \
            tools/install_mr07b2_summary_editor_proof.py \
            tools/install_mr05a_hm_free_traversal.py \
            tools/install_mr05b_encounter_framework.py \
            tools/install_mr05b_authored_encounters.py \
            tools/build_mr05b_authored_encounter_overrides.py \
            tools/extend_mr05b_great_marsh_overrides.py \
            tools/extend_mr05b_special_areas.py \
            tools/extend_mr05b_iron_coronet.py \
            tools/install_mr05c_regi_preleague.py \
            tools/extend_mr05d_victory_road.py \
            tools/extend_mr05e_turnback_sendoff.py \
            tools/extend_mr05g_preleague_core_areas.py \
            tools/extend_mr05h_lost_tower_trophy_garden.py \
            tools/extend_mr05i_solaceon_ruins.py \
            tools/extend_mr05j_identified_maps.py \
            tools/extend_mr05k_final_identified.py \
            tools/audit_mr05l_unknown_encounter_resources.py \
            tools/export_mr05m_encounter_charts.py \
            tools/install_mr05n_instant_honey_trees.py \
            tools/install_mr05o_exact_tod_periods.py \
            tools/install_mr06a_encounter_chart_runtime.py \
            tools/install_mr06b2h_runtime_proof_harness.py \
            tools/install_mr06b2i_radar_linker_placement.py \
            tools/install_mr06b2j_scanner_vram_cleanup.py \
            tools/install_mr06b2k_poketch_radar_shell.py \
            tools/install_mr06b2l_poketch_radar_detail.py \
            tools/install_mr06b2m_poketch_hunter_detail.py \
            tools/install_mr06b2n_production_poketch_radar.py \
            tools/install_mr06b2o_production_poketch_proof.py \
            tools/install_mr05f_sinnoh_legendary_statics.py

      - name: Restore MP05 canonical ability architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr04-ability-namespace.json \
            --implemented-registry mr04-implemented-abilities.txt

          test "$(jq -r '.canonical_ability_count' mr04-ability-namespace.json)" = "311"
          test "$(jq -r '.save_storage.capacity' mr04-ability-namespace.json)" = "1023"

      - name: Install MR08A canonical ability mechanics batch 1
        shell: bash
        run: |
          python3 tools/install_mr08a_canonical_ability_batch.py \
            vendor/pokeplatinum \
            --implemented-registry mr04-implemented-abilities.txt \
            --report mr08a-canonical-ability-batch.json

          test "$(jq -r '.status' mr08a-canonical-ability-batch.json)" = "PASS"
          test "$(jq -r '.checks.contrary_hook' mr08a-canonical-ability-batch.json)" = "true"
          test "$(jq -r '.checks.big_pecks_hook' mr08a-canonical-ability-batch.json)" = "true"
          test "$(jq -r '.checks.full_metal_body_hook' mr08a-canonical-ability-batch.json)" = "true"
          test "$(jq -r '.checks.battle_ability_return_u16' mr08a-canonical-ability-batch.json)" = "true"
          test "$(jq -r '.checks.battlemon_set_u16' mr08a-canonical-ability-batch.json)" = "true"
          test "$(jq -r '.checks.ai_ability_cache_u16' mr08a-canonical-ability-batch.json)" = "true"
          test "$(jq -r '.ui_changed' mr08a-canonical-ability-batch.json)" = "false"
          grep -qx 'ABILITY_CONTRARY' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_BIG_PECKS' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_FULL_METAL_BODY' mr04-implemented-abilities.txt

      - name: Install MR08B unchanged canonical Ability fast pass
        shell: bash
        run: |
          python3 tools/install_mr08b_unchanged_ability_fastpass.py \
            vendor/pokeplatinum \
            --implemented-registry mr04-implemented-abilities.txt \
            --report mr08b-unchanged-ability-fastpass.json

          test "$(jq -r '.status' mr08b-unchanged-ability-fastpass.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr08b-unchanged-ability-fastpass.json)" = "12"
          test "$(jq -r '.checks.water_bubble_burn_hook' mr08b-unchanged-ability-fastpass.json)" = "true"
          test "$(jq -r '.checks.gale_wings_hook' mr08b-unchanged-ability-fastpass.json)" = "true"
          test "$(jq -r '.checks.neuroforce_hook' mr08b-unchanged-ability-fastpass.json)" = "true"
          test "$(jq -r '.checks.power_spot_hook' mr08b-unchanged-ability-fastpass.json)" = "true"
          test "$(jq -r '.ui_changed' mr08b-unchanged-ability-fastpass.json)" = "false"

      - name: Install MR08C unchanged canonical Ability interactions
        shell: bash
        run: |
          python3 tools/install_mr08c_unchanged_ability_interactions.py \
            vendor/pokeplatinum \
            --implemented-registry mr04-implemented-abilities.txt \
            --report mr08c-unchanged-ability-interactions.json

          test "$(jq -r '.status' mr08c-unchanged-ability-interactions.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr08c-unchanged-ability-interactions.json)" = "10"
          test "$(jq -r '.running_modern_mechanics_total' mr08c-unchanged-ability-interactions.json)" = "25"
          test "$(jq -r '.checks.moxie_hook' mr08c-unchanged-ability-interactions.json)" = "true"
          test "$(jq -r '.checks.prankster_priority' mr08c-unchanged-ability-interactions.json)" = "true"
          test "$(jq -r '.checks.gorilla_tactics_hook' mr08c-unchanged-ability-interactions.json)" = "true"
          test "$(jq -r '.checks.screen_cleaner_hook' mr08c-unchanged-ability-interactions.json)" = "true"
          test "$(jq -r '.ui_changed' mr08c-unchanged-ability-interactions.json)" = "false"
          grep -qx 'ABILITY_HEALER' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_TELEPATHY' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_REGENERATOR' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_MOXIE' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_JUSTIFIED' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_PRANKSTER' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_GOOEY' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_BERSERK' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_GORILLA_TACTICS' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_SCREEN_CLEANER' mr04-implemented-abilities.txt

      - name: Install MR08D unchanged canonical Ability shared hooks
        shell: bash
        run: |
          python3 tools/install_mr08d_unchanged_ability_shared_hooks.py \
            vendor/pokeplatinum \
            --implemented-registry mr04-implemented-abilities.txt \
            --report mr08d-unchanged-ability-shared-hooks.json

          test "$(jq -r '.status' mr08d-unchanged-ability-shared-hooks.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr08d-unchanged-ability-shared-hooks.json)" = "10"
          test "$(jq -r '.running_modern_mechanics_total' mr08d-unchanged-ability-shared-hooks.json)" = "35"
          test "$(jq -r '.checks.iron_barbs_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.wonder_skin_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.analytic_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.bulletproof_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.queenly_majesty_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.battery_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.dazzling_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.tangling_hair_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.shadow_shield_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.prism_armor_hook' mr08d-unchanged-ability-shared-hooks.json)" = "true"
          test "$(jq -r '.ui_changed' mr08d-unchanged-ability-shared-hooks.json)" = "false"

      - name: Install MR08E unchanged canonical Ability stat/damage family
        shell: bash
        run: |
          python3 tools/install_mr08e_unchanged_ability_stat_damage.py \
            vendor/pokeplatinum \
            --implemented-registry mr04-implemented-abilities.txt \
            --report mr08e-unchanged-ability-stat-damage.json

          test "$(jq -r '.status' mr08e-unchanged-ability-stat-damage.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr08e-unchanged-ability-stat-damage.json)" = "10"
          test "$(jq -r '.running_modern_mechanics_total' mr08e-unchanged-ability-stat-damage.json)" = "45"
          test "$(jq -r '.checks.friend_guard_hook' mr08e-unchanged-ability-stat-damage.json)" = "true"
          test "$(jq -r '.checks.sand_rush_hook' mr08e-unchanged-ability-stat-damage.json)" = "true"
          test "$(jq -r '.checks.merciless_hook' mr08e-unchanged-ability-stat-damage.json)" = "true"
          test "$(jq -r '.checks.steely_spirit_hook' mr08e-unchanged-ability-stat-damage.json)" = "true"
          test "$(jq -r '.ui_changed' mr08e-unchanged-ability-stat-damage.json)" = "false"
          grep -qx 'ABILITY_DEFEATIST' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_FRIEND_GUARD' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_FLARE_BOOST' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_TOXIC_BOOST' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_SAND_RUSH' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_STAMINA' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_WATER_COMPACTION' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_MERCILESS' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_STEELWORKER' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_STEELY_SPIRIT' mr04-implemented-abilities.txt

      - name: Install MR08F unchanged canonical Ability priority/reaction family
        shell: bash
        run: |
          python3 tools/install_mr08f_unchanged_ability_priority_reactions.py \
            vendor/pokeplatinum \
            --implemented-registry mr04-implemented-abilities.txt \
            --report mr08f-unchanged-ability-priority-reactions.json

          test "$(jq -r '.status' mr08f-unchanged-ability-priority-reactions.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr08f-unchanged-ability-priority-reactions.json)" = "10"
          test "$(jq -r '.running_modern_mechanics_total' mr08f-unchanged-ability-priority-reactions.json)" = "55"
          test "$(jq -r '.checks.strong_jaw_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.sweet_veil_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.steam_engine_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.punk_rock_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.sand_spit_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.perish_body_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.pastel_veil_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.quick_draw_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.chilling_neigh_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.grim_neigh_hook' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.checks.water_bubble_burn_fix' mr08f-unchanged-ability-priority-reactions.json)" = "true"
          test "$(jq -r '.ui_changed' mr08f-unchanged-ability-priority-reactions.json)" = "false"
          grep -qx 'ABILITY_STRONG_JAW' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_SWEET_VEIL' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_STEAM_ENGINE' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_PUNK_ROCK' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_SAND_SPIT' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_PERISH_BODY' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_PASTEL_VEIL' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_QUICK_DRAW' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_CHILLING_NEIGH' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_GRIM_NEIGH' mr04-implemented-abilities.txt

      - name: Install MR08G canonical Ability late shared hooks
        shell: bash
        run: |
          python3 tools/install_mr08g_canonical_ability_late_shared_hooks.py \
            vendor/pokeplatinum \
            --implemented-registry mr04-implemented-abilities.txt \
            --report mr08g-canonical-ability-late-shared-hooks.json

          test "$(jq -r '.status' mr08g-canonical-ability-late-shared-hooks.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr08g-canonical-ability-late-shared-hooks.json)" = "10"
          test "$(jq -r '.running_modern_mechanics_total' mr08g-canonical-ability-late-shared-hooks.json)" = "65"
          test "$(jq -r '.checks.beast_boost_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.thermal_exchange_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.purifying_salt_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.well_baked_body_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.guard_dog_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.rocky_payload_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.good_as_gold_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.sharpness_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.armor_tail_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.checks.earth_eater_hook' mr08g-canonical-ability-late-shared-hooks.json)" = "true"
          test "$(jq -r '.ui_changed' mr08g-canonical-ability-late-shared-hooks.json)" = "false"
          grep -qx 'ABILITY_BEAST_BOOST' mr04-implemented-abilities.txt
          grep -qx 'ABILITY_THERMAL_EXCHANGE' mr04-implemented-abilities.txt
