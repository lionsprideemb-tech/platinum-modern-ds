name: PB02AM Route 201 Rowan Starter Scene

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02am-route201-rowan-starter-scene.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and Route 201 checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10804840065/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/route201-arrival-probe.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02am-venv"
          . "$RUNNER_TEMP/pb02am-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Trigger and play Rowan opening sequence
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02am-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/route201-arrival-probe.dst")
          out=Path("pb02am-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AM stopped at {frame}")

          def pulse(key, held=12, settle=650):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          cap("route201-checkpoint")

          # Barry is visibly a few tiles north of the checkpoint.
          for i in range(1,6):
              pulse(Keys.KEY_UP,12,450)
              cap(f"approach-barry-{i:02d}")

          # Play through the native Rowan sequence. Default YES is accepted at
          # both yes/no prompts by the same A input stream.
          for i in range(1,41):
              pulse(Keys.KEY_A,12,650)
              if i in (1,3,5,8,12,16,20,24,28,32,36,40):
                  cap(f"rowan-a-{i:02d}")

          run(2200); cap("rowan-sequence-stable")

          saved=out/"route201-rowan-sequence.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02am-meta.json").write_text(json.dumps({
              "gate":"PB02AM_ROUTE201_ROWAN_STARTER_SCENE",
              "source_artifact":10804840065,
              "approach":"UP x5",
              "a_presses":40,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"interact with briefcase / certify starter selection"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AM proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02am-route201-rowan-starter-proof
          path: pb02am-play/
          if-no-files-found: error
          retention-days: 14
