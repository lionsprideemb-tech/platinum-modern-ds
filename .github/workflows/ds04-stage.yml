name: DS04 Twinleaf Stage

on:
  push:
    branches:
      - feature/ds04-twinleaf-transplant
    paths:
      - "tools/narc_append.py"
      - "tools/stage_ds04_twinleaf.py"
      - "tools/convert_platinum_landdata.py"
      - "tools/convert_platinum_areadata.py"
      - "tools/build_hgss_prop_set.py"
      - "tests/**"
      - "platinum_port/twinleaf/**"
      - "upstream/LOCK.json"
      - ".github/workflows/ds04-stage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned sources
        shell: bash
        run: |
          set -euo pipefail
          hg_commit="$(jq -r '.sources["pokeheartgold"].commit' upstream/LOCK.json)"
          pt_commit="$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none https://github.com/pret/pokeheartgold.git vendor/pokeheartgold
          git -C vendor/pokeheartgold checkout "$hg_commit"

          git clone --filter=blob:none https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$pt_commit"

      - name: Run DS04 converter regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_narc_append.py
          python3 tests/test_landdata_converter.py
          python3 tests/test_areadata_converter.py

      - name: Stage Twinleaf into clean HeartGold source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_ds04_twinleaf.py             --pokeheartgold vendor/pokeheartgold             --pokeplatinum vendor/pokeplatinum             --test-start             --report /tmp/ds04_stage_report.json
          cat /tmp/ds04_stage_report.json

      - name: Verify staged source tree
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .strategy == "APPEND_ONLY" and
            .archives.land_data.members == 682 and
            .archives.area_data.members == 108 and
            .archives.prop_sets.members == 106 and
            .archives.map_textures.members == 108 and
            .archives.prop_textures.members == 106 and
            .archives.exterior_models.members == 344 and
            .archives.interior_models.members == 244 and
            .matrices == [288,289,290,291,292,293] and
            .map_headers == [540,541,542,543,544,545,546] and
            .scripts == [965,966] and
            .test_start == true and
            .test_start_map == 544 and
            .test_start_x == 4 and
            .test_start_y == 6 and
            .test_start_direction == 0
          ' /tmp/ds04_stage_report.json >/dev/null

          grep -q '^#define MAP_SINNOH_TWINLEAF_PLAYER_HOUSE_2F'             vendor/pokeheartgold/include/constants/maps.h
          grep -q '^#define MAP_ID_MAX[[:space:]]*547'             vendor/pokeheartgold/include/constants/maps.h
          grep -q 'MAP_SINNOH_TWINLEAF_PLAYER_HOUSE_2F'             vendor/pokeheartgold/src/location_backup.c
          grep -q '\.x = 4,' vendor/pokeheartgold/src/location_backup.c
          grep -q '\.y = 6,' vendor/pokeheartgold/src/location_backup.c
          grep -q '\.direction = 0,' vendor/pokeheartgold/src/location_backup.c

          test -f vendor/pokeheartgold/files/fielddata/mapmatrix/map_matrix/map_matrix_0293_SINNOH_TWINLEAF_PLAYER_2F.bin
          test -f vendor/pokeheartgold/files/fielddata/script/scr_seq/scr_seq_0965_SINNOH_TWINLEAF_EMPTY.s
          test -f vendor/pokeheartgold/files/fielddata/script/scr_seq/scr_seq_0966_SINNOH_TWINLEAF_EMPTY_hdr.s

          test "$(grep -c '^    \[MAP_SINNOH_TWINLEAF' vendor/pokeheartgold/src/data/map_headers.h)" = "7"

          echo "DS04 staged Twinleaf source tree: PASS"

      - name: Show source delta
        shell: bash
        run: |
          git -C vendor/pokeheartgold status --short
          git -C vendor/pokeheartgold diff --stat


  runtime-safe-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned sources
        shell: bash
        run: |
          set -euo pipefail
          hg_commit="$(jq -r '.sources["pokeheartgold"].commit' upstream/LOCK.json)"
          pt_commit="$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none https://github.com/pret/pokeheartgold.git vendor/pokeheartgold-runtime
          git -C vendor/pokeheartgold-runtime checkout "$hg_commit"

          git clone --filter=blob:none https://github.com/pret/pokeplatinum.git vendor/pokeplatinum-runtime
          git -C vendor/pokeplatinum-runtime checkout "$pt_commit"

      - name: Stage runtime-safe Twinleaf room
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_ds04_twinleaf.py             --pokeheartgold vendor/pokeheartgold-runtime             --pokeplatinum vendor/pokeplatinum-runtime             --runtime-compat-slot             --test-start             --report /tmp/ds04_runtime_safe_stage.json

          jq -e '
            .runtime_compat_slot == true and
            .map_headers == [538] and
            .test_start_map == 538 and
            .test_start_x == 4 and
            .test_start_y == 6 and
            .test_start_direction == 0 and
            .archives.land_data.members == 682 and
            .archives.area_data.members == 108 and
            .archives.prop_sets.members == 106 and
            .archives.map_textures.members == 108 and
            .archives.prop_textures.members == 106 and
            .archives.exterior_models.members == 344 and
            .archives.interior_models.members == 244
          ' /tmp/ds04_runtime_safe_stage.json >/dev/null

          grep -q '^#define MAP_ID_MAX[[:space:]]*540'             vendor/pokeheartgold-runtime/include/constants/maps.h
          if grep -q '^#define MAP_SINNOH_TWINLEAF_'             vendor/pokeheartgold-runtime/include/constants/maps.h; then
            echo "runtime-safe staging unexpectedly expanded map constants" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          headers = Path("vendor/pokeheartgold-runtime/src/data/map_headers.h").read_text()
          pos = headers.index("[MAP_UNUSED]")
          block = headers[pos:pos + 1800]
          assert ".areaDataBank = 107" in block
          assert "NARC_map_matrix_map_matrix_0293_SINNOH_TWINLEAF_PLAYER_2F_bin" in block

          loc = Path("vendor/pokeheartgold-runtime/src/location_backup.c").read_text()
          assert ".mapId = MAP_UNUSED," in loc
          assert ".x = 4," in loc
          assert ".y = 6," in loc
          assert ".direction = 0," in loc
          print("DS04 runtime-safe staging: PASS")
          PY
