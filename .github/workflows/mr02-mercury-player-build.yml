name: MR02 Mercury Player Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-player-build
    paths:
      - ".github/workflows/mr02-mercury-player-build.yml"
      - "tools/install_mercury_move_learner.py"
      - "tools/install_mp05_ability_namespace.py"
      - "tools/install_pt04d_species_batch.py"
      - "tools/install_pt05a_compatible_learnsets.py"
      - "tools/install_pt05b_compatible_evolutions.py"
      - "tools/install_pt05c_move_id_width.py"
      - "tools/install_pt05c1_modern_moves.py"
      - "tools/audit_move_id_namespace.py"
      - "data/**"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - "tools/generate_mercury_title.py"
      - "upstream/LOCK.json"

permissions:
  contents: read

concurrency:
  group: mr02-player-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  build-normal-boot-rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          test -s vendor/hg-engine/data/learnsets/learnsets.json

      - name: Apply sealed Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Python syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_pt04d_species_batch.py \
            tools/install_pt05a_compatible_learnsets.py \
            tools/install_pt05b_compatible_evolutions.py \
            tools/install_pt05c_move_id_width.py \
            tools/install_pt05c1_modern_moves.py \
            tools/install_mercury_move_learner.py

      - name: Restore MP05 canonical ability architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr02-ability-namespace.json \
            --implemented-registry mr02-implemented-abilities.txt

          test "$(jq -r '.canonical_ability_count' mr02-ability-namespace.json)" = "311"
          test "$(jq -r '.save_storage.capacity' mr02-ability-namespace.json)" = "1023"

      - name: Build canonical 1025 species registry
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mr02-species-registry.json
          test "$(sed -n '1026p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_PECHARUNT"

      - name: Install modern species resources
        shell: bash
        run: |
          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --implemented-abilities mr02-implemented-abilities.txt \
              --gate "MR02_${tag}_RESOURCE_INSTALL" \
              --report "mr02-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore 16-bit move namespace and modern learnsets
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr02-modern-moves.json \
            --implemented-registry mr02-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mr02-implemented-moves.txt \
            --report mr02-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mr02-evolutions.json

      - name: Install production Mercury Move Learner
        shell: bash
        run: |
          python3 tools/install_mercury_move_learner.py \
            vendor/pokeplatinum vendor/hg-engine \
            --implemented-moves mr02-implemented-moves.txt \
            --report mr02-move-learner.json

          test "$(jq -r '.status' mr02-move-learner.json)" = "PASS"
          test "$(jq -r '.species_count' mr02-move-learner.json)" = "1025"
          test "$(jq -r '.total_extra_move_entries > 0' mr02-move-learner.json)" = "true"

      - name: Prove CI direct-launch harness is absent
        shell: bash
        run: |
          grep -q 'EnqueueApplication(FS_OVERLAY_ID(game_opening), &gOpeningCutsceneAppTemplate);' vendor/pokeplatinum/src/main.c
          if grep -q 'FieldSystem_OpenMoveReminderMenu(fieldSystem, learner)' vendor/pokeplatinum/src/field_map_change.c; then
            echo "CI Move Learner direct-launch hook leaked into player build" >&2
            exit 1
          fi
          if grep -q 'SPECIES_GARCHOMP' vendor/pokeplatinum/src/field_map_change.c; then
            echo "CI Garchomp injection leaked into player build" >&2
            exit 1
          fi

      - name: Generate Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mr02-venv"
          . "$RUNNER_TEMP/mr02-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum
          test -s vendor/pokeplatinum/res/graphics/title_screen/logo.png
          grep -q '"en_US": "PRESS START"' vendor/pokeplatinum/res/text/title_screen.json

      - name: Install Metroskrew
        working-directory: vendor/pokeplatinum
        shell: bash
        run: sudo make skrew

      - name: Configure Mercury DS
        working-directory: vendor/pokeplatinum
        shell: bash
        run: make configure

      - name: Build normal-boot Mercury ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Capture real normal boot in DeSmuME
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr02-venv/bin/activate"
          pip install py-desmume
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start Mercury player ROM")

          captures = [14800, 15200, 15600, 16000]
          current = 0
          rows = []
          stopped_at = None
          try:
              for target in captures:
                  for _ in range(target-current):
                      emu.cycle(False)
                      current += 1
                      if not emu.is_running():
                          stopped_at = current
                          break
                  if stopped_at is not None:
                      break

                  image = emu.screenshot()
                  path = out / f"mercury-player-boot-{target}.png"
                  image.save(path)
                  rgb = image.convert("RGB")
                  colors = rgb.getcolors(maxcolors=256 * 384)
                  unique = len(colors) if colors is not None else 256 * 384
                  rows.append({
                      "frame": target,
                      "file": path.name,
                      "unique_colors": unique,
                      "blank_like": unique < 16,
                  })
          finally:
              emu.destroy()

          meta = {
              "gate": "MERCURY_MR02_NORMAL_BOOT",
              "rom": rom.name,
              "normal_story_boot": True,
              "ci_move_learner_direct_launch": False,
              "expected_title_prompt": "PRESS START",
              "stopped_at": stopped_at,
              "captures": rows,
          }
          (out / "mr02-normal-boot-meta.json").write_text(json.dumps(meta, indent=2) + "\n")

          if stopped_at is not None:
              raise SystemExit(f"Mercury player ROM stopped near frame {stopped_at}")
          if not any(not row["blank_like"] for row in rows):
              raise SystemExit("all Mercury normal-boot captures were blank")
          PY

      - name: Stage player ROM and proof
        if: always()
        shell: bash
        run: |
          mkdir -p mr02-artifact
          if test -s "$BUILD/pokeplatinum.us.nds"; then
            cp "$BUILD/pokeplatinum.us.nds" mr02-artifact/Pokemon_Mercury_Player_Build.nds
            sha256sum mr02-artifact/Pokemon_Mercury_Player_Build.nds > mr02-artifact/SHA256SUMS.txt
          fi
          cp mr02-move-learner.json mr02-artifact/ 2>/dev/null || true
          cp mr02-modern-moves.json mr02-artifact/ 2>/dev/null || true
          cp mr02-learnsets.json mr02-artifact/ 2>/dev/null || true
          cp runtime-preview/*.png mr02-artifact/ 2>/dev/null || true
          cp runtime-preview/mr02-normal-boot-meta.json mr02-artifact/ 2>/dev/null || true

      - name: Upload Mercury player build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr02-player-build
          path: mr02-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercury MR02 — Player Build"
            echo
            echo "- Full 1025-species modern foundation rebuilt"
            echo "- Universal DS Move Learner included"
            echo "- CI-only direct-launch harness excluded"
            echo "- Normal Platinum/Mercury story boot retained"
            echo "- Mercury title resources included"
            echo "- Full ROM compile required"
            echo "- Real DeSmuME normal-boot screenshots required"
            echo "- Player-ready ROM staged as Pokemon_Mercury_Player_Build.nds"
          } >> "$GITHUB_STEP_SUMMARY"
