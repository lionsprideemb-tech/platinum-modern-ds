name: PB02T Map-Aware Route To Barry House

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02t-map-aware-barry-house.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Twinleaf checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10789223904/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/twinleaf-exterior.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02t-venv"
          . "$RUNNER_TEMP/pb02t-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Follow native Twinleaf event coordinates to Barry
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02t-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/twinleaf-exterior.dst")
          out=Path("pb02t-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at resumed frame {frame}")

          def pulse(key,held=12,settle=300):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("checkpoint")

          # Native Twinleaf coordinates from pret/pokeplatinum:
          # player-house warp = (116,885), Barry trigger = (105,876),
          # Barry-house warp = (105,875). Exterior spawn is one tile south
          # of the player-house warp, so route west 11 then north 10.
          for i in range(1,12):
              pulse(Keys.KEY_LEFT,12,230)
              if i in (1,4,8,11): cap(f"west-{i:02d}")

          for i in range(1,11):
              pulse(Keys.KEY_UP,12,250)
              cap(f"north-{i:02d}")

          run(700); cap("barry-trigger-stable")

          # Advance the automatic Barry collision/forgot-something event.
          for i in range(1,9):
              pulse(Keys.KEY_A,12,430)
              cap(f"barry-event-a-{i:02d}")

          # Move onto native Barry-house warp at (105,875).
          pulse(Keys.KEY_UP,12,900); cap("barry-house-entry-attempt")
          run(900); cap("barry-house-entry-stable")

          # Preserve a checkpoint if we successfully entered.
          state_out=out/"barry-house.dst"
          emu.savestate.save_file(str(state_out))

          (out/"pb02t-meta.json").write_text(json.dumps({
              "gate":"PB02T_MAP_AWARE_ROUTE_TO_BARRY_HOUSE",
              "native_coordinates":{
                  "player_house_warp":[116,885],
                  "barry_trigger":[105,876],
                  "barry_house_warp":[105,875]
              },
              "route":"from exterior spawn: west 11, north 10, advance Barry event, north 1",
              "last_resumed_frame":frame,
              "captures":caps,
              "savestate":"barry-house.dst",
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02T proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02t-map-aware-barry-house-proof
          path: pb02t-play/
          if-no-files-found: warn
          retention-days: 14
