name: DS01 Sprite Archive Inventory

on:
  pull_request:
    branches:
      - assets/ds01-community-sprites-20260922
    paths:
      - "tools/inventory_ds01_sprite_archive.py"
      - ".github/workflows/ds01-sprite-inventory.yml"
      - "staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inventory archive
        run: |
          python tools/inventory_ds01_sprite_archive.py \
            staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip \
            --out ds01-sprite-archive-inventory.json

      - name: Preview combined sprite index
        run: |
          echo "=== COMBINED_SPRITE_INDEX.csv ==="
          unzip -p staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip \
            '*/COMBINED_SPRITE_INDEX.csv' | sed -n '1,120p'
          echo "=== LIBRARY_SUMMARY.json ==="
          unzip -p staging-assets/community-sprites/2026-09-22/DS01_Expanded_Community_Sprite_Library_2026-09-22.zip \
            '*/LIBRARY_SUMMARY.json' | sed -n '1,220p'

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: ds01-sprite-archive-inventory
          path: ds01-sprite-archive-inventory.json
