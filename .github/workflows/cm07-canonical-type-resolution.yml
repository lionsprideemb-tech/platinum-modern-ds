name: CM07 Canonical Type Resolution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/community_move_canonical_type_resolutions.json"
      - "data/community_type_resolved_mechanics_deferred.json"
      - "data/community_moves_cm07.json"
      - "tools/build_cm06_native_community_bulk.py"
      - "tools/install_cm01_community_moves.py"
      - "tools/install_pt05d_animation_preview_harness.py"
      - ".github/workflows/cm07-canonical-type-resolution.yml"

permissions:
  contents: read

concurrency:
  group: cm07-canonical-type-resolution
  cancel-in-progress: true

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy
  COMMUNITY_SOURCE_COMMIT: 4250c4bfbb2e8dddd117160cec9e1e8395dfe9f7

jobs:
  build-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core ffmpeg

      - name: Checkout pinned Platinum, HG-Engine, and community library
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

          git clone https://github.com/lionsprideemb-tech/Pokemon-moves.git vendor/community-moves
          git -C vendor/community-moves checkout "$COMMUNITY_SOURCE_COMMIT"

      - name: Verify every custom source type has a canonical Mercury resolution
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          canonical = {
              "Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison",
              "Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"
          }
          with Path("vendor/community-moves/manifests/FULL_MOVE_APPROVAL_DETAILS.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          custom = {r["move_id"]: r["type"] for r in rows if r["type"] not in canonical}

          resolutions = json.loads(Path("data/community_move_canonical_type_resolutions.json").read_text())
          resolved = {r["source_token"]: r for r in resolutions["resolutions"]}

          assert set(custom) == set(resolved), (
              "custom-type resolution mismatch",
              sorted(set(custom) - set(resolved)),
              sorted(set(resolved) - set(custom)),
          )
          for token, row in resolved.items():
              assert row["source_type"] == custom[token]
              assert row["mercury_type"] in canonical
              assert row["action"] == "retype"

          deferred = json.loads(Path("data/community_type_resolved_mechanics_deferred.json").read_text())
          live = json.loads(Path("data/community_moves_cm07.json").read_text())
          accounted = {
              m["token"].removeprefix("MOVE_") for m in live["moves"]
          } | {
              m["source_token"] for m in deferred["deferred"]
          }
          assert accounted == set(custom), (sorted(set(custom)-accounted), sorted(accounted-set(custom)))
          assert len(live["moves"]) == 18
          assert len(deferred["deferred"]) == 14
          print("Custom-type resolution coverage: PASS (32/32 -> canonical types)")
          PY

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Rebuild complete 1025-species layer
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report cm07-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --gate "CM07_${tag}_RESOURCE_INSTALL" \
              --report "cm07-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore certified Gen 5-9 move foundation
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report cm07-modern-moves.json \
            --implemented-registry cm07-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves cm07-implemented-moves.txt \
            --report cm07-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report cm07-evolutions.json

      - name: Restore CM01 through CM05
        shell: bash
        run: |
          for batch in 01 02 03 04 05; do
            python3 tools/install_cm01_community_moves.py \
              vendor/pokeplatinum \
              --batch "data/community_moves_cm${batch}.json" \
              --report "cm07-cm${batch}-restore.json"
          done
          test "$(jq -r '.last_community_id_this_pass' cm07-cm05-restore.json)" = "1047"
          test "$(jq -r '.total_community_moves_materialized' cm07-cm05-restore.json)" = "24"

      - name: Reconstruct certified CM06 native mechanics bulk
        shell: bash
        run: |
          python3 tools/build_cm06_native_community_bulk.py \
            vendor/community-moves \
            vendor/pokeplatinum \
            --mercury-root . \
            --start-id 1048 \
            --output cm06-native-bulk.json \
            --report cm07-cm06-selection.json

          test "$(jq -r '.selected_without_new_mechanics' cm07-cm06-selection.json)" = "153"
          test "$(jq -r '.first_id' cm07-cm06-selection.json)" = "1048"
          test "$(jq -r '.last_id' cm07-cm06-selection.json)" = "1200"

          python3 tools/install_cm01_community_moves.py \
            vendor/pokeplatinum \
            --batch cm06-native-bulk.json \
            --report cm07-cm06-install.json

          test "$(jq -r '.total_community_moves_materialized' cm07-cm06-install.json)" = "177"

      - name: Install canonical-type CM07 moves
        shell: bash
        run: |
          python3 tools/install_cm01_community_moves.py \
            vendor/pokeplatinum \
            --batch data/community_moves_cm07.json \
            --report cm07-canonical-types-install.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          batch = json.loads(Path("data/community_moves_cm07.json").read_text())
          install = json.loads(Path("cm07-canonical-types-install.json").read_text())
          moves = Path("vendor/pokeplatinum/generated/moves.txt").read_text().splitlines()
          canonical_tokens = {
              "TYPE_NORMAL","TYPE_FIRE","TYPE_WATER","TYPE_ELECTRIC","TYPE_GRASS",
              "TYPE_ICE","TYPE_FIGHTING","TYPE_POISON","TYPE_GROUND","TYPE_FLYING",
              "TYPE_PSYCHIC","TYPE_BUG","TYPE_ROCK","TYPE_GHOST","TYPE_DRAGON",
              "TYPE_DARK","TYPE_STEEL","TYPE_FAIRY"
          }

          assert len(batch["moves"]) == 18
          assert batch["moves"][0]["id"] == 1201
          assert batch["moves"][-1]["id"] == 1218
          assert all(m["type"] in canonical_tokens for m in batch["moves"])
          assert install["community_moves_installed_this_pass"] == 18
          assert install["first_community_id_this_pass"] == 1201
          assert install["last_community_id_this_pass"] == 1218
          assert install["total_community_moves_materialized"] == 195

          for record in batch["moves"]:
              assert moves[record["id"]] == record["token"]
          assert moves[1219] == "MAX_MOVES"
          print("CM07 canonical-type registry: PASS")
          PY

      - name: Verify all CM07 native animation donors
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          pt = Path("vendor/pokeplatinum")
          batch = json.loads(Path("data/community_moves_cm07.json").read_text())
          for record in batch["moves"]:
              stem = record["token"].removeprefix("MOVE_").lower()
              installed = pt / "res" / "moves" / stem / "anim.s"
              donor = pt / "res" / "moves" / record["animation"]["donor_move"] / "anim.s"
              assert installed.read_bytes() == donor.read_bytes(), (record["token"], donor)
          print("CM07 native animation donor verification: PASS")
          PY

      - name: Install Atomic Punch runtime proof
        shell: bash
        run: |
          python3 tools/install_pt04c_runtime_harness.py \
            vendor/pokeplatinum --report cm07-base-party.json
          python3 tools/install_pt04c_summary_harness.py \
            vendor/pokeplatinum --report cm07-base-summary.json
          python3 tools/install_pt04c_pc_harness.py \
            vendor/pokeplatinum --report cm07-base-pc.json
          python3 tools/install_pt04c_battle_harness.py \
            vendor/pokeplatinum --report cm07-base-battle.json

          python3 tools/install_pt05d_animation_preview_harness.py \
            vendor/pokeplatinum \
            --move MOVE_ATOMICPUNCH \
            --preview-id cm07_1207 \
            --report cm07-runtime-harness.json

          grep -q 'MOVE_ATOMICPUNCH' vendor/pokeplatinum/src/field_map_change.c

      - name: Build native Platinum with canonical-type resolution
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Run Atomic Punch native runtime proof
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cm07-venv"
          . "$RUNNER_TEMP/cm07-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)
          mp4 = out / "cm07-atomic-punch-native-platinum.mp4"

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("CM07 native Platinum ROM did not boot")

          fps = 15
          sample_every = 4
          proc = subprocess.Popen([
              "ffmpeg", "-y", "-loglevel", "error",
              "-f", "rawvideo", "-pix_fmt", "rgb24",
              "-s", "256x192", "-r", str(fps), "-i", "-",
              "-an", "-c:v", "libx264", "-preset", "veryfast",
              "-crf", "25", "-pix_fmt", "yuv420p", "-movflags", "+faststart",
              str(mp4)
          ], stdin=subprocess.PIPE)

          current = 0
          written = 0

          def cycle(frames):
              global current, written
              for _ in range(frames):
                  emu.cycle(False)
                  current += 1
                  if not emu.is_running():
                      raise SystemExit(f"CM07 emulator stopped at frame {current}")
                  if current % sample_every == 0:
                      image = emu.screenshot().crop((0, 0, 256, 192)).convert("RGB")
                      proc.stdin.write(image.tobytes())
                      written += 1

          def pulse_a(held=20, settle=180):
              emu.input.keypad_add_key(keymask(Keys.KEY_A))
              cycle(held)
              emu.input.keypad_rm_key(keymask(Keys.KEY_A))
              cycle(settle)

          try:
              cycle(1500)
              for _ in range(14):
                  pulse_a()
              cycle(800)
              emu.screenshot().save(out / "cm07-atomic-punch-final.png")
          finally:
              try:
                  if proc.stdin is not None:
                      proc.stdin.close()
                  rc = proc.wait()
                  if rc != 0:
                      raise SystemExit(f"ffmpeg failed with exit code {rc}")
              finally:
                  emu.destroy()

          if written < 100 or not mp4.exists() or mp4.stat().st_size < 10_000:
              raise SystemExit("CM07 runtime video proof is incomplete")

          meta = {
              "gate": "CM07_CANONICAL_TYPE_RUNTIME",
              "runtime": "pokeplatinum",
              "representative_move_id": 1207,
              "representative_move": "MOVE_ATOMICPUNCH",
              "source_type": "Nuclear",
              "mercury_type": "Poison",
              "canonical_type_resolutions": 32,
              "new_moves_installed": 18,
              "still_deferred_for_mechanics": 14,
              "total_live_community_moves": 195,
              "captured_frames": written,
              "emulator_cycles": current,
              "mp4": mp4.name,
              "mp4_bytes": mp4.stat().st_size,
          }
          (out / "cm07-meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload CM07 proof
        uses: actions/upload-artifact@v4
        with:
          name: cm07-canonical-type-resolution-proof
          path: |
            data/community_move_canonical_type_resolutions.json
            data/community_type_resolved_mechanics_deferred.json
            data/community_moves_cm07.json
            cm07-canonical-types-install.json
            cm07-runtime-harness.json
            runtime-preview/cm07-atomic-punch-native-platinum.mp4
            runtime-preview/cm07-atomic-punch-final.png
            runtime-preview/cm07-meta.json
          if-no-files-found: error
          retention-days: 14

      - name: CM07 summary
        shell: bash
        run: |
          {
            echo "## CM07 canonical type resolution"
            echo
            echo "- Source custom-type moves resolved: 32 / 32"
            echo "- Non-canonical playable move types remaining: 0"
            echo "- Retyped moves immediately compatible with native Platinum mechanics: 18"
            echo "- Retyped moves still deferred only for mechanic review: 14"
            echo "- Total live community moves after CM07: 195"
            echo "- Last live community move ID: 1218"
            echo "- Atomic Punch received representative native battle runtime proof"
          } >> "$GITHUB_STEP_SUMMARY"
