name: PB02E Player Choice To Naming

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02e-player-choice-naming.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download sealed PB01 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip \
            > pb01-artifact.zip
          unzip -q pb01-artifact.zip -d pb01-artifact
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02e-venv"
          . "$RUNNER_TEMP/pb02e-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Play to gender choice and naming screen
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02e-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          out=Path("pb02e-play")
          out.mkdir(exist_ok=True)
          emu=DeSmuME()
          emu.open("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          frame=0
          captures=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02E stopped at {frame}")

          def pulse(key, held=12, settle=320):
              m=keymask(key)
              emu.input.keypad_add_key(m)
              run(held)
              emu.input.keypad_rm_key(m)
              run(settle)

          def touch(x,y,held=30,settle=600):
              emu.input.touch_set_pos(x,y)
              run(held)
              emu.input.touch_release()
              run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(captures):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              colors=img.convert("RGB").getcolors(maxcolors=256*384)
              captures.append({"stage":label,"frame":frame,"file":name,
                "unique_colors":len(colors) if colors is not None else 256*384})

          try:
              run(16000)
              pulse(Keys.KEY_START,20,700)
              for _ in range(6): pulse(Keys.KEY_A)
              pulse(Keys.KEY_DOWN,8,120)
              pulse(Keys.KEY_DOWN,8,120)
              pulse(Keys.KEY_A,12,400)
              pulse(Keys.KEY_A,12,360)
              pulse(Keys.KEY_A,12,360)
              touch(128,97)
              for _ in range(8): pulse(Keys.KEY_A,12,400)

              cap("gender-choice-arrived")

              # Test the actual selector/highlight before accepting a player model.
              pulse(Keys.KEY_RIGHT, held=8, settle=300)
              cap("boy-selection-input")

              pulse(Keys.KEY_A, held=12, settle=650)
              cap("boy-choice-confirmed")

              # Advance the confirmation line, but stop at the naming UI for visual review.
              pulse(Keys.KEY_A, held=12, settle=650)
              cap("player-naming-screen")

              run(600)
              cap("naming-screen-stable")
          finally:
              emu.destroy()

          meta={
              "gate":"PB02E_PLAYER_CHOICE_TO_NAMING_REAL_PLAY",
              "test_player":"boy",
              "choice_input":"RIGHT then A",
              "last_frame":frame,
              "captures":captures,
              "visual_review_required":True,
              "next":"map touchscreen keyboard and enter a test player name"
          }
          (out/"pb02e-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload PB02E visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02e-player-choice-naming-proof
          path: pb02e-play/
          if-no-files-found: error
          retention-days: 14
