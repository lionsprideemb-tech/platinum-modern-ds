name: ALPHA02 Route 201 Ledge Detour To Sandgem

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/alpha02-route201-ledgedetour-sandgem.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  sprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS alpha branch
        uses: actions/checkout@v4

      - name: Download known-good PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download ALPHA01 Route 201 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-alpha01-sandgem-sprint
          path: checkpoint
          run-id: 36011957535
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/mercury-alpha02-venv"
          . "$RUNNER_TEMP/mercury-alpha02-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Clear Route 201 ledge detour and reach Sandgem
        shell: bash
        run: |
          . "$RUNNER_TEMP/mercury-alpha02-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/alpha01-sandgem-approach.dst")
          out=Path("alpha02-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"ALPHA02 stopped at frame {frame}")

          def pulse(key, held=10, settle=175):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def march(key, count, label, marks):
              for i in range(1,count+1):
                  pulse(key)
                  if i in marks:
                      cap(f"{label}-{i:02d}")

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(240); cap("route201-north-bend-start")

          # Platinum Route 201 has a ledge blocking the straight north bend.
          # The intended route detours west through grass, north past the ledge,
          # then returns east to the final Sandgem approach.
          march(Keys.KEY_LEFT, 12, "detour-west", {4,8,12})
          march(Keys.KEY_UP, 18, "detour-north", {6,12,18})
          march(Keys.KEY_RIGHT, 22, "return-east", {6,12,18,22})
          march(Keys.KEY_RIGHT, 34, "sandgem-east", {8,16,24,34})

          run(1200); cap("sandgem-stable")
          saved=out/"alpha02-sandgem.dst"
          emu.savestate.save_file(str(saved))

          (out/"alpha02-meta.json").write_text(json.dumps({
              "gate":"ALPHA02_ROUTE201_LEDGE_DETOUR_TO_SANDGEM",
              "source_run":36011957535,
              "source_state":"alpha01-sandgem-approach.dst",
              "segments":["LEFT x12","UP x18","RIGHT x22","RIGHT x34"],
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload ALPHA02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-alpha02-sandgem
          path: alpha02-play/
          if-no-files-found: error
          retention-days: 30
