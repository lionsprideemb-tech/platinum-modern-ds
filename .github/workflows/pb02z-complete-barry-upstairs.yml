name: PB02Z Complete Barry Upstairs Event

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02z-complete-barry-upstairs.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and verified Barry 2F checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10790716345/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/barry-house-2f.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02z-venv"
          . "$RUNNER_TEMP/pb02z-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish Barry upstairs dialogue and departure
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02z-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/barry-house-2f.dst")
          out=Path("pb02z-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02Z stopped at {frame}")

          def pulse(key,held=12,settle=650):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          cap("verified-2f-checkpoint")

          # PB02Y visually mapped Barry from the 2F stair arrival:
          # RIGHT x6, DOWN x1, A starts his progression dialogue.
          for _ in range(6):
              pulse(Keys.KEY_RIGHT,12,230)
          pulse(Keys.KEY_DOWN,12,260)
          cap("facing-barry")

          pulse(Keys.KEY_A,12,900)
          cap("barry-event-start")

          # Multi-page native text requires more confirmations than the earlier
          # probe supplied. Advance generously; while the script is locked,
          # extra confirmations are harmless, and after Barry leaves there is
          # no object directly in front of the player.
          for i in range(1,15):
              pulse(Keys.KEY_A,12,850)
              if i in (2,4,6,8,10,12,14):
                  cap(f"barry-event-a-{i:02d}")

          run(2500)
          cap("barry-departure-stable")

          # Native script moves the player one tile away from stairs and
          # releases control after setting FLAG_RIVAL_LEFT_HOME.
          pulse(Keys.KEY_LEFT,12,350)
          cap("post-barry-field-control")

          saved=out/"post-barry-upstairs-final.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02z-meta.json").write_text(json.dumps({
              "gate":"PB02Z_COMPLETE_BARRY_UPSTAIRS_EVENT",
              "source_checkpoint_artifact":10790716345,
              "source_state":"barry-house-2f.dst",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"exit Barry house and fast-certify Route 201 / Lake Verity"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02Z proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02z-barry-upstairs-complete-proof
          path: pb02z-play/
          if-no-files-found: error
          retention-days: 14
