name: PB02AO Reach Starter Briefcase Control

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ao-reach-starter-control.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and Rowan checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10807763737/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/route201-briefcase-ready.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ao-venv"
          . "$RUNNER_TEMP/pb02ao-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish Rowan/Dawn dialogue to free briefcase control
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ao-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/route201-briefcase-ready.dst")
          out=Path("pb02ao-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AO stopped at {frame}")

          def pulse(key,held=12,settle=900):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("dawn-hard-to-replace")
          for i in range(1,9):
              pulse(Keys.KEY_A,12,900)
              cap(f"advance-{i:02d}")

          run(1400); cap("briefcase-control-stable")
          saved=out/"route201-briefcase-control.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02ao-meta.json").write_text(json.dumps({
              "gate":"PB02AO_REACH_STARTER_BRIEFCASE_CONTROL",
              "source_artifact":10807763737,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"interact with briefcase, select starter, certify rival battle"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AO proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ao-starter-control-proof
          path: pb02ao-play/
          if-no-files-found: error
          retention-days: 14
