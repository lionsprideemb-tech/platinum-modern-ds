name: PB02AB1 Enter Barry House

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ab1-enter-barry-house.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and true post-THUD checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10793151394/zip > true-post-thud.zip
          unzip -q true-post-thud.zip -d checkpoint
          test -s checkpoint/true-post-barry-thud.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ab1-venv"
          . "$RUNNER_TEMP/pb02ab1-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Walk into Barry house and save verified 1F state
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ab1-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/true-post-barry-thud.dst")
          out=Path("pb02ab1-play"); out.mkdir(exist_ok=True)

          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=500):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})
              return img

          def indoor(img):
              r,g,b=img.convert("RGB").getpixel((0,0))
              return r<8 and g<8 and b<8

          cap("true-post-thud-loaded")
          entered=False; presses=0
          for i in range(1,11):
              pulse(Keys.KEY_UP,12,420)
              presses=i
              img=cap(f"up-{i:02d}")
              if indoor(img):
                  entered=True
                  break

          if not entered:
              raise SystemExit("Could not enter Barry house from true post-THUD state")

          run(800); cap("barry-house-1f-stable")
          saved=out/"true-barry-house-1f.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02ab1-meta.json").write_text(json.dumps({
              "gate":"PB02AB1_ENTER_BARRY_HOUSE",
              "source_checkpoint_artifact":10793151394,
              "up_presses_required":presses,
              "indoor_detected":entered,
              "output_state":saved.name,
              "captures":caps,
              "next":"use searched/proven stair route to reach Barry 2F"
          },indent=2)+"\n")
          print(json.dumps({"entered":entered,"up_presses":presses},indent=2))
          emu.destroy()
          PY

      - name: Upload Barry 1F continuation state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ab1-true-barry-house-1f
          path: pb02ab1-play/
          if-no-files-found: error
          retention-days: 14
