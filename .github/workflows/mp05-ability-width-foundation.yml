name: MP05 Ability Width Foundation

on:
  push:
    branches:
      - feature/modern-platinum-fast
    paths:
      - ".github/workflows/mp05-ability-width-foundation.yml"
      - "tools/install_mp05_ability_id_width.py"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply sealed Mercury overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Rebuild MP04 modern foundation
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mp05-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --gate "MP05_${tag}_RESOURCE_INSTALL" \
              --report "mp05-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mp05-modern-moves.json \
            --implemented-registry mp05-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mp05-implemented-moves.txt \
            --report mp05-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mp05-evolutions.json

      - name: Install canonical Gen 9 ability ID architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_id_width.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mp05-ability-width.json

          test "$(jq -r '.canonical_abilities' mp05-ability-width.json)" = "311"
          test "$(jq -r '.last_id' mp05-ability-width.json)" = "310"
          test "$(jq -r '.last_token' mp05-ability-width.json)" = "ABILITY_POISON_PUPPETEER"
          test "$(jq -r '.ability_id_bits' mp05-ability-width.json)" = "10"
          test "$(jq -r '.save_layout_growth_bytes' mp05-ability-width.json)" = "0"
          test "$(jq -r '.marking_bits_preserved' mp05-ability-width.json)" = "6"

          test "$(sed -n '311p' vendor/pokeplatinum/generated/abilities.txt)" = "ABILITY_POISON_PUPPETEER"
          grep -q 'u16 abilities\[MAX_ABILITIES\];' vendor/pokeplatinum/include/struct_defs/species.h
          grep -q 'u8 abilityHigh : 2;' vendor/pokeplatinum/include/struct_defs/pokemon.h
          grep -q 'u16 ability;' vendor/pokeplatinum/include/battle/battle_mon.h

      - name: Generate Mercury title
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mp05-venv"
          . "$RUNNER_TEMP/mp05-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Build full MP05 ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage MP05 proof
        shell: bash
        run: |
          mkdir -p mp05-proof
          cp "$BUILD/pokeplatinum.us.nds" mp05-proof/Pokemon_Mercury_Modern_Platinum_MP05.nds
          cp mp05-ability-width.json mp05-proof/
          sha256sum mp05-proof/Pokemon_Mercury_Modern_Platinum_MP05.nds > mp05-proof/SHA256SUMS.txt

          {
            echo "MP05 canonical ability-width foundation"
            echo "Canonical ability namespace: 0-310"
            echo "Save-layout growth: 0 bytes"
            echo "Pokemon markings preserved: 6 bits"
            echo "Modern ability behavior ports: deferred to MP06+"
            echo "Long playtest: intentionally skipped"
          } > mp05-proof/MP05_MANIFEST.txt

      - name: Upload MP05 proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-modern-platinum-mp05-ability-width
          path: mp05-proof/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## MP05 ability-width foundation"
            echo
            echo "- Canonical abilities 0-310 registered: PASS"
            echo "- 10-bit per-Pokémon ability storage without save growth: PASS"
            echo "- Six normal marking bits preserved: PASS"
            echo "- Species personal-data ability slots widened: PASS"
            echo "- Battle/Summary runtime ability holders widened: PASS"
            echo "- Full ROM compile: PASS"
            echo "- Runtime playthrough: intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"
