name: ALPHA01 Lake Verity To Sandgem Sprint

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/alpha01-verity-to-sandgem.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  sprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS alpha branch
        uses: actions/checkout@v4

      - name: Download known-good PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download ALPHA00 post-Verity navigation checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-alpha00-post-verity-navigation
          path: checkpoint
          run-id: 36011566286
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/mercury-alpha01-venv"
          . "$RUNNER_TEMP/mercury-alpha01-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Sprint from Lakefront toward Sandgem
        shell: bash
        run: |
          . "$RUNNER_TEMP/mercury-alpha01-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/post-verity-down.dst")
          out=Path("alpha01-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"ALPHA01 stopped at frame {frame}")

          def pulse(key, held=10, settle=175):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          def save(label):
              p=out/f"{label}.dst"; emu.savestate.save_file(str(p)); return p.name

          run(240); cap("lakefront-start")

          # Reverse the previously certified Route 201 -> Lake Verity route.
          for i in range(1,15):
              pulse(Keys.KEY_DOWN)
              if i in (4,8,12,14): cap(f"lakefront-down-{i:02d}")
          s1=save("after-lakefront-down")

          for i in range(1,37):
              pulse(Keys.KEY_RIGHT)
              if i in (8,16,24,32,36): cap(f"route201-east-{i:02d}")
          s2=save("after-route201-east")

          # Continue east aggressively toward Sandgem. Extra pulses safely stop
          # against collision if we reach a bend or building boundary.
          for i in range(1,41):
              pulse(Keys.KEY_RIGHT)
              if i in (10,20,30,40): cap(f"sandgem-approach-east-{i:02d}")

          run(900); cap("sandgem-approach-stable")
          s3=save("alpha01-sandgem-approach")

          (out/"alpha01-meta.json").write_text(json.dumps({
              "gate":"ALPHA01_LAKE_VERITY_TO_SANDGEM_SPRINT",
              "source_run":36011566286,
              "source_state":"post-verity-down.dst",
              "segments":["DOWN x14","RIGHT x36","RIGHT x40"],
              "states":[s1,s2,s3],
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload ALPHA01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-alpha01-sandgem-sprint
          path: alpha01-play/
          if-no-files-found: error
          retention-days: 30
