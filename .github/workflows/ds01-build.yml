name: DS01 Engine Build

on:
  workflow_dispatch:
  push:
    branches: [main, asset-import-20260922]
    paths:
      - "upstream/LOCK.json"
      - "engine-overlay/**"
      - ".github/workflows/ds01-build.yml"

permissions:
  contents: read

env:
  CC: gcc-10
  CXX: g++-10
  COMPARE: 0
  SDL_VIDEODRIVER: dummy

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt -y --allow-downgrades install \
            g++-10-multilib linux-libc-dev binutils-arm-none-eabi p7zip-full \
            pkg-config libpugixml-dev libpng-dev build-essential cmake \
            python3-pip python3-venv git automake autoconf gcc-arm-none-eabi wget
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo add-apt-repository ppa:cybermax-dexter/sdl2-backport -y
          sudo wget -q -NP /etc/apt/sources.list.d/ "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"
          sudo apt update
          sudo apt -y --allow-downgrades install --install-recommends winehq-stable

      - name: Checkout pinned pokeheartgold
        shell: bash
        run: |
          git clone https://github.com/pret/pokeheartgold.git vendor/pokeheartgold
          git -C vendor/pokeheartgold checkout "$(jq -r '.sources["pokeheartgold"].commit' upstream/LOCK.json)"

      - name: Bootstrap pokeheartgold toolchain
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools"
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub"
          mkdir -p "$RUNNER_TEMP/phg-download"
          cd "$RUNNER_TEMP/phg-download"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/mwccarm.zip
          unzip -q -o mwccarm.zip
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/mwccarm"
          mv mwccarm "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/NitroSDK-3_2-060901.7z
          7z x -y NitroSDK-3_2-060901.7z >/dev/null
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/bin"
          mv NitroSDK-3_2-060901/tools/bin "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM7-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM9-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/mwldarm.response.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 19

      - name: Build HeartGold base from source
        working-directory: vendor/pokeheartgold
        env:
          LM_LICENSE_FILE: "${{ github.workspace }}/vendor/pokeheartgold/tools/mwccarm/license.dat"
          GAME_VERSION: HEARTGOLD
          GAME_LANGUAGE: ENGLISH
          GAME_REVISION: 0
        shell: bash
        run: make -j"$(nproc)"

      - name: Checkout pinned HG-Engine
        shell: bash
        run: |
          git clone --recursive https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          git -C vendor/hg-engine submodule update --init --recursive

      - name: Apply project engine overlay
        shell: bash
        run: |
          rsync -a --exclude README.md engine-overlay/ vendor/hg-engine/

      - name: Prepare HG-Engine inputs
        shell: bash
        run: |
          cp vendor/pokeheartgold/build/heartgold.us/pokeheartgold.us.nds vendor/hg-engine/rom.nds
          wget -q https://github.com/BluRosie/hg-engine/raw/workflows/assets/test.sav -O vendor/hg-engine/test.sav

      - name: Build HG-Engine
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          unset CC
          unset CXX
          make AUTO_TEST=Y -j"$(nproc)"

      - name: Run HG-Engine tests
        working-directory: vendor/hg-engine
        shell: bash
        run: scripts/run_tests.sh -c -j "$(nproc)"

      - name: Record build fingerprint
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          {
            echo "## DS01 build passed"
            echo
            echo "- HG-Engine: \`$(jq -r '.sources["hg-engine"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")\`"
            echo "- pokeheartgold: \`$(jq -r '.sources["pokeheartgold"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")\`"
            echo "- test.nds SHA-256: \`$(sha256sum test.nds | awk '{print $1}')\`"
            echo "- test.nds bytes: \`$(stat -c%s test.nds)\`"
            echo
            echo "No ROM artifact is uploaded by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"


  sprite_fetch:
    if: github.ref == 'refs/heads/asset-import-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build community source bundle
        shell: bash
        run: |
          set -u
          mkdir -p bundle/01_modern_ds_resource bundle/02_original_downloads bundle/03_source_notes
          echo "Community sprite source fetch" > bundle/FETCH_STATUS.txt

          if git clone --depth 1 --filter=blob:none --sparse https://github.com/DrPrettyman/PokemonSprites-64x64DSStyle.git modern-ds; then
            git -C modern-ds sparse-checkout set sprites-processed README.md MISSING_SPRITES.md scripts/data
            rm -rf modern-ds/.git
            cp -R modern-ds/. bundle/01_modern_ds_resource/
            echo "OK: modern DS-style GitHub resource" >> bundle/FETCH_STATUS.txt
          else
            echo "FAILED: modern DS-style GitHub resource" >> bundle/FETCH_STATUS.txt
          fi

          GEN6='https://www.dropbox.com/scl/fo/f6rdkcf4q5hhhb4nvw4q2/ADPek1h3iP_qnmpKRywj2AA?rlkey=j7zkw7y4vn3gt0sl6q6wpcetx&dl=1'
          if curl -L --fail --retry 2 --connect-timeout 20 "$GEN6" -o bundle/02_original_downloads/gen6_ds_style_dropbox.zip && unzip -t bundle/02_original_downloads/gen6_ds_style_dropbox.zip >/dev/null 2>&1; then
            echo "OK: Gen VI Dropbox" >> bundle/FETCH_STATUS.txt
          else
            echo "FAILED: Gen VI Dropbox" >> bundle/FETCH_STATUS.txt
            rm -f bundle/02_original_downloads/gen6_ds_style_dropbox.zip
          fi

          GEN7='https://www.dropbox.com/sh/qzcsjctxl8riqev/AADbTFTmn0zBtKT6WzkoEQmya?dl=1'
          if curl -L --fail --retry 2 --connect-timeout 20 "$GEN7" -o bundle/02_original_downloads/gen7plus_ds_style_dropbox.zip && unzip -t bundle/02_original_downloads/gen7plus_ds_style_dropbox.zip >/dev/null 2>&1; then
            echo "OK: Gen VII+ Dropbox" >> bundle/FETCH_STATUS.txt
          else
            echo "FAILED: Gen VII+ Dropbox" >> bundle/FETCH_STATUS.txt
            rm -f bundle/02_original_downloads/gen7plus_ds_style_dropbox.zip
          fi

          python -m pip install -q gdown
          if gdown --id 17vlgBbf6_YNHy30Q590Dx-WBrRZ_3Y6Z -O bundle/02_original_downloads/dppt_gen6plus_backsprites.zip; then
            echo "OK: DPPt Gen VI+ backsprites" >> bundle/FETCH_STATUS.txt
          else
            echo "FAILED: DPPt Gen VI+ backsprites" >> bundle/FETCH_STATUS.txt
            rm -f bundle/02_original_downloads/dppt_gen6plus_backsprites.zip
          fi

          if gdown --id 1GFgwG6vSC_F1f4Sa6c_M08LeFYyqCaEF -O bundle/02_original_downloads/altered_platinum_r1.0.5.zip; then
            echo "OK: Altered Platinum" >> bundle/FETCH_STATUS.txt
          else
            echo "FAILED: Altered Platinum (Google flagged download)" >> bundle/FETCH_STATUS.txt
            rm -f bundle/02_original_downloads/altered_platinum_r1.0.5.zip
          fi

          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, html
          page='https://www.mediafire.com/file/zsafdt7q0fnvdqt/TowerOfAshes_GraphicsPack.zip/file'
          out=Path('bundle/02_original_downloads/tower_of_ashes_graphics_pack.zip')
          try:
              req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
              body=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              m=re.search(r'id="downloadButton"[^>]+href="([^"]+)"',body)
              if not m: m=re.search(r'href="(https://download[^"]+)"',body)
              if not m: raise RuntimeError('direct MediaFire link not found')
              url=html.unescape(m.group(1))
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':page})
              out.write_bytes(urllib.request.urlopen(req,timeout=60).read())
          except Exception as e:
              print(e)
              if out.exists(): out.unlink()
          PY
          if [ -s bundle/02_original_downloads/tower_of_ashes_graphics_pack.zip ]; then
            echo "OK: Tower of Ashes" >> bundle/FETCH_STATUS.txt
          else
            echo "FAILED: Tower of Ashes" >> bundle/FETCH_STATUS.txt
          fi

          cat > bundle/03_source_notes/SOURCES.txt <<'EOF'
          https://github.com/DrPrettyman/PokemonSprites-64x64DSStyle
          https://www.pokecommunity.com/threads/gen-vi-ds-style-64x64-pokemon-sprite-resource.314422/
          https://www.pokecommunity.com/threads/ds-style-gen-vii-and-beyond-pok%C3%A9mon-sprite-repository-in-64x64.368703/
          https://www.pokecommunity.com/threads/the-dppt-style-gen-vi-and-beyond-backsprite-resource.448065/
          https://projectpokemon.org/home/forums/topic/60361-pok%C3%A9mon-altered-platinum-sinnohan-forms-increased-difficulty-and-more/
          https://www.deviantart.com/pikachumazzinga/art/Tower-of-Ashes-Free-Custom-Gen4-Backsprites-1102803694
          EOF
          find bundle -type f -printf '%P\n' | sort >> bundle/FETCH_STATUS.txt

      - name: Upload community sprite bundle
        uses: actions/upload-artifact@v4
        with:
          name: community-ds-sprite-sources-20260922
          path: bundle
          compression-level: 6
          if-no-files-found: error
