name: MR10B Safe Ability Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr10-safe-runtime-integration
    paths:
      - "tools/run_mr08_canonical_stack.py"
      - "tools/install_mr10b1_er_safe_scalar_overrides.py"
      - "tools/install_mr10b2_safe_defensive_reaction_overrides.py"
      - "data/mr10_safe_ability_partition.json"
      - ".github/workflows/mr10b1-safe-ability-runtime.yml"

permissions:
  contents: write

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-pip wget xz-utils libpng-dev rsync jq

      - name: Checkout pinned sources
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"
          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Restore modern move namespace
        run: |
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum
          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr10b1-modern-moves.json \
            --implemented-registry mr10b1-implemented-moves.txt

      - name: Restore canonical Ability namespace
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr10b1-ability-namespace.json \
            --implemented-registry mr10b1-implemented-abilities.txt

      - name: Rebuild all canonical mechanics
        run: |
          python3 tools/run_mr08_canonical_stack.py \
            vendor/pokeplatinum \
            --implemented-registry mr10b1-implemented-abilities.txt \
            --reports-dir mr10b1-mr08-reports \
            --report mr10b1-mr08-stack.json
          test "$(jq -r '.status' mr10b1-mr08-stack.json)" = "PASS"
          test "$(jq -r '.canonical_modern_implemented' mr10b1-mr08-stack.json)" = "187"

      - name: Apply safe ER canonical overrides
        run: |
          python3 tools/install_mr10b1_er_safe_scalar_overrides.py \
            vendor/pokeplatinum \
            --partition data/mr10_safe_ability_partition.json \
            --report mr10b1-safe-overrides.json
          test "$(jq -r '.status' mr10b1-safe-overrides.json)" = "PASS"
          test "$(jq -r '.count' mr10b1-safe-overrides.json)" = "15"

      - name: Apply safe defensive/reaction overrides
        run: |
          python3 tools/install_mr10b2_safe_defensive_reaction_overrides.py \
            vendor/pokeplatinum \
            --partition data/mr10_safe_ability_partition.json \
            --report mr10b2-safe-overrides.json
          test "$(jq -r '.status' mr10b2-safe-overrides.json)" = "PASS"
          test "$(jq -r '.count' mr10b2-safe-overrides.json)" = "10"

      - name: Materialize full Mercury custom namespace
        run: |
          python3 tools/install_mr10a_custom_ability_namespace.py \
            vendor/pokeplatinum \
            --partition data/mr10_safe_ability_partition.json \
            --report mr10b1-custom-namespace.json
          test "$(jq -r '.status' mr10b1-custom-namespace.json)" = "PASS"

      - name: Build native Platinum ROM
        working-directory: vendor/pokeplatinum
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr10b-safe-ability-runtime-${{ github.run_id }}
          path: |
            mr10b1-mr08-stack.json
            mr10b1-mr08-reports/
            mr10b1-safe-overrides.json
            mr10b2-safe-overrides.json
            mr10b1-custom-namespace.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## MR10B safe ability runtime"
            echo
            echo "- Canonical Gen 5-9 mechanics rebuilt: 187/187"
            echo "- Safe ER canonical overrides through B2: 25"
            echo "- Custom namespace materialized through ID 929"
            echo "- Held custom-system decisions touched: 0"
            echo "- Native ROM build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit certified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/checkpoints
          cat > docs/checkpoints/MR10B2_SAFE_ABILITY_RUNTIME_PASS.md <<'EOF'
          # MR10B2 Safe Ability Runtime — PASS

          Full native Platinum ROM build completed successfully after:
          - rebuilding all 187 canonical Gen 5-9 Ability mechanics;
          - applying 25 safe Elite Redux canonical overrides through MR10B2;
          - materializing the Mercury custom Ability namespace through ID 929;
          - leaving all 93 held new-engine-system decisions untouched.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints/MR10B2_SAFE_ABILITY_RUNTIME_PASS.md
          git diff --cached --quiet && exit 0
          git commit -m "Checkpoint MR10B2 safe ability runtime"
          git push
