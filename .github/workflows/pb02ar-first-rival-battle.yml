name: PB02AR First Rival Battle Certification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ar-first-rival-battle.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and Turtwig-selected checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10809161459/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/turtwig-selected.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ar-venv"
          . "$RUNNER_TEMP/pb02ar-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish starter scene and play first rival battle
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ar-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/turtwig-selected.dst")
          out=Path("pb02ar-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AR stopped at {frame}")

          def pulse(key,held=12,settle=850):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("starter-selected-checkpoint")

          # Finish Rowan/Dawn departure and accept Barry's battle challenge.
          for i in range(1,13):
              pulse(Keys.KEY_A,12,850)
              if i in (1,3,5,7,9,11,12):
                  cap(f"post-starter-a-{i:02d}")

          run(1400); cap("first-rival-battle-entry")

          # Native opening battle defaults: FIGHT is selected and Tackle is
          # move slot 1. Repeated A with generous settle time plays the battle
          # without menu scripting or memory injection.
          for i in range(1,25):
              pulse(Keys.KEY_A,12,650)
              if i in (2,4,6,8,10,12,16,20,24):
                  cap(f"battle-a-{i:02d}")

          run(2600); cap("first-rival-battle-stable-end")

          saved=out/"post-first-rival-battle.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02ar-meta.json").write_text(json.dumps({
              "gate":"PB02AR_FIRST_RIVAL_BATTLE_CERTIFICATION",
              "source_artifact":10809161459,
              "starter":"TURTWIG",
              "expected_rival_starter":"CHIMCHAR",
              "battle_input":"native A-button menu/move selection only",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"Lake Verity opening sequence then Sandgem"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AR proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ar-first-rival-battle-proof
          path: pb02ar-play/
          if-no-files-found: error
          retention-days: 14
