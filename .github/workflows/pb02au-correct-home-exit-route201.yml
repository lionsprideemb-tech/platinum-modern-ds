name: PB02AU Correct Home Exit To Route 201 Partner

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02au-correct-home-exit-route201.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and post-rival-battle checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10809011670/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/post-first-rival-battle.dst
          test "$(sha256sum rom/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02au-venv"
          . "$RUNNER_TEMP/pb02au-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish Running Shoes scene, exit home, trigger Barry partner event
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02au-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/post-first-rival-battle.dst")
          out=Path("pb02au-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02AU stopped at frame {frame}")

          def pulse(key,held=12,settle=650):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})
              return img

          def text_box_present(img):
              # Platinum message boxes occupy most of y=148..188 on the top screen
              # and are dominated by near-white pixels. This lets us stop pressing
              # A as soon as the automatic mother cutscene actually releases.
              rgb=img.convert("RGB")
              total=0; light=0
              for y in range(148,188,4):
                  for x in range(4,252,4):
                      r,g,b=rgb.getpixel((x,y)); total += 1
                      if r > 205 and g > 205 and b > 205:
                          light += 1
              return light / total > 0.25

          cap("post-rival-home")

          # Finish the full post-battle mother/Running Shoes sequence without
          # over-advancing into a second interaction after ReleaseAll.
          released=False
          for i in range(1,21):
              pulse(Keys.KEY_A,12,780)
              img=cap(f"mom-running-shoes-a-{i:02d}")
              if not text_box_present(img):
                  released=True
                  break
          if not released:
              raise SystemExit("PB02AU mother cutscene did not release within 20 A presses")

          run(700); cap("home-free-control")

          # Visual proof from the previous attempt showed two DOWNs land on the
          # red doormat. The third DOWN crosses the actual 1F front-door warp.
          for i in range(1,4):
              pulse(Keys.KEY_DOWN,12,500 if i < 3 else 1200)
              cap(f"home-exit-down-{i:02d}")

          run(700); cap("twinleaf-exterior-confirmed")

          # Player-house exterior x=116; the central road into Route 201 is x112.
          for _ in range(4):
              pulse(Keys.KEY_LEFT,12,230)
          cap("twinleaf-central-road")

          # First rival battle set VAR_FOLLOWER_RIVAL_STATE=2. Enter Route 201
          # through x109..113,z857 to fire the native Barry partner coord event.
          for i in range(1,31):
              pulse(Keys.KEY_UP,12,245)
              if i in (10,20,30):
                  cap(f"north-{i:02d}")

          run(1000); cap("route201-barry-partner-event")

          # Barry's legendary-Pokémon partner sequence is short; extra A presses
          # during movement locks are harmless.
          for i in range(1,6):
              pulse(Keys.KEY_A,12,800)
              cap(f"barry-partner-a-{i:02d}")

          run(900); cap("route201-partner-control")

          saved=out/"route201-partner-real.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02au-meta.json").write_text(json.dumps({
              "gate":"PB02AU_CORRECT_HOME_EXIT_TO_ROUTE201_PARTNER",
              "source_artifact":10809011670,
              "running_shoes_cutscene_released":released,
              "corrected_front_door_input":"DOWN x3",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"PB02AV Verity Lakefront / Lake Verity opening"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AU proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02au-route201-partner-real-proof
          path: pb02au-play/
          if-no-files-found: error
          retention-days: 14
