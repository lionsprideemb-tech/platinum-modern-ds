name: PB02AQ Select Turtwig Starter

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02aq-select-turtwig.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and open starter selector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10808986008/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/starter-selector-open.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02aq-venv"
          . "$RUNNER_TEMP/pb02aq-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Choose default Turtwig and return to field
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02aq-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/starter-selector-open.dst")
          out=Path("pb02aq-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AQ stopped at {frame}")

          def pulse(key,held=12,settle=1100):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("starter-selector-open")

          # Cursor starts on option 0 = Turtwig. Native application uses A to
          # advance intro text, select the highlighted ball, and confirm YES.
          for i in range(1,7):
              pulse(Keys.KEY_A,12,1100)
              cap(f"starter-a-{i:02d}")

          run(2600); cap("starter-selection-return-stable")

          saved=out/"turtwig-selected.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02aq-meta.json").write_text(json.dumps({
              "gate":"PB02AQ_SELECT_TURTWIG_STARTER",
              "source_artifact":10808986008,
              "selected_option":0,
              "expected_species":"TURTWIG",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"finish post-selection dialogue and certify first rival battle"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AQ proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02aq-turtwig-selected-proof
          path: pb02aq-play/
          if-no-files-found: error
          retention-days: 14
