name: PB02AS Running Shoes To Route 201 Partner

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02as-running-shoes-route201.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and post-rival-battle checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10809011670/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/post-first-rival-battle.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02as-venv"
          . "$RUNNER_TEMP/pb02as-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish mom cutscene and reach Barry partner event
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02as-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/post-first-rival-battle.dst")
          out=Path("pb02as-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AS stopped at {frame}")

          def pulse(key,held=12,settle=650):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("post-rival-home")

          # Complete the automatic mother cutscene, including Running Shoes.
          for i in range(1,10):
              pulse(Keys.KEY_A,12,750)
              if i in (1,3,5,7,9): cap(f"mom-a-{i:02d}")
          run(1200); cap("running-shoes-cutscene-complete")

          # Native cutscene leaves player at (6,8); front-door warp is (6,10).
          pulse(Keys.KEY_DOWN,12,350)
          pulse(Keys.KEY_DOWN,12,1100)
          cap("twinleaf-exterior-running-shoes")

          # Align with the central north road (x110-ish) then walk north into
          # Route 201. Use normal native movement only.
          for _ in range(6): pulse(Keys.KEY_LEFT,12,220)
          cap("twinleaf-central-road")
          for i in range(1,30):
              pulse(Keys.KEY_UP,12,240)
              if i in (10,20,29): cap(f"north-{i:02d}")

          run(1200); cap("route201-barry-partner-event")

          # Barry: "Let's catch that legendary Pokémon!" / "Nothing to fear!"
          for i in range(1,6):
              pulse(Keys.KEY_A,12,750)
              cap(f"barry-partner-a-{i:02d}")

          run(1200); cap("route201-partner-control")

          saved=out/"route201-barry-partner.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02as-meta.json").write_text(json.dumps({
              "gate":"PB02AS_RUNNING_SHOES_TO_ROUTE201_PARTNER",
              "source_artifact":10809011670,
              "running_shoes_expected":True,
              "rival_partner_expected":True,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"fast-play west to Verity Lakefront / Lake Verity Cyrus scene"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AS proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02as-route201-partner-proof
          path: pb02as-play/
          if-no-files-found: error
          retention-days: 14
