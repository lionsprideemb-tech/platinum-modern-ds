name: DS04 Twinleaf Runtime Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ds04-twinleaf-transplant
    paths:
      - "tools/narc_append.py"
      - "tools/stage_ds04_twinleaf.py"
      - "tools/convert_platinum_landdata.py"
      - "tools/convert_platinum_areadata.py"
      - "tools/build_hgss_prop_set.py"
      - "tests/**"
      - "platinum_port/twinleaf/**"
      - "upstream/LOCK.json"
      - "engine-overlay/**"
      - ".github/workflows/ds04-runtime-build.yml"

permissions:
  contents: read

env:
  CC: gcc-10
  CXX: g++-10
  COMPARE: 0
  SDL_VIDEODRIVER: dummy

jobs:
  runtime-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt -y --allow-downgrades install \
            g++-10-multilib linux-libc-dev binutils-arm-none-eabi p7zip-full \
            pkg-config libpugixml-dev libpng-dev build-essential cmake \
            python3-pip python3-venv git automake autoconf gcc-arm-none-eabi wget
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo add-apt-repository ppa:cybermax-dexter/sdl2-backport -y
          sudo wget -q -NP /etc/apt/sources.list.d/ \
            "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"
          sudo apt update
          sudo apt -y --allow-downgrades install --install-recommends winehq-stable

      - name: Checkout pinned source trees
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pret/pokeheartgold.git vendor/pokeheartgold
          git -C vendor/pokeheartgold checkout "$(jq -r '.sources["pokeheartgold"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

      - name: Run DS04 staging regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_narc_append.py
          python3 tests/test_landdata_converter.py
          python3 tests/test_areadata_converter.py

      - name: Stage runtime-safe Twinleaf proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_ds04_twinleaf.py \
            --pokeheartgold vendor/pokeheartgold \
            --pokeplatinum vendor/pokeplatinum \
            --runtime-compat-slot \
            --test-start \
            --report /tmp/ds04_runtime_stage.json

          cat /tmp/ds04_runtime_stage.json

          jq -e '
            .runtime_compat_slot == true and
            .map_headers == [538] and
            .test_start_map == 538 and
            .test_start_x == 4 and
            .test_start_y == 6 and
            .test_start_direction == 0 and
            .archives.land_data.members == 682 and
            .archives.area_data.members == 108 and
            .archives.prop_sets.members == 106 and
            .archives.map_textures.members == 108 and
            .archives.prop_textures.members == 106 and
            .archives.exterior_models.members == 344 and
            .archives.interior_models.members == 244
          ' /tmp/ds04_runtime_stage.json >/dev/null

          grep -q '^#define MAP_ID_MAX[[:space:]]*540' vendor/pokeheartgold/include/constants/maps.h
          ! grep -q '^#define MAP_SINNOH_TWINLEAF_TOWN' vendor/pokeheartgold/include/constants/maps.h
          grep -q 'map_matrix_0293_SINNOH_TWINLEAF_PLAYER_2F' vendor/pokeheartgold/src/data/map_headers.h
          grep -q '\.mapId = MAP_UNUSED,' vendor/pokeheartgold/src/location_backup.c
          grep -q '\.x = 4,' vendor/pokeheartgold/src/location_backup.c
          grep -q '\.y = 6,' vendor/pokeheartgold/src/location_backup.c
          grep -q '\.direction = 0,' vendor/pokeheartgold/src/location_backup.c

          echo "DS04 runtime-safe Twinleaf staging: PASS"

      - name: Bootstrap pokeheartgold toolchain
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools"
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub"
          mkdir -p "$RUNNER_TEMP/phg-download"
          cd "$RUNNER_TEMP/phg-download"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/mwccarm.zip
          unzip -q -o mwccarm.zip
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/mwccarm"
          mv mwccarm "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/NitroSDK-3_2-060901.7z
          7z x -y NitroSDK-3_2-060901.7z >/dev/null
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/bin"
          mv NitroSDK-3_2-060901/tools/bin "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM7-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM9-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/mwldarm.response.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 19

      - name: Build staged HeartGold source
        working-directory: vendor/pokeheartgold
        env:
          LM_LICENSE_FILE: "${{ github.workspace }}/vendor/pokeheartgold/tools/mwccarm/license.dat"
          GAME_VERSION: HEARTGOLD
          GAME_LANGUAGE: ENGLISH
          GAME_REVISION: 0
        shell: bash
        run: make -j"$(nproc)"

      - name: Verify staged HeartGold output
        shell: bash
        run: |
          set -euo pipefail
          rom="vendor/pokeheartgold/build/heartgold.us/pokeheartgold.us.nds"
          test -s "$rom"
          {
            echo "## DS04 staged HeartGold built"
            echo
            echo "- Runtime header slot: `MAP_UNUSED (538)`"
            echo "- Test start: `Twinleaf Player House 2F @ (4,6), north`"
            echo "- Staged HeartGold SHA-256: `$(sha256sum "$rom" | awk '{print $1}')`"
            echo "- Staged HeartGold bytes: `$(stat -c%s "$rom")`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout pinned HG-Engine
        shell: bash
        run: |
          git clone --recursive https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          git -C vendor/hg-engine submodule update --init --recursive

      - name: Apply project engine overlay
        shell: bash
        run: |
          rsync -a --exclude README.md engine-overlay/ vendor/hg-engine/

      - name: Prepare HG-Engine inputs
        shell: bash
        run: |
          cp vendor/pokeheartgold/build/heartgold.us/pokeheartgold.us.nds vendor/hg-engine/rom.nds
          wget -q https://github.com/BluRosie/hg-engine/raw/workflows/assets/test.sav -O vendor/hg-engine/test.sav

      - name: Build HG-Engine Twinleaf proof
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          unset CC
          unset CXX
          make AUTO_TEST=Y -j"$(nproc)"
          test -s test.nds

      - name: Record DS04 runtime build fingerprint
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          {
            echo
            echo "## DS04 HG-Engine runtime proof built"
            echo
            echo "- HG-Engine: `$(jq -r '.sources["hg-engine"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")`"
            echo "- pokeheartgold: `$(jq -r '.sources["pokeheartgold"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")`"
            echo "- pokeplatinum: `$(jq -r '.sources["pokeplatinum"].commit' "$GITHUB_WORKSPACE/upstream/LOCK.json")`"
            echo "- test.nds SHA-256: `$(sha256sum test.nds | awk '{print $1}')`"
            echo "- test.nds bytes: `$(stat -c%s test.nds)`"
            echo
            echo "No ROM artifact is uploaded by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
