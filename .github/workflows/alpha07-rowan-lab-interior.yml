name: ALPHA07 Rowan Lab Interior

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/alpha07-rowan-lab-interior.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  enter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Mercury DS alpha branch
        uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download ALPHA06 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-alpha06-rowan-lab
          path: checkpoint
          run-id: 36014224328
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/mercury-alpha07-venv"
          . "$RUNNER_TEMP/mercury-alpha07-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Enter Rowan lab interior
        shell: bash
        run: |
          . "$RUNNER_TEMP/mercury-alpha07-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/alpha06-rowan-lab.dst")
          out=Path("alpha07-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"ALPHA07 stopped at {frame}")

          run(180)
          m=keymask(Keys.KEY_A); emu.input.keypad_add_key(m); run(12); emu.input.keypad_rm_key(m)
          run(2600)
          emu.screenshot().save(out/"rowan-lab-interior.png")
          saved=out/"alpha07-rowan-lab-interior.dst"
          emu.savestate.save_file(str(saved))
          (out/"alpha07-meta.json").write_text(json.dumps({
              "gate":"ALPHA07_ROWAN_LAB_INTERIOR",
              "source_run":36014224328,
              "output_state":saved.name
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload ALPHA07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-alpha07-rowan-lab-interior
          path: alpha07-play/
          if-no-files-found: error
          retention-days: 30
