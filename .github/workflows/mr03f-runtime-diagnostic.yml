name: MR03F Runtime Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr03f-summary-bottom-learner
    paths:
      - ".github/workflows/mr03f-runtime-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip libsdl2-2.0-0 unzip
          python3 -m venv "$RUNNER_TEMP/mr03f-diag"
          . "$RUNNER_TEMP/mr03f-diag/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Download already-built MR03F proof ROM
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          gh api \
            repos/lionsprideemb-tech/platinum-modern-ds/actions/artifacts/10908365470/zip \
            > "$RUNNER_TEMP/mr03f-proof.zip"
          mkdir -p proof
          unzip -q "$RUNNER_TEMP/mr03f-proof.zip" -d proof
          test -s proof/Pokemon_Mercury_MR03F_Summary_Bottom_Proof.nds

      - name: Trace Summary entry frame by frame
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr03f-diag/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import Keys, keymask

          rom = Path("proof/Pokemon_Mercury_MR03F_Summary_Bottom_Proof.nds")
          out = Path("diag")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          frame = 0
          trace = []

          def cycle_one():
              global frame
              emu.cycle(False)
              frame += 1
              return emu.is_running()

          def cycle(n):
              for _ in range(n):
                  if not cycle_one():
                      return False
              return True

          def press(key, hold=4, settle=0):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              ok = cycle(hold)
              emu.input.keypad_rm_key(mask)
              if not ok:
                  return False
              return cycle(settle)

          def snap(label):
              img = emu.screenshot().convert("RGB")
              p = out / f"{frame:05d}-{label}.png"
              img.save(p)
              trace.append({"frame": frame, "label": label, "running": emu.is_running(), "file": p.name})

          try:
              cycle(3600)
              press(Keys.KEY_X, settle=120)
              press(Keys.KEY_A, settle=180)
              press(Keys.KEY_A, settle=120)
              press(Keys.KEY_DOWN, settle=60)
              snap("before-open")
              press(Keys.KEY_A, hold=4, settle=0)
              snap("open-plus-4")

              # Entry transition: capture frequently so we know the exact
              # last healthy state before the ARM9 stops.
              for step in range(1, 21):
                  if not cycle(12):
                      trace.append({"frame": frame, "label": f"stopped-step-{step}", "running": False})
                      break
                  snap(f"entry-{step:02d}")
          finally:
              try:
                  emu.destroy()
              except Exception:
                  pass

          (out / "trace.json").write_text(json.dumps(trace, indent=2) + "\n")
          PY

      - name: Upload diagnostic frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr03f-runtime-diagnostic
          path: diag/
          if-no-files-found: error
          retention-days: 7
