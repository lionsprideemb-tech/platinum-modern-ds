name: MR03F Runtime Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr03f-summary-bottom-learner
    paths:
      - ".github/workflows/mr03f-runtime-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      ARTIFACT_ID: "10908365470"

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Reuse already-built MR03F ROM
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          mkdir -p prior diagnostic
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/\${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            > prior/mr03f.zip
          unzip -q prior/mr03f.zip -d prior/artifact
          test -s prior/artifact/Pokemon_Mercury_MR03F_Summary_Bottom_Proof.nds
          cp prior/artifact/Pokemon_Mercury_MR03F_Summary_Bottom_Proof.nds diagnostic/mr03f.nds

      - name: Install emulator
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mr03f-diag-venv"
          . "$RUNNER_TEMP/mr03f-diag-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Capture opening frame-by-frame
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr03f-diag-venv/bin/activate"
          python3 - <<'PY' 2>diagnostic/desmume-stderr.log
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import Keys, keymask

          rom = Path("diagnostic/mr03f.nds")
          out = Path("diagnostic")
          emu = DeSmuME()
          emu.open(str(rom))
          frame = 0
          captures = []

          def cycle(count):
              global frame
              for _ in range(count):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      return False
              return True

          def press(key, hold=4, settle=0):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              ok = cycle(hold)
              emu.input.keypad_rm_key(mask)
              if not ok:
                  return False
              return cycle(settle)

          def snap(label):
              im = emu.screenshot().convert("RGB")
              p = out / f"{frame:05d}-{label}.png"
              im.save(p)
              captures.append({"frame": frame, "file": p.name})

          try:
              if not cycle(3600): raise SystemExit("stopped before field")
              if not press(Keys.KEY_X, settle=120): raise SystemExit("stopped opening menu")
              if not press(Keys.KEY_A, settle=180): raise SystemExit("stopped opening party")
              if not press(Keys.KEY_A, settle=120): raise SystemExit("stopped opening context")
              if not press(Keys.KEY_DOWN, settle=60): raise SystemExit("stopped selecting learner")

              snap("before-final-a")
              if not press(Keys.KEY_A, hold=4, settle=0):
                  snap("stopped-on-final-a")
              else:
                  snap("after-final-a")
                  for n in range(1, 31):
                      if not cycle(8):
                          break
                      snap(f"open-{n:02d}")

              meta = {
                  "last_frame": frame,
                  "running": bool(emu.is_running()),
                  "captures": captures,
              }
              (out / "meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          finally:
              emu.destroy()
          PY

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr03f-runtime-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 7
