name: PB02AL Exit Barry House To Route 201

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02al-exit-barry-to-route201.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and certified Barry 2F state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10803922585/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/pb02ak-horizontal-probe.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02al-venv"
          . "$RUNNER_TEMP/pb02al-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Exit rival house and walk north to Route 201
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02al-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/pb02ak-horizontal-probe.dst")
          out=Path("pb02al-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AL stopped at {frame}")

          def pulse(key, held=12, settle=450):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          cap("post-barry-2f")

          # PB02AL0 visual proof: UP -> LEFT crosses from 2F back to 1F.
          pulse(Keys.KEY_UP,12,700)
          pulse(Keys.KEY_LEFT,12,1200)
          cap("barry-house-1f-return")

          # Native 1F warp coordinates: stair (2,3), exterior door (6,10).
          # Move off the upper landing, then across to the door column.
          for _ in range(6): pulse(Keys.KEY_DOWN,12,260)
          cap("one-f-south-six")
          for _ in range(4): pulse(Keys.KEY_RIGHT,12,260)
          cap("one-f-door-column")
          for i in range(1,3):
              pulse(Keys.KEY_DOWN,12,900)
              cap(f"door-down-{i:02d}")

          run(900); cap("twinleaf-exterior-after-barry")

          # Barry house is NW at x105; central north road is around x110-111.
          for i in range(1,7):
              pulse(Keys.KEY_RIGHT,12,260)
              if i in (3,6): cap(f"town-east-{i:02d}")

          # Fast walk north toward Route 201; collisions safely cap excess inputs.
          for i in range(1,16):
              pulse(Keys.KEY_UP,12,300)
              if i in (5,10,15): cap(f"north-{i:02d}")

          run(1200); cap("route201-arrival-probe")

          saved=out/"route201-arrival-probe.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02al-meta.json").write_text(json.dumps({
              "gate":"PB02AL_EXIT_BARRY_TO_ROUTE201",
              "source_artifact":10803922585,
              "two_f_exit":"UP -> LEFT",
              "one_f_route":"DOWN x6 -> RIGHT x4 -> DOWN x2",
              "town_route":"RIGHT x6 -> UP x15",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02al-exit-barry-to-route201-proof
          path: pb02al-play/
          if-no-files-found: error
          retention-days: 14
