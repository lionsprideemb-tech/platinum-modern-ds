name: PB02AU Correct Route 201 Partner Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02au-correct-route201-partner.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and post-rival-battle checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10809011670/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/post-first-rival-battle.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02au-venv"
          . "$RUNNER_TEMP/pb02au-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish home scene, exit with third DOWN, reach Barry partner
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02au-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/post-first-rival-battle.dst")
          out=Path("pb02au-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"PB02AU stopped at {frame}")

          def pulse(key,held=12,settle=650):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("post-battle-home")
          for i in range(1,11):
              pulse(Keys.KEY_A,12,750)
              if i in (3,6,9,10): cap(f"mom-a-{i:02d}")

          run(900); cap("home-control")

          # Visual proof from PB02AT: two DOWN inputs place player on the red
          # threshold; the third crosses the native (6,10) front-door warp.
          for i in range(1,4):
              pulse(Keys.KEY_DOWN,12,700)
              cap(f"door-down-{i:02d}")

          run(900); cap("twinleaf-exterior")

          # Exterior player-house door is x116. Shift to x112, then follow the
          # clear central north road into Route 201.
          for _ in range(4): pulse(Keys.KEY_LEFT,12,220)
          cap("central-road")
          for i in range(1,31):
              pulse(Keys.KEY_UP,12,240)
              if i in (10,20,30): cap(f"north-{i:02d}")

          run(1000); cap("route201-partner-event")

          for i in range(1,5):
              pulse(Keys.KEY_A,12,800)
              cap(f"partner-a-{i:02d}")

          run(1000); cap("route201-partner-stable")

          saved=out/"route201-partner-corrected.dst"
          emu.savestate.save_file(str(saved))
          (out/"pb02au-meta.json").write_text(json.dumps({
              "gate":"PB02AU_CORRECT_ROUTE201_PARTNER_CHECKPOINT",
              "source_artifact":10809011670,
              "door_exit":"DOWN x3",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"Verity Lakefront and Cyrus opening scene"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AU proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02au-route201-partner-corrected
          path: pb02au-play/
          if-no-files-found: error
          retention-days: 14
