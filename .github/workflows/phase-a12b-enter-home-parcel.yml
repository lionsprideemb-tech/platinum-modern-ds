name: PHASE-A12B Enter Home And Get Parcel

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a12b-enter-home-parcel.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download PHASE-A12 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a12-post-parcel
          path: checkpoint
          run-id: 36026079852
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a12b-venv"
          . "$RUNNER_TEMP/phase-a12b-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Enter player house and complete Journal Parcel event
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a12b-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/phase-a12-post-parcel.dst")
          out=Path("phase-a12b"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A12B stopped at {frame}")

          def pulse(key, held=10, settle=190):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              name=f"{len(caps):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})

          run(240); cap("outside-house-start")

          # Current state is beside the player's house. Drop to the door row,
          # then move east onto the door warp.
          for _ in range(3): pulse(Keys.KEY_DOWN)
          cap("door-row")
          for _ in range(4): pulse(Keys.KEY_RIGHT)
          run(1000); cap("home-entry-check")

          # From the entry area, face Mom and begin the Pokédex return event.
          pulse(Keys.KEY_UP, settle=300)
          pulse(Keys.KEY_RIGHT, settle=300)
          pulse(Keys.KEY_A, held=12, settle=1100)
          cap("mom-event-start")

          # Journal -> rival's mom entrance -> Parcel handoff.
          for i in range(1,25):
              pulse(Keys.KEY_A, held=12, settle=850)
              if i in (5,10,15,20,24):
                  cap(f"parcel-progress-{i:02d}")

          run(2200); cap("post-parcel-stable")
          saved=out/"phase-a12b-post-parcel.dst"
          emu.savestate.save_file(str(saved))
          (out/"phase-a12b-meta.json").write_text(json.dumps({
              "gate":"PHASE_A12B_ENTER_HOME_AND_GET_PARCEL",
              "source_run":36026079852,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PHASE-A12B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a12b-post-parcel
          path: phase-a12b/
          if-no-files-found: error
          retention-days: 30
