name: PHASE-A13G Finish Route 202 Tutorial

on:
  push:
    branches:
      - feature/mercury-full-playable-alpha
    paths:
      - ".github/workflows/phase-a13g-finish-route202-tutorial.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4

      - name: Download PB01 ROM
        uses: actions/download-artifact@v4
        with:
          name: mercury-redux-pb01-playable-candidate
          path: rom
          run-id: 35919890042
          github-token: ${{ github.token }}

      - name: Download A13F triggered tutorial checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mercury-phase-a13f-route202-trigger-probe
          path: checkpoint
          run-id: 36149969353
          github-token: ${{ github.token }}

      - name: Install emulator tooling
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/phase-a13g-venv"
          . "$RUNNER_TEMP/phase-a13g-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

      - name: Finish scripted catching tutorial and restore field control
        shell: bash
        run: |
          . "$RUNNER_TEMP/phase-a13g-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          X=0x021C5F0E
          Z=0x021C5F2E
          rom=next(Path("rom").rglob("*.nds"))
          state=Path("checkpoint/left8.dst")
          out=Path("phase-a13g")
          out.mkdir(exist_ok=True)

          emu=DeSmuME()
          emu.open(str(rom))
          emu.savestate.load_file(str(state))
          frame=0
          captures=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame+=1
                  if not emu.is_running():
                      raise SystemExit(f"PHASE-A13G stopped at {frame}")

          def xy():
              return (
                  emu.memory.unsigned.read_short(X),
                  emu.memory.unsigned.read_short(Z),
              )

          def pulse(key,held=12,settle=700):
              m=keymask(key)
              emu.input.keypad_add_key(m)
              run(held)
              emu.input.keypad_rm_key(m)
              run(settle)

          def snap(label):
              name=f"{len(captures):02d}-{label}-{frame:06d}.png"
              emu.screenshot().save(out/name)
              captures.append({
                  "stage":label,
                  "frame":frame,
                  "file":name,
                  "xy":xy(),
              })

          run(180)
          snap("tutorial-dialogue-resume")
          if xy() != (180,825):
              raise SystemExit(f"Unexpected A13F resume coordinate: {xy()}")

          # Dawn now owns the vanilla Route 202 event.  Advance the scripted
          # dialogue/battle demonstration, capturing milestones rather than
          # attempting any map navigation during the event.
          for i in range(1,41):
              pulse(Keys.KEY_A)
              if i in (4,8,12,16,20,24,28,32,36,40):
                  snap(f"tutorial-progress-{i:02d}")

          run(2500)
          snap("tutorial-post-event-stable")

          # Probe a harmless north step to prove normal player control returns.
          before=xy()
          pulse(Keys.KEY_UP,12,600)
          after=xy()
          snap("route202-control-probe")

          final=out/"phase-a13g-route202-control.dst"
          emu.savestate.save_file(str(final))
          (out/"phase-a13g-meta.json").write_text(json.dumps({
              "gate":"PHASE_A13G_FINISH_ROUTE202_TUTORIAL",
              "source_run":36149969353,
              "source_state":state.name,
              "control_probe":{"before":before,"after":after},
              "final_xy":after,
              "output_state":final.name,
              "captures":captures,
              "visual_review_required":True,
          },indent=2)+"\n")

          emu.destroy()
          PY

      - name: Upload PHASE-A13G evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-phase-a13g-route202-control
          path: phase-a13g/
          if-no-files-found: error
          retention-days: 30
