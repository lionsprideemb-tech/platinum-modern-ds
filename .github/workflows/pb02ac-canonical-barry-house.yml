name: PB02AC Canonical Barry House Sequence

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ac-canonical-barry-house.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and near-THUD checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10793151394/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/true-post-barry-thud.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ac-venv"
          . "$RUNNER_TEMP/pb02ac-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Finish THUD, enter house, and run Barry upstairs event
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ac-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/true-post-barry-thud.dst")
          out=Path("pb02ac-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key, held=12, settle=300):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})
              return img

          cap("near-thud-loaded")

          # AB1 visual proof showed the fourth UP triggers native 'Thud!!'.
          for _ in range(4): pulse(Keys.KEY_UP,12,350)
          cap("thud-message")

          # Native script has exactly three message waits:
          # Big Thud -> Going to see Prof. Rowan -> Forgot something.
          pulse(Keys.KEY_A,12,1800); cap("barry-going-to-rowan")
          pulse(Keys.KEY_A,12,2600); cap("barry-forgot-something")
          pulse(Keys.KEY_A,12,3400); cap("thud-event-released")

          # After the scripted south push, two north tiles enter Barry's door.
          pulse(Keys.KEY_UP,12,400)
          pulse(Keys.KEY_UP,12,1200)
          cap("barry-house-1f")
          run(700)

          # From entrance, clear right-side route to the upstairs warp.
          # In this interior the source x-axis is mirrored onscreen; the
          # native stair at (2,3) is reached by RIGHT x4, UP x6.
          for _ in range(4): pulse(Keys.KEY_RIGHT,12,220)
          for _ in range(6): pulse(Keys.KEY_UP,12,260)
          cap("stair-route-top")
          run(1100); cap("barry-house-2f-event")

          # 2F OnFrame event contains two dialogue waits around native movement.
          # Use generous settle windows so movement completes between presses.
          pulse(Keys.KEY_A,12,1800); cap("barry-upstairs-after-first-message")
          pulse(Keys.KEY_A,12,3000); cap("barry-upstairs-after-second-message")
          run(2200); cap("barry-left-home")

          # Confirm field control after ReleaseAll.
          pulse(Keys.KEY_DOWN,12,500); cap("barry-2f-field-control")

          saved=out/"post-barry-upstairs-confirmed.dst"
          emu.savestate.save_file(str(saved))

          meta={
              "gate":"PB02AC_CANONICAL_BARRY_HOUSE_SEQUENCE",
              "source_checkpoint_artifact":10793151394,
              "thud_messages_advanced":3,
              "house_entry_input":"UP x2 after THUD release",
              "stair_candidate":"RIGHT x4, UP x6",
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"Route 201 / Lake Verity fast certification"
          }
          (out/"pb02ac-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          emu.destroy()
          PY

      - name: Upload PB02AC proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ac-canonical-barry-house-proof
          path: pb02ac-play/
          if-no-files-found: error
          retention-days: 14
