name: PB02AB Barry House Upstairs Event

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ab-barry-house-upstairs.yml"
      - "docs/HARD_HANDOFF_PB02AA_BARRY_THUD_CONFIRMED_2026-09-24.md"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and PB02AA checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10790910656/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/post-barry-thud-confirmed.dst
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ab-venv"
          . "$RUNNER_TEMP/pb02ab-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Enter Barry house and certify upstairs event
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ab-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom = Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state = Path("checkpoint/post-barry-thud-confirmed.dst")
          out = Path("pb02ab-play")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          emu.savestate.load_file(str(state))

          frame = 0
          captures = []

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02AB emulator stopped at resumed frame {frame}")

          def pulse(key, held=12, settle=300):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              run(held)
              emu.input.keypad_rm_key(mask)
              run(settle)

          def capture(label):
              image = emu.screenshot()
              name = f"{len(captures):02d}-{label}-{frame:05d}.png"
              image.save(out / name)
              rec = {
                  "stage": label,
                  "frame": frame,
                  "file": name,
                  "top_left": list(image.convert("RGB").getpixel((0, 0))),
              }
              captures.append(rec)
              return image

          def is_indoor(image):
              r, g, b = image.convert("RGB").getpixel((0, 0))
              return r < 8 and g < 8 and b < 8

          capture("post-thud-checkpoint")
          run(400)

          # Move north until the actual Barry-house door warp fires. The THUD
          # scene changes the player's final tile, so detect the indoor map
          # instead of assuming one fixed number of key pulses.
          entered = False
          up_presses = 0
          for i in range(1, 7):
              pulse(Keys.KEY_UP, 12, 500)
              up_presses = i
              image = capture(f"door-approach-up-{i:02d}")
              if is_indoor(image):
                  entered = True
                  break

          if not entered:
              raise SystemExit("PB02AB failed to enter Barry house within six UP inputs")

          run(600)
          capture("barry-house-1f-stable")

          # Proven 1F route from the entrance checkpoint to the stair warp:
          # LEFT x3 -> UP x6 -> LEFT x1.
          for _ in range(3):
              pulse(Keys.KEY_LEFT, 12, 240)
          capture("barry-1f-stair-lane")

          for i in range(1, 7):
              pulse(Keys.KEY_UP, 12, 280)
              if i in (3, 6):
                  capture(f"barry-1f-up-{i:02d}")

          pulse(Keys.KEY_LEFT, 12, 1200)
          capture("barry-house-2f-arrival")
          run(700)
          capture("barry-upstairs-first-message")

          # The 2F OnFrame script is automatic:
          # Take Bag and Journal -> notice player -> Waiting on the Road ->
          # Barry leaves -> FLAG_RIVAL_LEFT_HOME.
          for i in range(1, 5):
              pulse(Keys.KEY_A, 12, 700)
              capture(f"barry-upstairs-a-{i:02d}")

          run(2200)
          capture("barry-upstairs-event-complete")

          # Movement proves field control has been returned.
          pulse(Keys.KEY_DOWN, 12, 380)
          capture("barry-2f-field-control")

          saved = out / "post-barry-upstairs-confirmed.dst"
          emu.savestate.save_file(str(saved))

          meta = {
              "gate": "PB02AB_BARRY_HOUSE_UPSTAIRS_EVENT",
              "source_checkpoint_artifact": 10790910656,
              "source_state": "post-barry-thud-confirmed.dst",
              "door_entry": {
                  "detected_by": "black top-left indoor viewport",
                  "up_presses_required": up_presses,
              },
              "proven_1f_route": "LEFT x3, UP x6, LEFT x1",
              "upstairs_script_sets": [
                  "FLAG_RIVAL_LEFT_HOME",
                  "VAR_RIVAL_HOUSE_STATE=1",
                  "VAR_TWINLEAF_TOWN_GUITARIST_TRIGGER_STATE=2"
              ],
              "output_state": saved.name,
              "last_resumed_frame": frame,
              "captures": captures,
              "visual_review_required": True,
              "next_gate": "PB02AC_ROUTE_201_LAKE_VERITY_FAST_CERTIFICATION"
          }
          (out / "pb02ab-meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          emu.destroy()
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload PB02AB proof and continuation state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ab-barry-upstairs-proof
          path: pb02ab-play/
          if-no-files-found: error
          retention-days: 14
