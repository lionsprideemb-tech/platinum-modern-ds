name: DS01 Sprite Similarity Certification

on:
  workflow_dispatch:
  push:
    branches:
      - audit/ds01-sprite-dedup-20260928
    paths:
      - "data/ds01_sprite_similarity_audit.json"
      - "data/ds01_sprite_quarantine.json"
      - "tools/audit_ds01_sprite_similarity_gate.py"
      - ".github/workflows/ds01-sprite-similarity-gate.yml"
  pull_request:
    branches:
      - assets/ds01-community-sprites-20260922
    paths:
      - "data/ds01_sprite_similarity_audit.json"
      - "data/ds01_sprite_quarantine.json"
      - "tools/audit_ds01_sprite_similarity_gate.py"
      - ".github/workflows/ds01-sprite-similarity-gate.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax gate
        run: python -m py_compile tools/audit_ds01_sprite_similarity_gate.py
      - name: Certify sprite audit
        run: |
          python tools/audit_ds01_sprite_similarity_gate.py \
            data/ds01_sprite_similarity_audit.json \
            data/ds01_sprite_quarantine.json \
            --report ds01-sprite-similarity-certification.json
      - name: Upload certification
        uses: actions/upload-artifact@v4
        with:
          name: ds01-sprite-similarity-certification
          path: ds01-sprite-similarity-certification.json
