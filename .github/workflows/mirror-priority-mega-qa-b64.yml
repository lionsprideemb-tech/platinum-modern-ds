name: Mirror Priority Mega QA Proofs as Base64

on:
  push:
    branches: [work/sprites-audit-20260930]
    paths:
      - '.github/workflows/mirror-priority-mega-qa-b64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sprites-audit-20260930
          fetch-depth: 0

      - name: Mirror comparison PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          root=Path('sprite-work/native-ds-imports/batch1-priority-megas/qa')
          out=root/'proof-b64'
          out.mkdir(parents=True,exist_ok=True)
          for p in sorted(root.glob('*_gba_vs_ds.png')):
              (out/(p.name+'.b64')).write_text(base64.b64encode(p.read_bytes()).decode('ascii'))
          PY

      - name: Commit mirrors
        run: |
          git config user.name "Mercury Sprite QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sprite-work/native-ds-imports/batch1-priority-megas/qa/proof-b64 .github/workflows/mirror-priority-mega-qa-b64.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sprites: expose priority Mega QA proofs as base64"
          git push origin HEAD:work/sprites-audit-20260930
