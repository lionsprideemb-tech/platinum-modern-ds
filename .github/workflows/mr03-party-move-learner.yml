name: MR03 Party Move Learner

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mr03-party-move-learner
    paths:
      - ".github/workflows/mr03-party-move-learner.yml"
      - "tools/install_mr03_party_move_learner.py"
      - "tools/install_mr03_party_path_harness.py"
      - "tools/install_mercury_move_learner.py"
      - "tools/install_mp05_ability_namespace.py"
      - "tools/install_pt04d_species_batch.py"
      - "tools/install_pt05a_compatible_learnsets.py"
      - "tools/install_pt05b_compatible_evolutions.py"
      - "tools/install_pt05c_move_id_width.py"
      - "tools/install_pt05c1_modern_moves.py"
      - "tools/audit_move_id_namespace.py"
      - "data/**"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - "tools/generate_mercury_title.py"
      - "upstream/LOCK.json"

permissions:
  contents: read

concurrency:
  group: mr03-party-move-learner-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  build-and-prove-party-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"
          test -s vendor/hg-engine/data/learnsets/learnsets.json

      - name: Apply sealed Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Python syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_pt04d_species_batch.py \
            tools/install_pt05a_compatible_learnsets.py \
            tools/install_pt05b_compatible_evolutions.py \
            tools/install_pt05c_move_id_width.py \
            tools/install_pt05c1_modern_moves.py \
            tools/install_mercury_move_learner.py \
            tools/install_mr03_party_move_learner.py \
            tools/install_mr03_party_path_harness.py

      - name: Restore MP05 canonical ability architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr03-ability-namespace.json \
            --implemented-registry mr03-implemented-abilities.txt
          test "$(jq -r '.canonical_ability_count' mr03-ability-namespace.json)" = "311"
          test "$(jq -r '.save_storage.capacity' mr03-ability-namespace.json)" = "1023"

      - name: Build canonical 1025 species registry
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mr03-species-registry.json
          test "$(sed -n '1026p' vendor/pokeplatinum/generated/species.txt)" = "SPECIES_PECHARUNT"

      - name: Install modern species resources
        shell: bash
        run: |
          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --implemented-abilities mr03-implemented-abilities.txt \
              --gate "MR03_${tag}_RESOURCE_INSTALL" \
              --report "mr03-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore 16-bit move namespace and modern learnsets
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr03-modern-moves.json \
            --implemented-registry mr03-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mr03-implemented-moves.txt \
            --report mr03-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mr03-evolutions.json

      - name: Install universal DS Move Learner
        shell: bash
        run: |
          python3 tools/install_mercury_move_learner.py \
            vendor/pokeplatinum vendor/hg-engine \
            --implemented-moves mr03-implemented-moves.txt \
            --report mr03-move-learner.json
          test "$(jq -r '.status' mr03-move-learner.json)" = "PASS"
          test "$(jq -r '.species_count' mr03-move-learner.json)" = "1025"

      - name: Install MR03 party-menu entry
        shell: bash
        run: |
          python3 tools/install_mr03_party_move_learner.py \
            vendor/pokeplatinum \
            --report mr03-party-move-learner.json

          test "$(jq -r '.status' mr03-party-move-learner.json)" = "PASS"
          grep -q 'PARTY_MENU_EXIT_CODE_MOVE_LEARNER' vendor/pokeplatinum/include/applications/party_menu/defs.h
          grep -q 'PARTY_MENU_STR_MOVE_LEARNER' vendor/pokeplatinum/include/applications/party_menu/defs.h
          grep -q 'PartyMenu_SelectMoveLearner' vendor/pokeplatinum/src/applications/party_menu/context_menu.c
          grep -q 'MoveReminderData_GetMoves(mon, HEAP_ID_PARTY_MENU)' vendor/pokeplatinum/src/applications/party_menu/main.c
          grep -q 'StartMenu_ExitMoveLearner' vendor/pokeplatinum/src/start_menu.c
          grep -q '"PartyMenu_Text_MoveLearner"' vendor/pokeplatinum/res/text/party_menu.json

      - name: Prove production build has no test direct-launch hooks
        shell: bash
        run: |
          grep -q 'EnqueueApplication(FS_OVERLAY_ID(game_opening), &gOpeningCutsceneAppTemplate);' vendor/pokeplatinum/src/main.c
          if grep -q 'CI-only setup' vendor/pokeplatinum/src/field_map_change.c; then
            echo "MR03 CI setup leaked into production workspace" >&2
            exit 1
          fi
          if grep -q 'FieldSystem_OpenMoveReminderMenu(fieldSystem, learner)' vendor/pokeplatinum/src/field_map_change.c; then
            echo "Move Learner direct-launch hook leaked into production workspace" >&2
            exit 1
          fi

      - name: Generate Mercury title resources
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mr03-venv"
          . "$RUNNER_TEMP/mr03-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Install Metroskrew
        working-directory: vendor/pokeplatinum
        shell: bash
        run: sudo make skrew

      - name: Configure Mercury DS
        working-directory: vendor/pokeplatinum
        shell: bash
        run: make configure

      - name: Build production MR03 player ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage production MR03 ROM before CI harness
        shell: bash
        run: |
          mkdir -p mr03-artifact
          cp "$BUILD/pokeplatinum.us.nds" mr03-artifact/Pokemon_Mercury_MR03_Party_Move_Learner.nds
          sha256sum mr03-artifact/Pokemon_Mercury_MR03_Party_Move_Learner.nds > mr03-artifact/SHA256SUMS.txt
          cp mr03-party-move-learner.json mr03-artifact/
          cp mr03-move-learner.json mr03-artifact/
          cp mr03-modern-moves.json mr03-artifact/
          cp mr03-learnsets.json mr03-artifact/

      - name: Install CI-only normal-party-path setup
        shell: bash
        run: |
          python3 tools/install_mr03_party_path_harness.py \
            vendor/pokeplatinum \
            --report mr03-party-path-harness.json
          test "$(jq -r '.direct_party_launch' mr03-party-path-harness.json)" = "false"
          test "$(jq -r '.direct_move_learner_launch' mr03-party-path-harness.json)" = "false"

      - name: Rebuild CI party-path proof ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Exercise Start Menu to Move Learner in DeSmuME
        shell: bash
        run: |
          . "$RUNNER_TEMP/mr03-venv/bin/activate"
          pip install py-desmume
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import Keys, keymask

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("DeSmuME did not start MR03 proof ROM")

          frame = 0
          captures = []

          def cycle(count):
              global frame
              for _ in range(count):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"MR03 runtime stopped near frame {frame}")

          def press(key, hold=4, settle=60):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              cycle(hold)
              emu.input.keypad_rm_key(mask)
              cycle(settle)

          def snap(label):
              image = emu.screenshot()
              path = out / f"mr03-{len(captures):02d}-{label}-{frame:05d}.png"
              image.save(path)
              rgb = image.convert("RGB")
              colors = rgb.getcolors(maxcolors=256 * 384)
              unique = len(colors) if colors is not None else 256 * 384
              captures.append({
                  "label": label,
                  "frame": frame,
                  "file": path.name,
                  "unique_colors": unique,
                  "blank_like": unique < 16,
              })

          try:
              cycle(3600)
              snap("field-ready")

              press(Keys.KEY_X, settle=120)
              snap("start-menu")

              press(Keys.KEY_A, settle=180)
              snap("party-menu")

              press(Keys.KEY_A, settle=90)
              snap("pokemon-context")

              press(Keys.KEY_DOWN, settle=30)
              snap("move-learner-selected")

              press(Keys.KEY_A, settle=300)
              snap("move-learner-open")
          finally:
              emu.destroy()

          meta = {
              "gate": "MERCURY_MR03_PARTY_PATH_RUNTIME",
              "production_direct_launch": False,
              "ci_setup_only": True,
              "input_path": [
                  "X -> Start Menu",
                  "A -> POKEMON",
                  "A -> Garchomp context menu",
                  "DOWN -> MOVE LEARNER",
                  "A -> open learner",
              ],
              "captures": captures,
          }
          (out / "mr03-party-path-meta.json").write_text(json.dumps(meta, indent=2) + "\n")

          if len(captures) != 6:
              raise SystemExit("MR03 did not capture every party-path checkpoint")
          if any(row["blank_like"] for row in captures):
              raise SystemExit("MR03 party-path proof contained a blank-like checkpoint")
          PY

      - name: Stage MR03 runtime proof
        if: always()
        shell: bash
        run: |
          cp mr03-party-path-harness.json mr03-artifact/ 2>/dev/null || true
          cp runtime-preview/*.png mr03-artifact/ 2>/dev/null || true
          cp runtime-preview/mr03-party-path-meta.json mr03-artifact/ 2>/dev/null || true

      - name: Upload MR03 player ROM and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-mr03-party-move-learner
          path: mr03-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mercury MR03 — Party Move Learner"
            echo
            echo "- Production ROM retains normal Mercury/Platinum boot"
            echo "- Start Menu -> POKEMON -> selected Pokemon -> MOVE LEARNER"
            echo "- Option hidden for Eggs and Pokemon with no learnable moves"
            echo "- Closing learner returns to the same party slot"
            echo "- CI harness only creates a Garchomp and bypasses intro"
            echo "- Runtime proof navigates the actual Start Menu and party context using DS button input"
          } >> "$GITHUB_STEP_SUMMARY"
