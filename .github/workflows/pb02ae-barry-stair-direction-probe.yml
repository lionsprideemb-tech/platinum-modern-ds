name: PB02AE Barry Stair Direction Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ae-barry-stair-direction-probe.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Barry 1F near-stair state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10792752716/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/pb02ac-post-barry-upstairs.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ae-venv"
          . "$RUNNER_TEMP/pb02ae-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Probe adjacent staircase directions from known tile
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ae-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/pb02ac-post-barry-upstairs.dst")
          out=Path("pb02ae-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=500):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          tests=[
              ("UP_RIGHT", [Keys.KEY_UP, Keys.KEY_RIGHT]),
              ("UP_LEFT", [Keys.KEY_UP, Keys.KEY_LEFT]),
              ("UP_RIGHT_RIGHT", [Keys.KEY_UP, Keys.KEY_RIGHT, Keys.KEY_RIGHT]),
              ("UP_LEFT_UP", [Keys.KEY_UP, Keys.KEY_LEFT, Keys.KEY_UP]),
              ("RIGHT_UP", [Keys.KEY_RIGHT, Keys.KEY_UP]),
          ]

          for label,seq in tests:
              emu.savestate.load_file(str(state)); run(300); cap(label+"-start")
              for key in seq:
                  pulse(key,12,700)
              run(1200); cap(label+"-result")

          (out/"pb02ae-meta.json").write_text(json.dumps({
              "gate":"PB02AE_BARRY_STAIR_DIRECTION_PROBE",
              "tests":[x[0] for x in tests],
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AE screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ae-barry-stair-direction-proof
          path: pb02ae-play/
          if-no-files-found: error
          retention-days: 14
