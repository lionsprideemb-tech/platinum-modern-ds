name: PB02C Poke Ball Touch Play

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02c-pokeball-touch-play.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download sealed PB01 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip \
            > pb01-artifact.zip
          unzip -q pb01-artifact.zip -d pb01-artifact
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02c-venv"
          . "$RUNNER_TEMP/pb02c-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Play to Poke Ball and touch it
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02c-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom = Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          out = Path("pb02c-play")
          out.mkdir(exist_ok=True)

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("PB02C ROM did not boot")

          frame = 0
          captures = []

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02C emulator stopped at frame {frame}")

          def pulse(key, held=12, settle=300):
              mask = keymask(key)
              emu.input.keypad_add_key(mask)
              run(held)
              emu.input.keypad_rm_key(mask)
              run(settle)

          def touch(x, y, held=30, settle=500):
              emu.input.touch_set_pos(x, y)
              run(held)
              emu.input.touch_release()
              run(settle)

          def cap(label):
              img = emu.screenshot()
              name = f"{len(captures):02d}-{label}-{frame:05d}.png"
              img.save(out / name)
              colors = img.convert("RGB").getcolors(maxcolors=256*384)
              unique = len(colors) if colors is not None else 256*384
              captures.append({"stage":label,"frame":frame,"file":name,"unique_colors":unique})

          try:
              run(16000)
              cap("title")
              pulse(Keys.KEY_START, held=20, settle=700)

              for _ in range(6):
                  pulse(Keys.KEY_A)

              pulse(Keys.KEY_DOWN, held=8, settle=120)
              pulse(Keys.KEY_DOWN, held=8, settle=120)
              pulse(Keys.KEY_A, held=12, settle=400)
              cap("world-inhabited")

              pulse(Keys.KEY_A, held=12, settle=360)
              cap("have-a-pokeball")
              pulse(Keys.KEY_A, held=12, settle=360)
              cap("touch-pokeball-prompt")

              # Actual DS touch input on the center button of the bottom-screen Poké Ball.
              touch(128, 97, held=30, settle=600)
              cap("pokeball-touched")

              for i in range(1, 6):
                  pulse(Keys.KEY_A, held=12, settle=360)
                  cap(f"post-touch-a-{i:02d}")

              run(600)
              cap("stable-end")
          finally:
              emu.destroy()

          meta = {
              "gate":"PB02C_POKEBALL_TOUCH_REAL_PLAY",
              "source_rom_sha256":"87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16",
              "native_touch":{"x":128,"y":97},
              "last_frame":frame,
              "captures":captures,
              "visual_review_required":True
          }
          (out/"pb02c-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload PB02C visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02c-pokeball-touch-play-proof
          path: pb02c-play/
          if-no-files-found: error
          retention-days: 14
