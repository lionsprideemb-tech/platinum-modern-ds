name: Mercury 16-Bit Runtime Rebase Integration

# MR10D23 extends the green D21 stack with Berserk DNA and the reusable
# Enraged recoil state.

on:
  workflow_dispatch:
  push:
    branches: [feature/mr10-16bit-ability-storage]
    paths:
      - "tools/run_mr10d24_integration.py"
      - "tools/install_mr10d24*.py"
      - "tools/audit_mr10d24_final75.py"
      - "tools/rebase_mr10_runtime_to_16bit_namespace.py"
      - "tools/install_mr10_16bit_ability_storage.py"
      - "tools/install_mr10a2_16bit_full_namespace.py"
      - "data/mr10_ability_partition_16bit_full_identity.json"
      - ".github/workflows/mr10-16bit-runtime-rebase.yml"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum
  COMMUNITY_SOURCE_COMMIT: 4250c4bfbb2e8dddd117160cec9e1e8395dfe9f7

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-pip wget xz-utils libpng-dev rsync jq

      - name: Checkout pinned sources
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"
          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

          git clone https://github.com/lionsprideemb-tech/Pokemon-moves.git vendor/community-moves
          git -C vendor/community-moves checkout "$COMMUNITY_SOURCE_COMMIT"

      - name: Apply Mercury Platinum overlay
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Restore modern move namespace
        run: |
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum
          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr10c-modern-moves.json \
            --implemented-registry mr10c-implemented-moves.txt

      - name: Restore certified community moves CM01-CM09
        run: |
          for batch in 01 02 03 04 05; do
            python3 tools/install_cm01_community_moves.py               vendor/pokeplatinum               --batch "data/community_moves_cm${batch}.json"               --report "mr10d24a-cm${batch}-restore.json"
          done

          python3 tools/build_cm06_native_community_bulk.py             vendor/community-moves             vendor/pokeplatinum             --mercury-root .             --start-id 1048             --output mr10d24a-cm06-native-bulk.json             --report mr10d24a-cm06-selection.json
          test "$(jq -r '.selected_without_new_mechanics' mr10d24a-cm06-selection.json)" = "210"

          python3 tools/install_cm01_community_moves.py             vendor/pokeplatinum             --batch mr10d24a-cm06-native-bulk.json             --report mr10d24a-cm06-install.json

          python3 tools/install_cm01_community_moves.py             vendor/pokeplatinum             --batch data/community_moves_cm07.json             --report mr10d24a-cm07-install.json

          python3 tools/install_cm08_simple_effects.py             vendor/pokeplatinum             --report mr10d24a-cm08-effects.json
          python3 tools/install_cm01_community_moves.py             vendor/pokeplatinum             --batch data/community_moves_cm08.json             --report mr10d24a-cm08-install.json

          python3 tools/install_cm01_community_moves.py             vendor/pokeplatinum             --batch data/community_moves_cm09.json             --report mr10d24a-cm09-install.json

          test "$(jq -r '.last_community_id_this_pass' mr10d24a-cm09-install.json)" = "1283"
          test "$(jq -r '.total_community_moves_materialized' mr10d24a-cm09-install.json)" = "260"
          test "$(sed -n '1285p' vendor/pokeplatinum/generated/moves.txt)" = "MAX_MOVES"

      - name: Restore canonical Ability namespace
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mr10c-ability-namespace.json \
            --implemented-registry mr10c-implemented-abilities.txt

      - name: Rebuild all canonical mechanics
        run: |
          python3 tools/run_mr08_canonical_stack.py \
            vendor/pokeplatinum \
            --implemented-registry mr10c-implemented-abilities.txt \
            --reports-dir mr10c-mr08-reports \
            --report mr10c-mr08-stack.json
          test "$(jq -r '.status' mr10c-mr08-stack.json)" = "PASS"
          test "$(jq -r '.canonical_modern_implemented' mr10c-mr08-stack.json)" = "187"

      - name: Apply pending-species compile compatibility
        run: |
          python3 tools/install_mr10c0_missing_species_compat.py \
            vendor/pokeplatinum \
            --report mr10c0-species-compat.json
          test "$(jq -r '.status' mr10c0-species-compat.json)" = "PASS"

      - name: Apply approved safe canonical overrides
        run: |
          python3 tools/install_mr10b1_er_safe_scalar_overrides.py \
            vendor/pokeplatinum --partition data/mr10_safe_ability_partition.json \
            --report mr10c-b1.json
          python3 tools/install_mr10b2_safe_defensive_reaction_overrides.py \
            vendor/pokeplatinum --partition data/mr10_safe_ability_partition.json \
            --report mr10c-b2.json
          python3 tools/install_mr10b3_safe_precision_offense_status.py \
            vendor/pokeplatinum --partition data/mr10_safe_ability_partition.json \
            --report mr10c-b3.json

      - name: Normalize post-override symbols
        run: |
          python3 tools/install_mr10c0b_post_override_compat.py \
            vendor/pokeplatinum \
            --report mr10c0b-post-override-compat.json
          test "$(jq -r '.status' mr10c0b-post-override-compat.json)" = "PASS"

      - name: Materialize approved Mercury namespace
        run: |
          python3 tools/install_mr10a_custom_ability_namespace.py \
            vendor/pokeplatinum \
            --partition data/mr10_safe_ability_partition.json \
            --report mr10c-custom-namespace.json
          test "$(jq -r '.status' mr10c-custom-namespace.json)" = "PASS"
          test "$(jq -r '.review_blocked_custom_count' mr10c-custom-namespace.json)" = "0"

      - name: Implement approved custom mechanics batch C1
        run: |
          python3 tools/install_mr10c1_spectral_body.py \
            vendor/pokeplatinum \
            --partition data/mr10_safe_ability_partition.json \
            --implemented-registry mr10c-implemented-abilities.txt \
            --report mr10c1-spectral-body.json
          test "$(jq -r '.status' mr10c1-spectral-body.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr10c1-spectral-body.json)" = "1"

      - name: Implement approved custom mechanics batch C2
