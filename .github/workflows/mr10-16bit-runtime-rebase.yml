          test "$(jq -r '.status' mr10d23-berserk-dna.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr10d23-berserk-dna.json)" = "1"

      - name: Integrate final D24 mechanics and audit 75/75
        run: |
          python3 tools/run_mr10d24_integration.py             vendor/pokeplatinum             --implemented-registry mr10c-implemented-abilities.txt             --partition data/mr10_safe_ability_partition.json             --report-dir mr10d24-final-reports             --report mr10d24-final-integration.json
          test "$(jq -r '.status' mr10d24-final-integration.json)" = "PASS"
          test "$(jq -r '.stage_count' mr10d24-final-integration.json)" = "11"
          test "$(jq -r '.native_build_certified' mr10d24-final-integration.json)" = "false"

      - name: Rebase all runtime mechanics onto final 16-bit Ability IDs
        run: |
          python3 tools/rebase_mr10_runtime_to_16bit_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --partition data/mr10_ability_partition_16bit_full_identity.json \
            --implemented-registry mr10c-implemented-abilities.txt \
            --report mr10a3-runtime-namespace-rebase.json
          test "$(jq -r '.status' mr10a3-runtime-namespace-rebase.json)" = "PASS"
          test "$(jq -r '.final_registry_count' mr10a3-runtime-namespace-rebase.json)" = "1067"
          test "$(jq -r '.checks.all_previously_implemented_tokens_survive' mr10a3-runtime-namespace-rebase.json)" = "true"

      - name: Build native Platinum ROM
        working-directory: vendor/pokeplatinum
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"
          cp "$BUILD/pokeplatinum.us.nds" "$GITHUB_WORKSPACE/mercury-mr10-16bit-runtime-rebase.nds"
          sha256sum "$GITHUB_WORKSPACE/mercury-mr10-16bit-runtime-rebase.nds" > "$GITHUB_WORKSPACE/mercury-mr10-16bit-runtime-rebase.sha256"

