          test "$(jq -r '.implemented_count' mr10d18-cryo-architect.json)" = "1"

      - name: Consolidate Power Outage
        run: |
          python3 tools/install_mr10d17_power_outage.py \
            vendor/pokeplatinum \
            --partition data/mr10_safe_ability_partition.json \
            --implemented-registry mr10c-implemented-abilities.txt \
            --report mr10d18-power-outage.json
          test "$(jq -r '.status' mr10d18-power-outage.json)" = "PASS"
          test "$(jq -r '.implemented_count' mr10d18-power-outage.json)" = "1"

      - name: Consolidate Patchwork
        run: |
          python3 tools/install_mr10d15_patchwork.py \
