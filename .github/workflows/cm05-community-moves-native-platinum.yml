name: CM05 Community Moves Native Platinum

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/community_moves_cm01.json"
      - "data/community_moves_cm02.json"
      - "data/community_moves_cm03.json"
      - "data/community_moves_cm04.json"
      - "data/community_moves_cm05.json"
      - "tools/install_cm01_community_moves.py"
      - "tools/install_pt05d_animation_preview_harness.py"
      - ".github/workflows/cm05-community-moves-native-platinum.yml"

permissions:
  contents: read

concurrency:
  group: cm05-community-moves-native-platinum
  cancel-in-progress: true

env:
  BUILD: /var/tmp/pokeplatinum
  SDL_VIDEODRIVER: dummy

jobs:
  build-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq libsdl2-2.0-0 fonts-dejavu-core ffmpeg

      - name: Checkout pinned Platinum and HG-Engine donor
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply Mercury Platinum overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Rebuild complete 1025-species layer
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report cm05-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --gate "CM05_${tag}_RESOURCE_INSTALL" \
              --report "cm05-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Restore certified Gen 5-9 move foundation
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report cm05-modern-moves.json \
            --implemented-registry cm05-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves cm05-implemented-moves.txt \
            --report cm05-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report cm05-evolutions.json

      - name: Restore certified CM01 through CM04 community moves
        shell: bash
        run: |
          for batch in 01 02 03 04; do
            python3 tools/install_cm01_community_moves.py \
              vendor/pokeplatinum \
              --batch "data/community_moves_cm${batch}.json" \
              --report "cm05-cm${batch}-restore.json"
          done

          test "$(jq -r '.last_community_id_this_pass' cm05-cm01-restore.json)" = "1026"
          test "$(jq -r '.last_community_id_this_pass' cm05-cm02-restore.json)" = "1029"
          test "$(jq -r '.last_community_id_this_pass' cm05-cm03-restore.json)" = "1035"
          test "$(jq -r '.last_community_id_this_pass' cm05-cm04-restore.json)" = "1041"
          test "$(jq -r '.total_community_moves_materialized' cm05-cm04-restore.json)" = "18"

      - name: Install CM05 community moves
        shell: bash
        run: |
          python3 tools/install_cm01_community_moves.py \
            vendor/pokeplatinum \
            --batch data/community_moves_cm05.json \
            --report cm05-community-moves-install.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          moves = Path("vendor/pokeplatinum/generated/moves.txt").read_text().splitlines()
          expected = {
              1024: "MOVE_DRACONIC_FANGS",
              1035: "MOVE_PRIMAL_BEAM",
              1036: "MOVE_SHOCKING_JAB",
              1041: "MOVE_TECTONIC_FANGS",
              1042: "MOVE_PHANTOM_GLOVES",
              1043: "MOVE_PEBBLE_SHOWER",
              1044: "MOVE_BIG_BLAST",
              1045: "MOVE_DRAGON_DASH",
              1046: "MOVE_MERCULIGHT",
              1047: "MOVE_SPREAD_BOMB",
              1048: "MAX_MOVES",
          }
          for move_id, token in expected.items():
              assert moves[move_id] == token, (move_id, moves[move_id], token)

          report = json.loads(Path("cm05-community-moves-install.json").read_text())
          assert report["community_moves_installed_this_pass"] == 6
          assert report["reserved_placeholder_count_added_this_pass"] == 0
          assert report["total_community_moves_materialized"] == 24
          print("CM05 registry layout: PASS")
          PY

      - name: Install native battle proof for Phantom Glove
        shell: bash
        run: |
          python3 tools/install_pt04c_runtime_harness.py \
            vendor/pokeplatinum --report cm05-base-party.json
          python3 tools/install_pt04c_summary_harness.py \
            vendor/pokeplatinum --report cm05-base-summary.json
          python3 tools/install_pt04c_pc_harness.py \
            vendor/pokeplatinum --report cm05-base-pc.json
          python3 tools/install_pt04c_battle_harness.py \
            vendor/pokeplatinum --report cm05-base-battle.json

          python3 tools/install_pt05d_animation_preview_harness.py \
            vendor/pokeplatinum \
            --move MOVE_PHANTOM_GLOVES \
            --preview-id cm05_1042 \
            --report cm05-runtime-harness.json

          grep -q 'MOVE_PHANTOM_GLOVES' vendor/pokeplatinum/src/field_map_change.c

      - name: Verify CM05 native animation sources
        shell: bash
        run: |
          cmp vendor/pokeplatinum/res/moves/phantom_gloves/anim.s vendor/pokeplatinum/res/moves/shadow_claw/anim.s
          cmp vendor/pokeplatinum/res/moves/pebble_shower/anim.s vendor/pokeplatinum/res/moves/rock_slide/anim.s
          cmp vendor/pokeplatinum/res/moves/big_blast/anim.s vendor/pokeplatinum/res/moves/hyper_beam/anim.s
          cmp vendor/pokeplatinum/res/moves/dragon_dash/anim.s vendor/pokeplatinum/res/moves/dragon_rush/anim.s
          cmp vendor/pokeplatinum/res/moves/merculight/anim.s vendor/pokeplatinum/res/moves/protect/anim.s
          cmp vendor/pokeplatinum/res/moves/spread_bomb/anim.s vendor/pokeplatinum/res/moves/explosion/anim.s

      - name: Build native Platinum with CM01 through CM05
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Run Phantom Glove native runtime proof
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cm05-venv"
          . "$RUNNER_TEMP/cm05-venv/bin/activate"
          pip install --upgrade pip
          pip install py-desmume Pillow

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom = Path("/var/tmp/pokeplatinum/pokeplatinum.us.nds")
          out = Path("runtime-preview")
          out.mkdir(exist_ok=True)
          mp4 = out / "cm05-phantom-glove-native-platinum.mp4"

          emu = DeSmuME()
          emu.open(str(rom))
          if not emu.is_running():
              raise SystemExit("CM05 native Platinum ROM did not boot")

          fps = 15
          sample_every = 4
          proc = subprocess.Popen([
              "ffmpeg", "-y", "-loglevel", "error",
              "-f", "rawvideo", "-pix_fmt", "rgb24",
              "-s", "256x192", "-r", str(fps), "-i", "-",
              "-an", "-c:v", "libx264", "-preset", "veryfast",
              "-crf", "25", "-pix_fmt", "yuv420p", "-movflags", "+faststart",
              str(mp4)
          ], stdin=subprocess.PIPE)

          current = 0
          written = 0

          def cycle(frames):
              global current, written
              for _ in range(frames):
                  emu.cycle(False)
                  current += 1
                  if not emu.is_running():
                      raise SystemExit(f"CM05 emulator stopped at frame {current}")
                  if current % sample_every == 0:
                      image = emu.screenshot().crop((0, 0, 256, 192)).convert("RGB")
                      proc.stdin.write(image.tobytes())
                      written += 1

          def pulse_a(held=20, settle=180):
              emu.input.keypad_add_key(keymask(Keys.KEY_A))
              cycle(held)
              emu.input.keypad_rm_key(keymask(Keys.KEY_A))
              cycle(settle)

          try:
              cycle(1500)
              for _ in range(14):
                  pulse_a()
              cycle(800)
              emu.screenshot().save(out / "cm05-phantom-glove-final.png")
          finally:
              try:
                  if proc.stdin is not None:
                      proc.stdin.close()
                  rc = proc.wait()
                  if rc != 0:
                      raise SystemExit(f"ffmpeg failed with exit code {rc}")
              finally:
                  emu.destroy()

          if written < 100 or not mp4.exists() or mp4.stat().st_size < 10_000:
              raise SystemExit("CM05 runtime video proof is incomplete")

          meta = {
              "gate": "CM05_PHANTOM_GLOVE_NATIVE_RUNTIME",
              "runtime": "pokeplatinum",
              "move_id": 1042,
              "move": "MOVE_PHANTOM_GLOVES",
              "mechanics": {
                  "type": "Ghost",
                  "class": "Physical",
                  "power": 85,
                  "accuracy": 100,
                  "pp": 10,
                  "effect": "BATTLE_EFFECT_SPEED_DOWN_HIT",
                  "effect_chance": 30
              },
              "animation": "native Platinum Shadow Claw animation",
              "captured_frames": written,
              "emulator_cycles": current,
              "mp4": mp4.name,
              "mp4_bytes": mp4.stat().st_size,
              "visual_review_required": True
          }
          (out / "cm05-meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload CM05 proof
        uses: actions/upload-artifact@v4
        with:
          name: cm05-community-moves-native-platinum-proof
          path: |
            cm05-community-moves-install.json
            cm05-runtime-harness.json
            runtime-preview/cm05-phantom-glove-native-platinum.mp4
            runtime-preview/cm05-phantom-glove-final.png
            runtime-preview/cm05-meta.json
          if-no-files-found: error
          retention-days: 14

      - name: CM05 summary
        shell: bash
        run: |
          {
            echo "## CM05 community move implementation"
            echo
            echo "- Native runtime: pokeplatinum"
            echo "- CM01 through CM04 retained at IDs 1024-1041"
            echo "- Six new moves installed at IDs 1042-1047"
            echo "- All six animation sources verified against native Platinum donors"
            echo "- Phantom Glove exercised in a real native Platinum battle"
            echo "- Community move total: 24"
          } >> "$GITHUB_STEP_SUMMARY"
