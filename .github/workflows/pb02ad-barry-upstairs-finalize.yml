name: PB02AD Barry Upstairs Finalize

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ad-barry-upstairs-finalize.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and corrected Barry 1F state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10792752716/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/pb02ac-post-barry-upstairs.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ad-venv"
          . "$RUNNER_TEMP/pb02ad-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Step onto stairs and complete automatic upstairs event
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ad-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/pb02ac-post-barry-upstairs.dst")
          out=Path("pb02ad-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=500):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("barry-1f-near-stairs")

          # PB02AC visual review shows player exactly two north steps from the 1F stair warp.
          pulse(Keys.KEY_UP,12,350); cap("stairs-approach")
          pulse(Keys.KEY_UP,12,1400); cap("barry-2f-arrival-event")
          run(1000); cap("barry-2f-message-visible")

          # Native 2F event: first message closes, then Barry notices player;
          # second message spans two pages before he leaves.
          for i in range(1,5):
              pulse(Keys.KEY_A,12,1300)
              cap(f"barry-2f-a-{i:02d}")

          run(2200); cap("barry-left-home-event-complete")

          # Field-control proof.
          pulse(Keys.KEY_DOWN,12,300); cap("barry-2f-field-control")

          saved=out/"pb02ad-post-barry-left-home.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02ad-meta.json").write_text(json.dumps({
              "gate":"PB02AD_BARRY_UPSTAIRS_FINALIZE",
              "source_artifact":10792752716,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"exit Barry house and fast-certify Route 201 / Lake Verity"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02AD proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ad-barry-upstairs-final-proof
          path: pb02ad-play/
          if-no-files-found: error
          retention-days: 14
