name: PB02W Barry Stair Targeted Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02w-barry-stair-targeted.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Barry 1F checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10789744924/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/barry-house-1f.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02w-venv"
          . "$RUNNER_TEMP/pb02w-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Probe targeted stair routes
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02w-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/barry-house-1f.dst")
          out=Path("pb02w-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=230):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          def reset(label):
              emu.savestate.load_file(str(state)); run(250); cap(label)

          tests = [
              ("L4_U5_R5_U1", [(Keys.KEY_LEFT,4),(Keys.KEY_UP,5),(Keys.KEY_RIGHT,5),(Keys.KEY_UP,1)]),
              ("L4_U5_R6_U1", [(Keys.KEY_LEFT,4),(Keys.KEY_UP,5),(Keys.KEY_RIGHT,6),(Keys.KEY_UP,1)]),
              ("L4_U6_R4",    [(Keys.KEY_LEFT,4),(Keys.KEY_UP,6),(Keys.KEY_RIGHT,4)]),
              ("L4_U6_R5",    [(Keys.KEY_LEFT,4),(Keys.KEY_UP,6),(Keys.KEY_RIGHT,5)]),
              ("L4_U5_R5",    [(Keys.KEY_LEFT,4),(Keys.KEY_UP,5),(Keys.KEY_RIGHT,5)]),
          ]

          for label,seq in tests:
              reset(label+"-start")
              for key,count in seq:
                  for _ in range(count): pulse(key)
              run(1000)
              cap(label+"-result")

          (out/"pb02w-meta.json").write_text(json.dumps({
              "gate":"PB02W_BARRY_STAIR_TARGETED_PROBE",
              "source_checkpoint_artifact":10789744924,
              "tests":[x[0] for x in tests],
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02W screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02w-barry-stair-targeted-proof
          path: pb02w-play/
          if-no-files-found: error
          retention-days: 14
