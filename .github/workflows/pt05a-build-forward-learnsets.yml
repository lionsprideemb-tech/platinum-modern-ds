name: PT05A Build-Forward Compatible Learnsets

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mercury-build-forward
    paths:
      - "tools/install_pt05a_compatible_learnsets.py"
      - "tools/install_pt04d_species_batch.py"
      - "tools/build_species_registry.py"
      - "data/canonical_species_1025.txt"
      - "platinum-overlay/**"
      - "assets/title_screen/**"
      - ".github/workflows/pt05a-build-forward-learnsets.yml"
      - "upstream/LOCK.json"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  build-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq fonts-dejavu-core

      - name: Checkout pinned Platinum and donor
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply Mercury overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Rebuild canonical 1025-species resource layer
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report pt05a-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --gate "PT05A_${tag}_RESOURCE_INSTALL" \
              --report "pt05a-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

      - name: Install compatible modern learnsets
        shell: bash
        run: |
          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report pt05a-compatible-learnsets.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("pt05a-compatible-learnsets.json").read_text())
          assert report["species_imported"] >= 500, report["species_imported"]

          checks=["victini","snivy","gurdurr","pawniard","sprigatito","pecharunt"]
          for name in checks:
              path=Path("vendor/pokeplatinum/res/pokemon")/name/"data.json"
              if not path.exists():
                  continue
              data=json.loads(path.read_text())
              moves=data["learnset"]["by_level"]
              if len(moves) < 2 and name not in {"pecharunt"}:
                  raise SystemExit(f"{name} still has placeholder-sized learnset: {moves}")
              print(name, len(moves), moves[:6])
          PY

      - name: Generate Mercury title
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pt05a-venv"
          . "$RUNNER_TEMP/pt05a-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Build normal game ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage build-forward artifact
        shell: bash
        run: |
          mkdir -p build-forward
          cp "$BUILD/pokeplatinum.us.nds" build-forward/Pokemon_Mercury_Redux_PT05A.nds
          cp pt05a-compatible-learnsets.json build-forward/
          sha256sum build-forward/Pokemon_Mercury_Redux_PT05A.nds > build-forward/SHA256SUMS.txt

      - name: Upload PT05A build
        uses: actions/upload-artifact@v4
        with:
          name: mercury-redux-pt05a-compatible-learnsets
          path: build-forward/
          if-no-files-found: error
          retention-days: 30
