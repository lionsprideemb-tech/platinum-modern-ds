name: PB02S Enter Barry House

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02s-enter-barry-house.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and Twinleaf checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact checkpoint
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10789223904/zip > checkpoint.zip
          unzip -q checkpoint.zip -d checkpoint
          test -s checkpoint/twinleaf-exterior.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02s-venv"
          . "$RUNNER_TEMP/pb02s-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Align with Barry door and enter
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02s-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/twinleaf-exterior.dst")
          out=Path("pb02s-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"stopped at {frame}")

          def pulse(key,held=12,settle=320):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              im=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              im.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("checkpoint")

          # Q visually mapped the westward path.
          for _ in range(8): pulse(Keys.KEY_LEFT,12,240)
          cap("west-eight")
          pulse(Keys.KEY_UP,12,320); cap("north-one")
          pulse(Keys.KEY_LEFT,12,320); cap("door-aligned")
          pulse(Keys.KEY_UP,12,1000); cap("door-entry-attempt")
          run(800); cap("entry-stable")

          # Advance any automatic Barry/house dialogue cautiously.
          for i in range(1,7):
              pulse(Keys.KEY_A,12,450)
              cap(f"inside-a-{i:02d}")

          run(700); cap("inside-final")

          (out/"pb02s-meta.json").write_text(json.dumps({
              "gate":"PB02S_ENTER_BARRY_HOUSE",
              "source_checkpoint_artifact":10789223904,
              "last_resumed_frame":frame,
              "captures":caps,
              "visual_review_required":True
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload PB02S screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02s-enter-barry-house-proof
          path: pb02s-play/
          if-no-files-found: warn
          retention-days: 14
