name: MP05C Stateless Scalar Abilities

on:
  push:
    branches:
      - feature/modern-platinum-fast
    paths:
      - ".github/workflows/mp05c-stateless-scalar-abilities.yml"
      - "tools/install_mp05c_scalar_abilities.py"

permissions:
  contents: read

env:
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 160

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi git make ninja-build \
            pkg-config python3 python3-venv python3-pip wget xz-utils \
            libpng-dev rsync jq fonts-dejavu-core

      - name: Checkout pinned Platinum and HG-Engine
        shell: bash
        run: |
          git clone https://github.com/pret/pokeplatinum.git vendor/pokeplatinum
          git -C vendor/pokeplatinum checkout "$(jq -r '.sources["pokeplatinum"].commit' upstream/LOCK.json)"

          git clone --filter=blob:none --no-checkout https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine sparse-checkout init --no-cone
          git -C vendor/hg-engine sparse-checkout set \
            /include/constants/ability.h \
            /include/constants/moves.h \
            /include/constants/move_effects.h \
            /data/text/720.txt \
            /data/text/721.txt \
            /data/text/722.txt \
            /data/Moves.c \
            /data/Species.c \
            /data/BaseExperienceTable.c \
            /data/IconPaletteTable.c \
            /data/HeightTable.c \
            /data/SpriteOffsets.c \
            /data/Evolutions.c \
            /data/graphics/sprites/ \
            /data/learnsets/learnsets.json \
            /data/learnsets/base/21_sv.json
          git -C vendor/hg-engine checkout "$(jq -r '.sources["hg-engine"].commit' upstream/LOCK.json)"

      - name: Apply sealed PB04 Mercury overlay
        shell: bash
        run: rsync -a --exclude README.md platinum-overlay/ vendor/pokeplatinum/

      - name: Syntax gate
        shell: bash
        run: |
          python3 -m py_compile \
            tools/install_mp05_ability_namespace.py \
            tools/install_mp05c_scalar_abilities.py \
            tools/install_pt04d_species_batch.py

      - name: Restore MP05 canonical ability architecture
        shell: bash
        run: |
          python3 tools/install_mp05_ability_namespace.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mp05c-ability-namespace.json \
            --implemented-registry mp05c-implemented-abilities.txt

          test "$(wc -l < mp05c-implemented-abilities.txt)" = "124"
          test "$(wc -l < vendor/pokeplatinum/generated/abilities.txt)" = "311"

      - name: Install first exact modern ability family
        shell: bash
        run: |
          python3 tools/install_mp05c_scalar_abilities.py \
            vendor/pokeplatinum \
            --implemented-registry mp05c-implemented-abilities.txt \
            --report mp05c-scalar-abilities.json

          test "$(jq -r '.abilities_added_count' mp05c-scalar-abilities.json)" = "7"
          test "$(jq -r '.implemented_ability_count' mp05c-scalar-abilities.json)" = "131"
          test "$(jq -r '.approximate_mechanics' mp05c-scalar-abilities.json)" = "false"

          for ability in \
            ABILITY_TOXIC_BOOST \
            ABILITY_FLARE_BOOST \
            ABILITY_FUR_COAT \
            ABILITY_STEELWORKER \
            ABILITY_TRANSISTOR \
            ABILITY_DRAGONS_MAW \
            ABILITY_ROCKY_PAYLOAD; do
            grep -qx "$ability" mp05c-implemented-abilities.txt
          done

      - name: Rebuild 1025 species with only implemented abilities live
        shell: bash
        run: |
          python3 tools/build_species_registry.py vendor/pokeplatinum \
            --through 1025 \
            --output vendor/pokeplatinum/generated/species.txt \
            --report mp05c-species-registry.json

          while read -r start end tag; do
            python3 tools/install_pt04d_species_batch.py \
              vendor/pokeplatinum vendor/hg-engine \
              --start-dex "$start" --end-dex "$end" \
              --implemented-abilities mp05c-implemented-abilities.txt \
              --gate "MP05C_${tag}_RESOURCE_INSTALL" \
              --report "mp05c-${tag}.json"
          done <<'EOF'
          494 649 GEN5
          650 721 GEN6
          722 809 GEN7
          810 905 GEN8
          906 1025 GEN9
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          checks = {
              "furfrou": "ABILITY_FUR_COAT",
              "dhelmise": "ABILITY_STEELWORKER",
              "regieleki": "ABILITY_TRANSISTOR",
              "regidrago": "ABILITY_DRAGONS_MAW",
          }
          for species, ability in checks.items():
              path = Path("vendor/pokeplatinum/res/pokemon") / species / "data.json"
              data = json.loads(path.read_text())
              if ability not in data["abilities"]:
                  raise SystemExit(
                      f"{species}: expected implemented {ability}, got {data['abilities']}"
                  )
              print(species, data["abilities"])

          remaining = 0
          for tag in ("GEN5","GEN6","GEN7","GEN8","GEN9"):
              data=json.loads(Path(f"mp05c-{tag}.json").read_text())
              remaining += len(data["exceptions"]["unsupported_abilities"])
          print("remaining deliberately deferred ability assignments:", remaining)
          PY

      - name: Restore MP04 move learnset and evolution foundation
        shell: bash
        run: |
          python3 tools/audit_move_id_namespace.py
          python3 tools/install_pt05c_move_id_width.py vendor/pokeplatinum

          python3 tools/install_pt05c1_modern_moves.py \
            vendor/pokeplatinum vendor/hg-engine \
            --report mp05c-modern-moves.json \
            --implemented-registry mp05c-implemented-moves.txt

          python3 tools/install_pt05a_compatible_learnsets.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --implemented-moves mp05c-implemented-moves.txt \
            --report mp05c-learnsets.json

          python3 tools/install_pt05b_compatible_evolutions.py \
            vendor/pokeplatinum vendor/hg-engine \
            --start-dex 494 --end-dex 1025 \
            --report mp05c-evolutions.json

      - name: Static mechanics audit
        shell: bash
        run: |
          set -euo pipefail
          B=vendor/pokeplatinum/src/battle/battle_lib.c
          grep -q 'ABILITY_TOXIC_BOOST' "$B"
          grep -q 'ABILITY_FLARE_BOOST' "$B"
          grep -q 'ABILITY_FUR_COAT' "$B"
          grep -q 'ABILITY_STEELWORKER' "$B"
          grep -q 'ABILITY_TRANSISTOR' "$B"
          grep -q 'ABILITY_DRAGONS_MAW' "$B"
          grep -q 'ABILITY_ROCKY_PAYLOAD' "$B"
          grep -q 'MON_CONDITION_ANY_POISON' "$B"
          grep -q 'MON_CONDITION_BURN' "$B"
          echo "MP05C scalar mechanics source audit: PASS"

      - name: Generate Mercury title
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mp05c-venv"
          . "$RUNNER_TEMP/mp05c-venv/bin/activate"
          pip install --upgrade pip Pillow
          python3 tools/generate_mercury_title.py vendor/pokeplatinum

      - name: Build full Modern Platinum ROM
        working-directory: vendor/pokeplatinum
        shell: bash
        run: |
          sudo make skrew
          make configure
          make rom
          test -s "$BUILD/pokeplatinum.us.nds"

      - name: Stage MP05C proof
        shell: bash
        run: |
          mkdir -p mp05c-proof
          cp "$BUILD/pokeplatinum.us.nds" mp05c-proof/Pokemon_Mercury_Modern_Platinum_MP05C.nds
          cp mp05c-ability-namespace.json mp05c-proof/
          cp mp05c-scalar-abilities.json mp05c-proof/
          cp mp05c-implemented-abilities.txt mp05c-proof/
          sha256sum mp05c-proof/Pokemon_Mercury_Modern_Platinum_MP05C.nds > mp05c-proof/SHA256SUMS.txt

          {
            echo "MP05C stateless scalar ability family"
            echo "New exact ability behaviors: 7"
            echo "Implemented ability registry size: 131"
            echo "No new battle state, switching logic, terrain, or form state"
            echo "Unported modern abilities remain gated out of live species data"
            echo "Full ROM compile required"
            echo "Long runtime playtest intentionally skipped"
          } > mp05c-proof/MP05C_MANIFEST.txt

      - name: Upload MP05C proof
        uses: actions/upload-artifact@v4
        with:
          name: mercury-modern-platinum-mp05c-scalar-abilities
          path: mp05c-proof/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## MP05C stateless scalar abilities"
            echo
            echo "- Toxic Boost / Flare Boost: PASS"
            echo "- Fur Coat: PASS"
            echo "- Steelworker / Dragon's Maw / Transistor / Rocky Payload: PASS"
            echo "- Modern species assignment gated by implemented registry: PASS"
            echo "- Full native DS ROM compile: PASS"
            echo "- Long runtime playthrough: intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"
