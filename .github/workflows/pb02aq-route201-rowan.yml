name: PB02AQ Route 201 Rowan Starter Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02aq-route201-rowan.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download ROM and clean Twinleaf exterior state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10808128616/zip > state.zip
          unzip -q state.zip -d checkpoint
          test -s checkpoint/twinleaf-post-barry-exterior.dst

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02aq-venv"
          . "$RUNNER_TEMP/pb02aq-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Walk to Route 201 and fast-play Rowan scene
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02aq-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/twinleaf-post-barry-exterior.dst")
          out=Path("pb02aq-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame+=1
                  if not emu.is_running(): raise SystemExit(f"PB02AQ stopped at {frame}")

          def pulse(key,held=12,settle=600):
              m=keymask(key); emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot(); name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name); caps.append({"stage":label,"frame":frame,"file":name})

          cap("twinleaf-post-barry")

          # Barry house exterior is at x105. Route 201 opening trigger accepts
          # x110-113 at z857, so join the central road then head north.
          for _ in range(5): pulse(Keys.KEY_RIGHT,12,230)
          cap("central-road-x110")

          for i in range(1,21):
              pulse(Keys.KEY_UP,12,250)
              if i in (5,10,15,19,20): cap(f"north-{i:02d}")

          run(1200); cap("route201-event-start")

          # Untouched Platinum dialogue. Both yes/no menus default to YES.
          # 28 confirmations intentionally stop at/just before the briefcase gate.
          for i in range(1,29):
              pulse(Keys.KEY_A,12,900)
              if i in (4,8,12,16,20,24,28):
                  cap(f"rowan-a-{i:02d}")

          run(1800); cap("starter-gate-stable")

          saved=out/"route201-rowan-starter-gate.dst"
          emu.savestate.save_file(str(saved))

          (out/"pb02aq-meta.json").write_text(json.dumps({
              "gate":"PB02AQ_ROUTE201_ROWAN_STARTER_GATE",
              "source_artifact":10808128616,
              "route":"RIGHT x5, UP x20",
              "dialogue_confirmations":28,
              "output_state":saved.name,
              "captures":caps,
              "visual_review_required":True,
              "next":"choose starter, certify first rival battle, then Lake Verity/Sandgem fast pass"
          },indent=2)+"\n")
          emu.destroy()
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02aq-route201-rowan-proof
          path: pb02aq-play/
          if-no-files-found: error
          retention-days: 14
