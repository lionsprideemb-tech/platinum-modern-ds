name: PB02AI Certified Barry Upstairs Chain

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02ai-certified-barry-upstairs.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download PB01 ROM and PB02AA state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom checkpoint
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10776204522/zip > pb01.zip
          unzip -q pb01.zip -d rom
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/10790910656/zip > pb02aa.zip
          unzip -q pb02aa.zip -d checkpoint
          test -s checkpoint/post-barry-thud-confirmed.dst
          test "$(sha256sum rom/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02ai-venv"
          . "$RUNNER_TEMP/pb02ai-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Run proven THUD path and corrected stair route
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02ai-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import ImageChops, ImageStat
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          rom=Path("rom/Pokemon_Mercury_Redux_PB01.nds")
          state=Path("checkpoint/post-barry-thud-confirmed.dst")
          out=Path("pb02ai-play"); out.mkdir(exist_ok=True)
          emu=DeSmuME(); emu.open(str(rom)); emu.savestate.load_file(str(state))
          frame=0; caps=[]

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False); frame += 1
                  if not emu.is_running(): raise SystemExit(f"PB02AI stopped at {frame}")

          def pulse(key,held=12,settle=500):
              m=keymask(key)
              emu.input.keypad_add_key(m); run(held)
              emu.input.keypad_rm_key(m); run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(caps):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              caps.append({"stage":label,"frame":frame,"file":name})
              return img

          def textbox(img):
              r,g,b=img.convert("RGB").getpixel((20,165))
              return r>180 and g>180 and b>180

          def indoor(img):
              r,g,b=img.convert("RGB").getpixel((10,50))
              return r<12 and g<12 and b<12

          cap("pb02aa-source")

          # Visually proven PB02AC sequence.
          for _ in range(3): pulse(Keys.KEY_UP,12,450)
          thud=cap("thud-visible")
          if not textbox(thud):
              raise SystemExit("PB02AI: THUD text did not appear")

          for i in range(1,6):
              pulse(Keys.KEY_A,12,1100)
              cap(f"thud-a-{i:02d}")
          run(1800)
          post_thud=cap("thud-complete-field")
          if textbox(post_thud):
              raise SystemExit("PB02AI: THUD dialogue still open")

          pulse(Keys.KEY_UP,12,450); cap("door-approach")
          pulse(Keys.KEY_UP,12,1200)
          one_f=cap("barry-house-1f-arrival")
          if not indoor(one_f):
              raise SystemExit("PB02AI: did not enter Barry house 1F")
          run(700); cap("barry-house-1f-stable")

          # Visual review showed the prior route stopped one tile short.
          # From this exact entrance, LEFT x3 then UP x7 crosses the stair warp.
          for _ in range(3): pulse(Keys.KEY_LEFT,12,240)
          for i in range(1,8):
              pulse(Keys.KEY_UP,12,280)
              if i in (6,7): cap(f"stair-up-{i:02d}")
          # Native warp is (2,3); after LEFT x3 / UP x7 we are at (3,3).
          # One final LEFT crosses the stair warp.
          pulse(Keys.KEY_LEFT,12,1200)
          cap("barry-house-2f-arrival")
          run(900)
          first=cap("barry-2f-first-message")
          if not textbox(first):
              raise SystemExit("PB02AI: Barry 2F OnFrame message did not begin")

          # Take Bag/Journal + Waiting on Road, including all pages.
          for i in range(1,7):
              pulse(Keys.KEY_A,12,1100)
              cap(f"barry-2f-a-{i:02d}")
          run(2800)
          stable=cap("barry-departure-stable")
          if textbox(stable):
              raise SystemExit("PB02AI: Barry upstairs dialogue still open")

          # Prove ReleaseAll with a real movement delta.
          base=emu.screenshot().convert("RGB")
          pulse(Keys.KEY_DOWN,12,500)
          after=emu.screenshot().convert("RGB")
          mean=sum(ImageStat.Stat(ImageChops.difference(base,after)).mean)/3
          cap("post-barry-field-control")
          if mean<=1.0:
              raise SystemExit("PB02AI: field control not restored after Barry departure")

          saved=out/"post-barry-left-home-certified.dst"
          emu.savestate.save_file(str(saved))
          cap("certified-state")

          meta={
              "gate":"PB02AI_CERTIFIED_BARRY_UPSTAIRS_CHAIN",
              "source_artifact":10790910656,
              "thud_confirmations":5,
              "house_entry":"UP x2 after THUD",
              "stair_route":"LEFT x3, UP x7, LEFT x1",
              "field_control_proved":True,
              "output_state":saved.name,
              "captures":caps,
              "next":"PB02AJ exit Barry house and fast-certify Route 201 starter scene"
          }
          (out/"pb02ai-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          emu.destroy()
          PY

      - name: Upload PB02AI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02ai-barry-upstairs-certified
          path: pb02ai-play/
          if-no-files-found: error
          retention-days: 14
