name: PB02D Reach Player Selection

on:
  workflow_dispatch:
  push:
    branches:
      - feature/playable-baseline
    paths:
      - ".github/workflows/pb02d-player-selection.yml"

permissions:
  actions: read
  contents: read

env:
  SDL_VIDEODRIVER: dummy

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Mercury DS
        uses: actions/checkout@v4

      - name: Download sealed PB01 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pb01-artifact
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10776204522/zip \
            > pb01-artifact.zip
          unzip -q pb01-artifact.zip -d pb01-artifact
          test "$(sha256sum pb01-artifact/Pokemon_Mercury_Redux_PB01.nds | awk '{print $1}')" = "87a8f97f884b5496a16fa7b1b85ea6589e9e9e1cf4a03e9110ecdc09dfe91f16"

      - name: Install emulator
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 python3-venv
          python3 -m venv "$RUNNER_TEMP/pb02d-venv"
          . "$RUNNER_TEMP/pb02d-venv/bin/activate"
          pip install --upgrade pip py-desmume Pillow

      - name: Play to player selection
        shell: bash
        run: |
          . "$RUNNER_TEMP/pb02d-venv/bin/activate"
          python3 - <<'PY'
          from pathlib import Path
          import json
          from desmume.emulator import DeSmuME
          from desmume.controls import keymask, Keys

          out = Path("pb02d-play")
          out.mkdir(exist_ok=True)
          emu = DeSmuME()
          emu.open("pb01-artifact/Pokemon_Mercury_Redux_PB01.nds")
          frame = 0
          captures = []

          def run(n):
              global frame
              for _ in range(n):
                  emu.cycle(False)
                  frame += 1
                  if not emu.is_running():
                      raise SystemExit(f"PB02D emulator stopped at {frame}")

          def pulse(key, held=12, settle=320):
              m = keymask(key)
              emu.input.keypad_add_key(m)
              run(held)
              emu.input.keypad_rm_key(m)
              run(settle)

          def touch(x,y,held=30,settle=600):
              emu.input.touch_set_pos(x,y)
              run(held)
              emu.input.touch_release()
              run(settle)

          def cap(label):
              img=emu.screenshot()
              name=f"{len(captures):02d}-{label}-{frame:05d}.png"
              img.save(out/name)
              colors=img.convert("RGB").getcolors(maxcolors=256*384)
              captures.append({"stage":label,"frame":frame,"file":name,
                "unique_colors":len(colors) if colors is not None else 256*384})

          try:
              run(16000)
              pulse(Keys.KEY_START,20,700)
              for _ in range(6): pulse(Keys.KEY_A)
              pulse(Keys.KEY_DOWN,8,120)
              pulse(Keys.KEY_DOWN,8,120)
              pulse(Keys.KEY_A,12,400)

              # World inhabited -> have Poké Ball -> touch prompt
              pulse(Keys.KEY_A,12,360)
              pulse(Keys.KEY_A,12,360)
              touch(128,97)

              # Advance the exact dialogue pages already visually proven in PB02C.
              for _ in range(5): pulse(Keys.KEY_A,12,360)
              cap("what-do-i-do")

              # Probe the final pre-selection dialogue without confirming a choice.
              for i in range(1,4):
                  pulse(Keys.KEY_A,12,400)
                  cap(f"selection-probe-{i:02d}")

              run(700)
              cap("stable-selection-end")
          finally:
              emu.destroy()

          meta={
              "gate":"PB02D_PLAYER_SELECTION_REAL_PLAY",
              "last_frame":frame,
              "captures":captures,
              "visual_review_required":True,
              "rule":"no gender/player choice intentionally confirmed in this probe"
          }
          (out/"pb02d-meta.json").write_text(json.dumps(meta,indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload PB02D player-selection proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb02d-player-selection-proof
          path: pb02d-play/
          if-no-files-found: error
          retention-days: 14
